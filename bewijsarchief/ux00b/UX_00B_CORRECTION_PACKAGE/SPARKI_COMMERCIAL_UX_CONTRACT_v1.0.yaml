schema: sparki.commercial_ux_contract
version: "1.0"
date: "2026-07-25"
status: FIGMA_WAVE_1_APPROVED_READY_FOR_REPLIT_MAPPING

source_evidence:
  UX_00A_COMPLETE_EVIDENCE:
