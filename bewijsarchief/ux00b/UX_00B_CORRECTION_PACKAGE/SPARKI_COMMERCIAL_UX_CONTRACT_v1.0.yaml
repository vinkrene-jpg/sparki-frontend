commercial_direction:
  implementation_strategy: REPLACE_APP_SHELL_AND_INFORMATION_ARCHITECTURE_PRESERVE_ENGINES_DATA_APIS_AND_WORKING_FLOWS
  visual_strategy:
    primary_reference_mode: LIGHT
    supported_modes:
      - LIGHT
      - DARK
      - SYSTEM
    final_default_requires:
      - DAYLIGHT_PRACTICAL_TEST
      - CONTRAST_TEST
      - USER_TASK_TEST
    background:
      workspace_photo_background: PROHIBITED
      marketing_editorial_imagery: ALLOWED
      map_and_data_as_workspace: REQUIRED
    brand_continuity:
      preserve:
        - SPARKI_NAME
        - CYAN_SIGNAL_ACCENT
        - DIRECT_NEUTRAL_TONE
      replace:
        - DARK_CINEMATIC_BACKGROUND_AS_PRODUCT_SHELL
        - GLASS_CARD_OVERUSE
        - MONO_KICKER_OVERUSE
  experience_principles:
    - ONE_PRIMARY_ACTION_PER_STATE
    - RECOGNIZABLE_PERSISTENT_NAVIGATION
    - MOBILE_COMPACT_DESKTOP_EXPANDED
    - MAP_FIRST_WHEN_ROUTE_TASK
    - DATA_FIRST_WHEN_ANALYSIS_TASK
    - FULL_PERIOD_VISIBLE_IN_COMPLETE
    - PROGRESSIVE_DISCLOSURE
    - UNUSED_CAPABILITY_NOT_RENDERED_AS_EMPTY_CARD
    - USER_CONFIGURABLE_NAV_WITH_RESET_TO_V0
    - MOTION_EXPLAINS_CHANGE_NOT_DECORATION
    - CRITICAL_ACTIONS_ALWAYS_VISIBLE

design_foundations:
  typography:
    family: Inter
    hierarchy:
      display: 32_40
      h1: 28_34
      h2: 22_28
      body: 16_24
      compact_body: 14_20
      caption_minimum: 12_16
    body_below_14px: PROHIBITED
  spacing:
    base_unit_px: 4
    touch_target_minimum_px: 44
    content_density:
      GO: LOW
      COMPLETE_MOBILE: MEDIUM
      COMPLETE_DESKTOP: HIGH_STRUCTURED
  color:
    primary_workspace: LIGHT_NEUTRAL
    primary_text: DEEP_NEUTRAL
    accent: SPARKI_CYAN_REFINED
    success_warning_error: SEMANTIC_AND_NOT_ACCENT_REUSED
    minimum_contrast: WCAG_AA
    information_may_not_depend_on_color_only: true
  shape:
    card_radius: MODERATE
    pill_usage: STATUS_FILTER_OR_COMPACT_ACTION_ONLY
    nested_card_depth_max: 2
  motion:
    functional_transition_ms: 160_TO_240
    reduced_motion: REQUIRED
    decorative_continuous_motion: PROHIBITED

navigation:
  SPARKI_GO:
    product_entry: ROUTES
    mobile:
      persistent_bottom:
        - KAART
        - ROUTES
        - OPGESLAGEN
        - MEER
      coaching_entry: PROHIBITED
    desktop:
      persistent_top:
        - ROUTES
        - OPGESLAGEN
      workspace: LIST_DETAIL_MAP
      coaching_entry: PROHIBITED
  SPARKI_COMPLETE:
    product_entry: TODAY
    mobile:
      persistent_bottom:
        - VANDAAG
        - PLAN
        - RIJDEN
        - ACTIVITEITEN
        - MEER
    desktop:
      persistent_left:
        - VANDAAG
        - PLAN
        - RIJDEN
        - ACTIVITEITEN
        - ONTDEKKEN
      utility_top:
        - SEARCH
        - NOTIFICATIONS
        - ACCOUNT
  customization:
    allowed: true
    reset_to_V0: REQUIRED
    Sparki_automatic_reorder: PROHIBITED

capability_lifecycle:
  states:
    - AVAILABLE_NOT_STARTED
    - SETUP_IN_PROGRESS
    - ACTIVE
    - PAUSED
    - ARCHIVED
    - BLOCKED
  render_rules:
    AVAILABLE_NOT_STARTED: PURPOSE_AND_SINGLE_START_ACTION_NO_EMPTY_FIELDS
    ACTIVE: USER_DATA_AND_PRIMARY_ACTION
    ARCHIVED: DISCOVERABLE_IN_ARCHIVE_NO_HOME_CARD
    USER_DECLINES: REMAINS_DISCOVERABLE

screen_architecture:
  shared:
    S01_AUTH_AND_PACKAGE_ENTRY:
      mobile: SINGLE_COLUMN_PROGRESSIVE
      desktop: CENTERED_FOCUSED
      required:
        - VALUE_BEFORE_DATA_REQUEST
        - PROGRESS_AND_TIME_EXPECTATION
        - GO_OR_COMPLETE_CONTEXT
        - RESUME
    S02_ACCOUNT_SUBSCRIPTION_PRIVACY:
      mobile: SECTIONED_LIST
      desktop: TWO_COLUMN_SETTINGS
      required:
        - CURRENT_PACKAGE
        - TRIAL_OR_BILLING_STATE
        - UPGRADE_DOWNGRADE_CANCEL
        - CONNECTIONS
        - PRIVACY
        - EXPORT_DELETE
    S03_DISCOVER_AND_ARCHIVE:
      mobile: GROUPED_LIST
      desktop: FILTERABLE_CATALOG
      required:
        - ACTIVE
        - AVAILABLE
        - PAUSED
        - ARCHIVED

  SPARKI_GO:
    G01_ROUTE_HOME:
      mobile: MAP_WITH_BOTTOM_SHEET
      desktop: LIST_DETAIL_MAP
      primary_action: MAKE_OR_FIND_ROUTE
    G02_ROUTE_PLANNER:
      mobile: STEPWISE_MAP_FIRST
      desktop: CONTROL_PANEL_PLUS_MAP_PLUS_LIVE_SUMMARY
      primary_action: CREATE_ROUTE
    G03_ROUTE_DETAIL:
      mobile: MAP_HEADER_PLUS_SCROLLING_DETAIL_PLUS_STICKY_ACTIONS
      desktop: LIST_OPTIONAL_PLUS_DETAIL_PLUS_MAP
      required:
        - DISTANCE_DURATION_ELEVATION
        - WARNINGS
        - ELEVATION_PROFILE
        - WAY_TYPES_AND_SURFACES
        - NAVIGATE
        - DOWNLOAD_GPX
        - SAVE
        - EDIT
        - SHARE_WHEN_RELEASE_SCOPED
    G04_ACTIVE_NAVIGATION:
      mobile: FULL_MAP_PLUS_MINIMAL_HUD
      desktop: NOT_PRIMARY
      required:
        - NEXT_MANEUVER
        - DISTANCE_TO_MANEUVER
        - ROUTE_PROGRESS
        - OFF_ROUTE_STATE
        - MAP_ZOOM_AND_PAN
        - PAUSE_STOP
    G05_SAVED_ROUTES:
      mobile: SEARCHABLE_LIST
      desktop: LIST_DETAIL_MAP

  SPARKI_COMPLETE:
    C01_TODAY:
      mobile: ONE_ACTION_PLUS_COMPACT_BIG_PICTURE
      desktop: PRIMARY_ACTION_PLUS_SEASON_RAIL_PLUS_CONTEXT
      required:
        - ONE_PRIMARY_ACTION
        - A_GOAL
        - CURRENT_PHASE
        - PLAN_PROGRESS
        - MATERIAL_RISK_OR_DEVIATION
        - MAX_ONE_INPUT_REQUEST
    C02_PLAN_AND_CALENDAR:
      mobile: TODAY_WEEK_SEASON_TABS_WITH_SEASON_ALWAYS_INDICATED
      desktop: FULL_PERIOD_TIMELINE_PLUS_WEEK_DETAIL_PLUS_INSPECTOR
      required:
        - FULL_PLAN_PERIOD
        - A_B_C_GOALS
        - CURRENT_PHASE
        - TRAINING_AND_LIFE_EVENTS
        - ADD_INLINE
        - RECALCULATION_STATUS
        - CHANGE_REASON
    C03_ACTIVITIES:
      mobile: FILTERABLE_LIST_PLUS_IMPORT
      desktop: LIST_PLUS_TRENDS
      required:
        - CONNECT
        - MANUAL_FILE_IMPORT
        - HONEST_EMPTY_STATE
    C04_ACTIVITY_DETAIL:
      mobile: SESSION_FIRST_PROGRESSIVE_DEPTH
      desktop: CHART_GRID_PLUS_SESSION_SUMMARY_PLUS_CONTEXT
      required:
        - SESSION_DATA
        - INTERACTIVE_GRAPHS
        - SHORT_TRANSLATION
        - SOURCE_AND_CONFIDENCE
    C05_ROUTES:
      reuse: SPARKI_GO_G01_THROUGH_G05
      package_difference: COACHING_CONTEXT_MAY_LINK_TO_ROUTE_NO_ROUTE_QUALITY_DIFFERENCE

