    - CONSISTENT_VISUAL_LANGUAGE
    - HONEST_EMPTY_STATES
    - STRONG_TODAY_VALUE_SIGNAL
    - CLEAR_SINGLE_ONBOARDING_ACTION
    - EXISTING_ROUTE_ENTRY_ACTIONS
