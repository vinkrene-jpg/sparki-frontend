    screenshots: 12
  repository_evidence: SPARKI_EVIDENCE_MATRIX_v1_1
  release_scope: SPARKI_RELEASE_SCOPE_MATRIX_v0.1
  competitor_reference:
    purpose: INFORMATION_ARCHITECTURE_AND_QUALITY_FLOOR_ONLY
    copying_assets_or_brand: PROHIBITED

