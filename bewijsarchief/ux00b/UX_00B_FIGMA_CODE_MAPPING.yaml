UX_01:
  exact_scope: >-
    Eén afgebakend increment, conform contractvolgorde IMPLEMENT_TOKENS_AND_APP_SHELL_FIRST:
    (1) licht-eerst tokenset als tweede themalaag naast de bestaande donkere tokens (geen verwijdering),
    (2) één nieuwe responsieve AppShell-component (mobiel: persistente bottomnav; desktop >=1200px:
    persistente linkernav + utility-top), (3) uitsluitend /vandaag (frames 34:5 + 34:6) rendert via deze
    shell, achter een nieuwe feature-flag commercial_shell (default UIT). Alle overige pagina's blijven
    ongewijzigd op ScreenShell.
  exact_files_expected_to_change:
    - artifacts/sparki/src/index.css (tokens toevoegen, niets verwijderen)
    - artifacts/sparki/src/components/sparki/app-shell.tsx (nieuw)
    - artifacts/sparki/src/components/sparki/day-home.tsx (shellkeuze achter flag)
    - flag-seed voor commercial_shell (bestaand flags-mechanisme, api-server)
  explicit_non_scope: geen wijziging aan engines/API's/schema; geen andere pagina's; geen GO/COMPLETE-pakketsplitsing; geen abonnementenscherm (34:9 wacht op prijzen-/billingbesluit); geen verwijdering van het donkere thema
  acceptance_tests:
    - bestaande workflows groen — test-day-type, test-core-profile, test-core-profile-evolution, test-session-analysis
    - visuele regressie /vandaag op 390x844 en 1440x900, flag AAN en UIT
    - WCAG-AA-contrast op de nieuwe lichte tokens (contracteis)
  rollback_boundary: flag commercial_shell UIT = exact huidige weergave; verwijderen van app-shell.tsx + flag = volledige terugkeer zonder datamigratie
  estimated_replit_effort_band: M (1-2 werkdagen, één taak)

blockers:
