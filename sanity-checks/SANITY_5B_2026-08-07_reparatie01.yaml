rapport: SANITY_5B
datum: 2026-08-07
onderwerp: "REPARATIE_01 — resterende punten A4-A7 + C-blok coachscherm/trainingsdetail (A1-A3, B1-B2 zaten in eerdere commits)"
belofte: "Route-scherm meldt/loggt elke aanpassingspoging eerlijk, naam/beschrijving klopt voor alle activiteiten, en het coachscherm + trainingsdetail spreken gewone taal: geen dubbele uitleg, geen interfacebeschrijvende ondertitels, één duidelijke feedbackvraag, geen achterkantwoorden."
bewijs:
  - stap: "A4 — activiteit kiezen start géén generatie"
    resultaat: "Bevestigd in code: activiteitkeuze zet alleen state; generatie start uitsluitend via maakRoute/hergenereer. René zag de bekende-routes-laag (route-zoeklaag), geen generatie."
  - stap: "A5 — slot komt altijd vrij + zichtbare voortgang"
    resultaat: "genLockRef wordt in onSettled van élk generate-pad vrijgegeven (route-scherm.tsx r884, r937). Tijdens elke (her)generatie toont paneelInhoud een spinner met fase-tekst en Annuleren-knop (r1383-1401), zichtbaar in stap 4 op mobiel én desktop. Weigeringen tonen een zwevende melding (aanpas-melding, eerder gecommit)."
  - stap: "A6 — naam/beschrijving-patroon alle activiteiten + A-naar-B"
    commando: "tsx-script over activityLabel + activiteitOndergrondLabel (alle bereikbare RoutingProfiles)"
    resultaat: "racefiets/mtb/toer-stads/gravel/wandel/hike → allemaal 'label, ondergrond' zonder haakjes; A-naar-B = 'Van X naar Y · afstand' via hetzelfde routeNaam-pad. Eén gedeeld codepad voor alle acht activiteiten (buildRationaleFallback)."
  - stap: "A7 — wegdekpercentage-melding"
    resultaat: "Al verwijderd in eerdere RIJDEN_02-commit (route-scherm.tsx r1448-comment); grep op 'wegdek' toont alleen de fase-tekst van de servercontrole. Niet zichtbaar op de ná-screenshots."
  - stap: "C1 — dubbele trainingsgat-alinea's"
    resultaat: "Uitgebreide uitleg VERVANGT nu de korte in sectie 03 (nooit twee versies onder elkaar); extended-prompt eist elk feit/getal precies één keer (ai.ts)."
  - stap: "C2 — sectietitel"
    resultaat: "'03 Waarom?' heet nu '03 De filosofie erachter' (screenshot ná: trainingsdetail-boven)."
  - stap: "C3 — feedback-herontwerp"
    resultaat: "RPE optioneel · één rij 'HOE IS HET GEGAAN?' Gedaan/Gedeeltelijk/Gemist · waarom-rij (Te zwaar/Te licht/Vermoeid/Pijn-blessure/Verplaatsen) alléén bij Gedeeltelijk/Gemist. Gedaan slaat direct op (completion reist expliciet mee, geen state-race). Zeven bolletjes alleen nog vooruitkijkend (komende training)."
  - stap: "C4 — achterkantwoorden"
    resultaat: "'45 TSS' → '45 punten'; Fitheid/Vermoeidheid/Vorm zonder CTL/ATL/TSB; 'coach-engine'-ondertitel weg. 'redelijk zeker · 85%' + 'ONDERBOUWING (13)' komen uit de Core-voorspelling (aparte engine, buiten deze reparatie gelaten — al gewone taal met uitklap)."
  - stap: "C5 — Filosofie uitleggen faalde"
    commando: "curl POST /api/ai/workout-explain met dev-header"
    resultaat: "Oorzaak: server weigert eerlijk (consent uit) maar de UI toonde generiek 'Even niet bereikbaar'. Nu toont de UI de echte serverreden (serverFoutTekst parseert het error-veld)."
  - stap: "C6 — grijze ondertitels"
    resultaat: "Doellijn, Coach-boodschap en Wat de coach opvalt hebben geen interfacebeschrijvende ondertitel meer (KaartKop.uitleg optioneel)."
  - stap: "C7 — Doellijn zonder doel"
    resultaat: "Geen belofte-zin meer; alleen 'Geen wedstrijddoel vastgelegd.' + knop 'Doel instellen' (screenshot ná: coach-boven)."
  - stap: "C8 — 'Sport: Recovery'"
    resultaat: "Label heet nu 'Type' met Nederlandse vertaling (recovery→Herstel, endurance→Duurtraining, …); screenshot ná toont 'Type: Fietstraining'."
  - stap: "D1 — schermafdrukken vóór/ná"
    resultaat: "e2e/evidence/reparatie01/voor/ en /na/ (mobiel, coach + train + trainingsdetail), gemaakt met e2e/reparatie01-shots.mjs via echte Clerk-ticket-login tegen de prod-build."
  - stap: "Controles"
    resultaat: "tsc sparki + api-server groen; typecheck:libs groen; check-brand-copy groen; test:sporter-coach 10/10 groen."
eerlijkheid:
  - "De vóór-screenshots dragen de TESTCONTEXT-banner: de dist stond op dat moment op een acceptatiebuild (de web-workflow herbouwt met SPARKI_ACCEPT_MODE). De pagina-inhoud is dezelfde componenten; de ná-screenshots zijn tegen een schone prod-build."
  - "C9 (verwijderde punten uit de vergelijkingstabel) is expliciet buiten reikwijdte verklaard in de opdracht."
  - "C5: de knop werkt technisch; of René's eigen account consent aan heeft staan bepaalt of hij uitleg of de (nu eerlijke) consent-melding ziet."
  - "C1: de dubbeling kwam uit twee losse AI-generaties (kort + uitgebreid) die allebei zichtbaar bleven; de fix is deterministisch (vervangen) plus een promptregel. Nieuwe generaties kunnen pas in de praktijk worden beoordeeld met consent aan."
aanvulling_na_review:
  - bevinding: "Architect-review: 'Gemist' en 'Gedeeltelijk' zetten alleen state; zonder waarom-klik werd níets opgeslagen, en de waarom-typen (tired/too_hard/…) zetten de workoutstatus niet op skipped/partial."
    fix: "Elke afrondingsknop slaat nu direct op: Gedaan→done/volledig, Gedeeltelijk→done/gedeeltelijk (server zet status 'partial'), Gemist→missed/niet (server zet status 'skipped'). De waarom-rij blijft een optionele aanvulling (feedbackrij zonder status-overschrijving)."
    bewijs: "tsc sparki groen; test:sporter-coach 10/10; test:feedback-adjust 11/11; verse schone prod-build zonder TESTCONTEXT; ná-screenshots opnieuw gemaakt (e2e/evidence/reparatie01/na/)."
  - eerlijk_open: "Reviewpunten 2/3 (drawer-integratietests voor de klikflow; bewijs-script hard laten falen op ontbrekende workouts) zijn niet in deze reparatie meegenomen — genoteerd als losse verbeterpunten, geen gedragsrisico voor de geleverde flow."
