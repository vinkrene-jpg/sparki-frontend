# CI — draait op elke push naar main en elke pull request.
# Alleen controles die op main bewezen groen zijn (build-job bewezen op merge-SHA b52cc738, 04-08-2026).
# Geen secrets, geen deploy, geen productie-toegang.
name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typecheck:
    name: typecheck (libs + alle artifacts + merkcopy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck (libs + artifacts + scripts)
        run: pnpm run typecheck
      - name: Merkcopy-lint
        run: node scripts/check-brand-copy.mjs
  build:
    name: build (volledige productie-build + deploy-size)
    runs-on: ubuntu-latest
    env:
      # De statische Expo-export eist een domeinnaam bij het bouwen. In CI
      # bestaat er geen echt domein; deze bewust ongeldige waarde bewijst
      # alleen dat de build slaagt — het bundel-artefact wordt nergens
      # gepubliceerd of gebruikt. Geen geheim, geen echte omgeving.
      EXPO_PUBLIC_DOMAIN: ci-dummy.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Productie-build (typecheck + alle pakketten + deploy-size-check)
        run: pnpm run build
  validators:
    name: validators (promise-calibratie + sanity-rapporten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Validator-scripts importeren workspace-pakketten; zonder install
      # faalt de job op ERR_MODULE_NOT_FOUND.
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Promise-calibratie
        run: node scripts/check-promise-calibration.mjs
      - name: Sanity-rapporten (checker-zelftest + fail-closed check)
        run: |
          node scripts/test-check-sanity-reports.mjs
          node scripts/check-sanity-reports.mjs
  admin-smoke:
    name: admin-smoke (echte app tegen verse Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sparki_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sparki_ci
      SESSION_SECRET: ci-only-session-secret
      NODE_ENV: development
      DEV_AUTH_BYPASS: "true"
      # Verse CI-database heeft geen gebruikers; deze dev-identiteit wordt
      # hieronder als echte rij geseed. De test bewijst eerst de strikte
      # niet-admin-poort (isAdmin:false zonder SPARKI_ADMIN_IDS).
      DEV_AUTH_CLERK_ID: ci_admin_smoke
      # Nep-waarden in het juiste formaat: de app eist alleen dat deze
      # variabelen bestaan bij het laden. Er wordt in deze smoke-test nooit
      # echt een AI-dienst of Clerk aangeroepen; er staat geen enkel echt
      # geheim in deze workflow.
      CLERK_SECRET_KEY: sk_test_ci-dummy-not-a-real-key
      CLERK_PUBLISHABLE_KEY: pk_test_Y2ktZHVtbXkubm90LXJlYWwuY2xlcmsuYWNjb3VudHMuZGV2JA
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: http://localhost:9/ci-dummy
      AI_INTEGRATIONS_ANTHROPIC_API_KEY: ci-dummy
      AI_INTEGRATIONS_GEMINI_BASE_URL: http://localhost:9/ci-dummy
      AI_INTEGRATIONS_GEMINI_API_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Schema naar verse Postgres (drizzle push)
        run: pnpm --filter @workspace/db run push-force
      - name: Seed dev-identiteit
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d sparki_ci -v ON_ERROR_STOP=1 \
            -c "INSERT INTO user_profiles (clerk_id, email) VALUES ('ci_admin_smoke', 'ci-admin-smoke@sparki.test') ON CONFLICT DO NOTHING"
      - name: Admin-smoke (echte Express-app)
        run: pnpm --filter @workspace/api-server run test:admin-smoke
