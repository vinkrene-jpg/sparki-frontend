delivery: "Bewijsbatch gegenereerde lussen (opdracht René 30-07): 12 combinaties (racefiets/gravel/MTB × 25/60/120/200 km × wensen vlak/heuvels/water/natuur/stadskern) via het echte POST /api/routes/generate-pad vanuit Hengelo; per route in-process getRouteRemarks-obstakelmeting (zonder 18s-previewbudget) + wegdek- en afstandscontrole"
