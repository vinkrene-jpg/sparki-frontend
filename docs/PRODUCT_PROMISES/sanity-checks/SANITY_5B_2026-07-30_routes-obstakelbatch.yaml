  placeholder_as_result:
    cases:
      - case: "OBSTAKELBELOFTE GESCHONDEN op schaal: seed 11 → 7 van 11 bewezen routes bevatten blokkerende obstakels; seed 12 (server mét #502, warmere cache) → 11 van 12, waaronder afgesloten/privé-poorten (tot 7 op één gravel-60-lus), trappen op gravel/MTB-lussen en 'Fietsen hier niet toegestaan' op gravel-25. Oorzaak: de obstakelwering bij LUS-generatie draait binnen het 2000–2500 ms omgevingsbudget ([ENV-COVERAGE] env=miss in serverlog) en faalt open; de #502-fix (blokkerend wachten) dekt het waypoint/PTP-pad, niet het lus-pad"
        result: "fail — gegenereerde lussen kunnen afgesloten poorten, trappen en fietsverboden bevatten; module niet opleverbaar tot de lus-generatie dezelfde blokkerende obstakelmeting krijgt"
