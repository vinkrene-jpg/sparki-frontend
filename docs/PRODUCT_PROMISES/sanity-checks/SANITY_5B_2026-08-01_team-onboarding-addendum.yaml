    cases:
      - case: "Per rol een passend startblok: teammanager krijgt een inrichtings-/uitnodigingsactie, mechanieker/soigneur 'niet toegewezen', medical_staff 'geen toestemming', gast 'werkelijk geen open acties' — alle acht rollen getoetst (scenario 15)"
        result: "pass"
      - case: "Uitnodiging naar een selectie van een ándere organisatie of een onbestaande selectie faalt eerlijk met 404; buitenstaander krijgt 403 op /start (scenario 14/15)"
        result: "pass"
  placeholder_as_result:
    cases:
      - case: "Eerste acties en lege toestanden zijn AFGELEID uit werkelijke inrichting (conceptstatus, selecties, trainingen, open uitnodigingen) — nooit een verzonnen takenlijst; vier soorten lege toestand expliciet onderscheiden (nog_niet_ingericht / niet_toegewezen / geen_toestemming / geen_open_acties)"
        result: "pass"
      - case: "Elke lege toestand vermeldt alle vier de velden: wat ontbreekt · waarom · wie het kan oplossen · vervolgstap (server-side afgedwongen contract, per rol getest)"
        result: "pass"

verdict: "deliverable"
