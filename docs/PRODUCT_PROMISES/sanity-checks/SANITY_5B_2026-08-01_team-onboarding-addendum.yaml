# Poort 5b sanity-check rapport — TEAM_ONBOARDING_01 addendum
# (parallelle teams + rolgestuurde startschermen)

delivery: "Addendum TEAM_ONBOARDING_01: (1) parallelle teams — één organisatie beheert meerdere selecties gelijktijdig met eigen seizoensbezetting, stafbasis en uitnodigingen per team; (2) rolgestuurde start — iedere rol landt op een eigen startblok met één begrijpelijke eerste actie of een eerlijke lege toestand"
date: "2026-08-01"
checked_by: "replit"
surfaces:
  - "Clubpagina (/club): nieuw rolgestuurd startblok 'Jouw rol' bovenaan — e2e-browserbewijs desktop 1440×900 en mobiel 402×874 (e2e/tests/team-onboarding.mjs, prod-build)"
  - "API: GET /api/clubs/:id/start (rolgestuurde start), POST /api/invitations met teamId (selectie-uitnodiging), accept landt in de juiste selectie"

checks:
  dead_controls:
    cases:
      - case: "De eerste-actie-knop in het startblok navigeert echt (beheer/leden); het blok verschijnt alleen met echte serverdata (query, geen hardcoded tekst)"
