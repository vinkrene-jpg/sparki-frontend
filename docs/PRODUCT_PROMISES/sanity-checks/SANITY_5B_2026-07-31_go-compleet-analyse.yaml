  Analyse/Performance Lab is toegankelijk voor Sparki Go én Sparki Compleet
  (Compleet erft alle Go-rechten); Gratis en interne testtiers zien een eerlijke
  betaalmuur met rustige CTA naar het abonnementsoverzicht; tijdens het laden
