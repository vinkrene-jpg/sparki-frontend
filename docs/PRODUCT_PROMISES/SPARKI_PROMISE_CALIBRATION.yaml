        - "Definitieve commerciële datavoorwaarden van beide platforms (pas zichtbaar na toelating)."
        - "Live payload-contracten (nooit tegen echte API gevalideerd)."

    replit_definition:
      objective_quality_standard: "Vóór sleutels: 100% eerlijke niet-beschikbaar-status, 0 neppe verbonden-states, 0 webhook-verwerkingen zonder geldige verificatie. Ná sleutels: zelfde lat als Strava (zichtbaar ≤5 min na push; route-push met bevestiging of eerlijke fout)."
      recommended_default: "Aanvragen bij beide programma's starten zodra René dat wil; bij toekenning eerst een besloten validatieronde (payload-contracten live herijken) vóór de koppeling voor testers opengaat. Nooit activeren op alleen 'sleutels bestaan'."
