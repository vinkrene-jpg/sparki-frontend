      description: "René's toon-/autonomiekalibratie; gateway-e2e-test en SDK-bypass-gate bouwen; daarna week-logboek-praktijktest."
      approved_for_execution: false

  - id: TRAIN_COCKPIT_001
    module: "Training, coaching en analyse"
    subject: "Coach-cockpit — menselijke coach werkt veilig met sporterdata en plannen"
    status: needs_calibration

    current_state:
      technical_status: implemented
      source_snapshot: 2026-07-30
      evidence_status: "Redelijk op contractniveau: de cockpit-contracttest dekt fail-closed toegang (geen rol/koppeling/sharing=none ⇒ geen gezondheids- of readinessdata), coach-workouts als enige coach-schrijfbare rijen (Sparki-/atleet-workouts 403), idempotente signaalbesluiten en 409 op besluiten over al-afgehandelde voorstellen. Ontbreekt: een uitgewerkt hoofdtrainer-/organisatie-overzicht (nauwelijks aangetroffen) en praktijkbewijs met een echte externe coach."
      practice_status: "Nog geen echte externe coach in gebruik; alleen eigen test-accounts."
      known_limitations:
        - "'Privénotities zijn owner-only' verdient nuance: de coachcontext is bewust sporter-transparant; alleen verwijderen is owner-only. De belofte moet die transparantiekeuze expliciet maken."
        - "Open-voorstel-uniciteit (nooit twee open voorstellen voor hetzelfde) is niet overal als DB-contract aangetroffen; besluit-idempotentie wél."
        - "Org-/hoofdtrainer-overzicht bestaat slechts basaal; geen aparte tests."

    proposed_promise:
      text: "Een coach ziet alleen wat de sporter deelt — deelt de sporter niets, dan ziet de coach ook niets over gezondheid of gesteldheid. Wat de coach inplant is van de coach: Sparki past het nooit stilletjes aan, en de sporter kan het niet stuk-bewerken. Elk voorstel wordt precies één keer besloten. Wat de coach over de sporter noteert in de gedeelde context, kan de sporter gewoon zien — stiekem meelezen zonder dat de sporter het weet bestaat bij Sparki niet."
      proposed_by: replit
      rationale: "Vertrouwen tussen sporter, coach en Sparki is de verkoopbelofte van de coachlaag (en straks de club). Fail-closed sharing en de onmogelijkheid van verborgen dossiers zijn bewuste, onderscheidende keuzes die in het contract thuishoren."
      rene_approved: false

    external_intelligence:
      research_required: true
      candidate_sources:
        - name: "Eigen coaching-toegangslaag + cockpit-contracttest"
          coverage: "Dekt toegangsniveaus (direct/club/team), capabilities, sharing-sanering en de schrijfgrenzen. Dekt NIET: organisatieschaal (veel sporters/meerdere trainers) — nauwelijks gebouwd."
          actuality: "Live eigen code met contracttest."
          license_status: "Eigen werk."
          limitations:
            - "Toegangsmodel getest op klein aantal scenario's; geen last-/schaaltest."
          applicability: "Meetbasis voor alle toegangs- en schrijfregels hieronder."
        - name: "AVG-kader voor gezondheidsgegevens in sportcontext (EDPB-richtsnoeren; Autoriteit Persoonsgegevens-lijn)"
          coverage: "Dekt dat gezondheidsdata bijzondere persoonsgegevens zijn en delen expliciete toestemming vergt. Dekt NIET: productspecifieke sharing-niveaus."
          actuality: "AVG 2018; richtsnoeren periodiek geactualiseerd."
          license_status: "Wettelijk kader; vrij toepasbaar."
          limitations:
            - "Juridisch minimum, geen UX-antwoord."
          applicability: "Onderbouwt fail-closed als enig acceptabel default voor gezondheidsdeling."
      sources_in_use:
        - "Eigen toegangslaag — leidend; AVG-kader als ondergrens."
      privacy_status: unknown
      missing_information:
        - "Hoofdtrainer-/organisatie-overzicht: werkelijke behoefte en vorm onbekend (hoort deels bij hoofdstuk J)."
        - "Geen praktijkbewijs met een echte externe coach."

    replit_definition:
      objective_quality_standard: "0 gezondheids-/readinessvelden zichtbaar bij sharing=none; schrijfacties uitsluitend met directe koppeling; 0 automatische wijzigingen aan coach-workouts; elk voorstel exact één besluit (tweede besluit ⇒ 409); geen coach-notitie over de sporter die de sporter niet kan zien (verwijderrecht owner-only)."
      recommended_default: "Fail-closed op elk leespad (ook toekomstige); adoptie van advies-plannen maakt de rijen atleet-eigendom met source=coach en dedupe op datum+bron. Coachinput die plan, advies of besluit beïnvloedt is sporter-zichtbaar; een privékladblok mag, mits het aantoonbaar geen verborgen inhoudelijke sturing kan veroorzaken (Besluit René 30-07-2026; BOUWOPGAVE). Besluitniveau (advies/voorstel/automatisch): de trainer is leidend bij normale trainingskeuzes; Sparki adviseert en routeert atleet-feedback als voorstel; toepassen kan uitsluitend door een expliciet coachbesluit — automatische aanpassing van coach-trainingen bestaat niet, maar bij een harde gezondheids- of veiligheidsblokkade mag Sparki de uitvoering blokkeren met duidelijke uitleg (Besluit René 30-07-2026; BOUWOPGAVE)."
      technical_limits:
        - "Open-voorstel-uniciteit is nog geen DB-contract op elk voorstel-type."
      assumptions:
        - "Sporter-transparantie van coachcontext is de gewenste productkeuze (nooit expliciet door René bevestigd)."
      unknowns:
        - "Hoe een externe coach de cockpit ervaart (workflow, informatiedichtheid)."
      evidence_method:
        - "Her-run cockpit-contracttest + coach-parent-sharing-tests als proof-artefact."
        - "Praktijktest met één echte externe coach en één sporter met sharing=none en één met volledige deling."

    rene_calibration:
      questions:
        - question: "Coachnotities: moet álles wat een coach over een sporter vastlegt voor de sporter zichtbaar zijn (huidige lijn), of wil je een écht privé kladblok voor de coach toestaan?"
          answer_rene: "(Besluit René 30-07-2026) Coachinput die plan, advies of besluit beïnvloedt is zichtbaar voor de sporter. Een privékladblok mag bestaan, maar mag geen verborgen inhoudelijke sturing veroorzaken. BOUWOPGAVE: een écht privékladblok (met de waarborg dat het geen sturing kan voeden) bestaat nog niet — de huidige coachcontext is volledig sporter-transparant."
        - question: "Wie is leidend als coach en Sparki botsen (coach plant zwaar, Sparki ziet overbelastingssignalen): coach beslist en Sparki mag alleen adviseren (huidig), of mag Sparki bij duidelijke gezondheidssignalen de coach-training blokkeren?"
          answer_rene: "(Besluit René 30-07-2026) De trainer is leidend bij normale trainingskeuzes. Bij een harde gezondheids- of veiligheidsblokkade mag Sparki uitvoering blokkeren en moet het duidelijk uitleggen waarom. BOUWOPGAVE: een blokkade-mechanisme op coach-trainingen bij harde gezondheids-/veiligheidsstatus bestaat nog niet (nu alleen advies)."
      completed: true

    acceptance_contract:
      hard_reject_rules:
        - rule: "Bij sharing=none ziet een coach nooit enige gezondheids-, gesteldheids- of readinessinformatie van de sporter — op geen enkel leespad."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "Sporter deelt niets; het cockpit-dashboard toont wél een readiness-score of topsignaal — overtreding, ook als alle andere velden correct verborgen zijn."
              proof_stage: designed
              proof_method: "Redenering: het dashboard saneert bij sharing=none tot basisvermelding zonder topSignal/readiness (contracttest dekt dit); per_meting omdat élk veld op élk leespad afzonderlijk telt. Latere executed-stap: her-run + uitbreiding naar alle leespaden."
              proof_result: not_yet_tested
        - rule: "Alleen een coach met een directe actieve koppeling kan schrijven; en alleen aan coach-eigen rijen — Sparki- en atleet-workouts zijn voor de coach onaantastbaar."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "Coach met alleen clubtoewijzing (geen directe link) plant een training; of een coach bewerkt een Sparki-workout — beide moeten 403 geven."
              proof_stage: designed
              proof_method: "Redenering: schrijfacties eisen directe link (tiers-regel) en niet-coach-workouts geven 403 immutable in de contracttest. Latere executed-stap: her-run als proof-artefact."
              proof_result: not_yet_tested
        - rule: "Een voorstel kan precies één keer besloten worden; een tweede besluit (of gelijktijdig dubbel besluit) verandert niets en meldt dat eerlijk."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "Twee tabs beslissen tegelijk over hetzelfde open voorstel; twee toepassingen of een stil genegeerd tweede besluit zonder foutmelding — overtreding."
              proof_stage: designed
              proof_method: "Redenering: besluit op afgehandeld voorstel geeft 409 en signaalbesluiten zijn idempotent per coach+sporter+sleutel; het parallelle geval vergt nog een expliciete concurrency-test (zoals bij het Sportpaspoort-contract)."
              proof_result: not_yet_tested
      tolerances:
        - "Welke velden bij gedeeltelijke sharing zichtbaar zijn is kalibreerbaar; sharing=none ⇒ niets is dat niet."
      unknown_data_policy: "Onbekende of niet-gedeelde data verschijnt als afwezig, nooit als geschatte of afgeleide waarde richting de coach. Twijfel over een koppeling of rechten betekent weigeren (fail-closed)."
      approved: false

    validation:
      automated_tests:
        - "test:coach-cockpit (fail-closed, 403 immutable, 409 dubbel besluit, idempotente signalen) — bestaat, groen"
        - "test:coach-parent-sharing-levels / -share-nothing / -private-memory — bestaan, groen"
      independent_checks: ["Concurrency-test dubbel besluit — nog te ontwerpen"]
      practice_test_required: true
      practice_testers: ["Eén echte externe coach + René als sporter"]
      result: not_tested
      expectation_gap:
        - "Geen echte coach heeft de cockpit ooit gebruikt; informatiedichtheid en workflow zijn ongetoetst; org-overzicht is embryonaal."
    product_proof:
      score: null
      status: not_proven
      evidence_refs: []
    next_action:
      type: research_or_build_or_retest
      description: "René's privékladblok- en doorzettingsmacht-kalibratie; concurrency-test; daarna praktijkproef met een echte coach."
      approved_for_execution: false

  - id: TRAIN_LAB_001
    module: "Training, coaching en analyse"
    subject: "Lab/analyse — belastingsmodel, afgeleide waarden en eerlijke onzekerheid"
    status: needs_calibration

    current_state:
      technical_status: implemented
      source_snapshot: 2026-07-30
      evidence_status: "Redelijk: één belastingsmodel (EWMA, CTL 42d / ATL 7d / TSB) is de geteste single source voor alle consumenten; afgeleide TSS ontstaat alleen bij ontbrekende TSS met vastgelegde herleidingstrace; FTP-floor-regels zijn getest incl. afwijzing van implausibel vermogen (900 W/uur); de prestatie-radar geeft ontbrekende assen null+reden (nooit nep-0,5) en het analyse-dashboard weigert projecties zonder echte basis. Ontbreekt: praktijkbewijs dat de getoonde conclusies stroken met wat een renner ervaart."
      practice_status: "Dagelijks in gebruik; nooit tegen vastgelegde verwachtingen getoetst."
      known_limitations:
        - "Dagen zonder TSS tellen als nul in het EWMA-model; ontbrekende data drukt de fitheid dus omlaag in plaats van als onbekend te gelden — een bewuste maar niet-gekalibreerde keuze."
        - "Afgeleide TSS en FTP-floor hangen aan de kwaliteit van vermogen+FTP-op-datum; een verkeerde FTP werkt stil door in alle belastingcijfers."
        - "Radar-normalisaties (CTL/80, W/kg 2,0–5,5, 12 sessies/28d) zijn productschalen, geen individuele normen."
        - "ACWR-achtige risicosignalen (spike >1,5) zijn heuristiek en geen bewezen blessure- of ziektevoorspeller; alleen bruikbaar als voorzichtig waarschuwingssignaal in combinatie met meerdere gegevens, nooit zelfstandig voor diagnose of automatische escalatie, en altijd met de onzekerheid erbij benoemd."

    proposed_promise:
      text: "Het Lab rekent overal met hetzelfde belastingsmodel — je fitheid, vermoeidheid en vorm zijn op elke pagina dezelfde getallen. Alles wat berekend is, is herleidbaar: je ziet waar een getal vandaan komt. En wat niet berekend kán worden, blijft eerlijk leeg met de reden erbij — Sparki vult nooit een gok in waar een meting hoort."
      proposed_by: replit
      rationale: "Analyse is alleen geloofwaardig als dezelfde vraag overal hetzelfde antwoord geeft en gaten zichtbaar blijven. De null+reden-discipline van de radar en het dashboard is een echt onderscheid t.o.v. tools die alles altijd 'weten'."
      rene_approved: false

    external_intelligence:
      research_required: true
      candidate_sources:
        - name: "Eigen belastings-/afleidingslaag (computeLoadSeries, derived TSS, FTP-floor, analyse-dashboard)"
          coverage: "Dekt alle belastings- en afgeleide cijfers in het product. Dekt NIET: de fysiologische juistheid van het model voor een individu."
          actuality: "Live eigen code met tests."
          license_status: "Eigen werk."
          limitations:
            - "Nul-TSS-aanname voor lege dagen; afhankelijkheid van FTP-kwaliteit."
          applicability: "Meetbasis voor de SSOT- en null-eerlijkheidsregels hieronder."
        - name: "Banister/Coggan fitness-fatigue-model (Performance Manager: CTL/ATL/TSB, 42/7 dagen)"
          coverage: "Dekt de modelkeuze en tijdconstanten zoals breed gebruikt (TrainingPeaks/intervals.icu). Dekt NIET: individuele tijdconstanten (die verschillen per atleet)."
          actuality: "Banister 1976; Coggan PMC ~2003; stabiel en de-facto-standaard."
          license_status: "Modelkennis vrij toepasbaar; geen merkclaims overnemen."
          limitations:
            - "Vaste 42/7-constanten zijn populatiegemiddelden; geen individuele kalibratie."
          applicability: "Onderbouwt dat Sparki's cijfers vergelijkbaar zijn met wat renners van TrainingPeaks/intervals.icu kennen."
      sources_in_use:
        - "Eigen laag — leidend; Banister/Coggan als modelbasis en vergelijkingsanker."
      privacy_status: unknown
      missing_information:
        - "Geen kalibratievraag ooit gesteld over de nul-TSS-aanname bij ontbrekende dagen (stilzwijgende keuze)."
        - "Geen vergelijkende controle van Sparki's CTL/TSB tegen intervals.icu op dezelfde dataset (extern anker ontbreekt)."

    replit_definition:
      objective_quality_standard: "Alle belastingscijfers in de app komen uit één berekening (geen tweede implementatie); elke afgeleide waarde draagt een herleidingstrace; elke niet-berekenbare as/waarde is null met reden; implausibele inputs (bv. onmogelijk vermogen) worden afgewezen, nooit verwerkt."
      recommended_default: "Huidig model handhaven (EWMA 42/7, IF uit TSS, Coggan-zones) omdat het aansluit op wat renners elders kennen; het extern anker (vergelijking met intervals.icu op eigen data) toevoegen als bewijs. Presentatie: waarde + betrouwbaarheidslabel + waar zinvol een bandbreedte, mobiel compact met detail achter doorklikken (Besluit René 30-07-2026; BOUWOPGAVE). Bij een registratiegat eerst melden dat registratie ontbreekt en actief vragen of een activiteit mist, in plaats van fitheid stil te laten dalen (Besluit René 30-07-2026; BOUWOPGAVE). Besluitniveau (advies/voorstel/automatisch): het Lab is uitsluitend interpretatie en advies; het doet geen voorstellen en past nooit iets automatisch aan — zijn cijfers voeden wél de plan-/coachlagen, die hun eigen besluitregels hebben."
      technical_limits:
        - "Individuele tijdconstanten worden niet ondersteund."
        - "Model is machteloos tegen verkeerde input-TSS (garbage in)."
      assumptions:
        - "Nul-TSS voor dagen zonder sessie is acceptabel omdat 'niet getraind' meestal ook echt rust was — dit klopt NIET voor renners die elders ongeregistreerd trainen."
      unknowns:
        - "Hoe groot de afwijking t.o.v. intervals.icu op dezelfde data werkelijk is."
      evidence_method:
        - "Her-run van athlete-load/derived-load/radar/dashboard-tests als proof-artefact."
        - "Extern anker: zelfde ritten in intervals.icu laden en CTL/ATL/TSB-verloop vergelijken (verwachte afwijking < enkele punten)."

    rene_calibration:
      questions:
        - question: "Hoeveel onzekerheid wil je zien: alleen het getal (rustig), getal + betrouwbaarheidslabel (huidige databetrouwbaarheid hoog/beperkt/laag), of ook bandbreedtes op projecties?"
          answer_rene: "(Besluit René 30-07-2026) Toon waarde, betrouwbaarheidslabel en waar zinvol een bandbreedte. Op mobiel compact, met detail achter doorklikken. BOUWOPGAVE: bandbreedtes op projecties en de compacte mobiele weergave met doorklik-detail bestaan nog niet overal."
        - question: "Als je een week niets registreert terwijl je wél getraind hebt (vakantie, andere fiets): wil je dat Sparki je fitheid gewoon laat dalen (huidig), of dat het je actief vraagt of er ongeregistreerde training was?"
          answer_rene: "(Besluit René 30-07-2026) Laat fitheid niet automatisch dalen alsof zeker niet is getraind. Meld eerst dat registratie ontbreekt en vraag actief of een activiteit mist. BOUWOPGAVE: dit is nieuw gewenst gedrag — het model telt lege dagen nu als nul-TSS zonder navraag."
      completed: true

    acceptance_contract:
      hard_reject_rules:
        - rule: "Er bestaat maar één belastingsberekening; twee schermen die voor dezelfde dag verschillende CTL/ATL/TSB tonen is een defect, nooit een afrondingskwestie."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "/analyse toont CTL 62 waar /you voor dezelfde dag CTL 58 toont omdat ergens een tweede EWMA-implementatie leeft — overtreding."
              proof_stage: designed
              proof_method: "Redenering: computeLoadSeries is de geteste single source en de dashboard-leeslaag consumeert dezelfde functie (memory-regel: nooit her-implementeren); latere executed-stap: consistentietest die beide endpoints voor dezelfde datum vergelijkt."
              proof_result: not_yet_tested
        - rule: "Een niet-berekenbare waarde wordt nooit met een verstek- of gokwaarde gevuld: ontbrekend = null + reden, overal."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "Radar-as 'Vermogen' zonder FTP of gewicht toont 0,5 of een gemiddelde in plaats van leeg met reden — overtreding."
              proof_stage: designed
