  - id: START_ONBOARDING_001
    module: "Start, profiel en doelen"
    subject: "Onboarding — adaptieve start-Q&A, connect-stap en eerlijke schattingen"
    status: needs_calibration

    current_state:
      technical_status: implemented
      source_snapshot: 2026-07-30
      evidence_status: "Redelijk voor de vraag-engine: persona-tests (20 virtuele atleten, incl. onzin/weigering/gemengd), connect-stap-HTTP-tests, gap-fill-tests die echte database-rijen eisen (geen fake-groen op een import-vlag) en resume-tests draaien groen. Ontbreekt: bewijs voor de QR-instap (geen enkele geautomatiseerde test; taken #39/#41 bevestigen die lacune) en geen praktijkbewijs met een echte nieuwe tester van scan tot plan."
      practice_status: "Eén echte doorloop (René/Dylan-omgeving); geen gestructureerde praktijktest tegen vooraf vastgelegde verwachtingen."
      known_limitations:
        - "'Adaptief' betekent volgorde/selectie uit een VASTE catalogus (13 profielfeiten + 8 coachingdimensies); hoge begeleidingsbehoefte levert niet méér vragen op — de personatest documenteert expliciet gelijke omvang."
        - "De connect-stap heet in docs 'mandatory', maar is feitelijk een verplichte STAP in de UI, geen voorwaarde: zonder koppeling én zonder gap-fill kan de gebruiker afronden met geschatte waarden en een plan."
        - "Import-eerlijkheid verschilt per laag: de client kijkt naar importedDataTypes-vlaggen, de server-gap-fill naar echte canonieke rijen; de client kan 'geland' doorgaan waar de server alsnog velden vraagt."
        - "OAuth-resume steunt praktisch op sessionStorage; bij tabwissel of ander apparaat is de client-stap niet vanzelf terug, terwijl /state de database source-of-truth noemt."
        - "Planbouw binnen complete/quick-start kan mislukken zonder de onboarding ongeldig te maken (planReady=false, home degradeert eerlijk) — 'klaar = direct plan' is dus niet gegarandeerd."
        - "Gap-fill biedt bij een fetch-fout expliciet 'toch doorgaan met schattingen'; de gebruiker kan afronden zonder te weten welke data ontbreekt."

    proposed_promise:
      text: "Binnen een paar minuten kun je echt beginnen: Sparki kiest en ordent zijn startvragen uit een vaste, zorgvuldig samengestelde set — het stelt niet méér vragen dan nodig, maar verzint er ook geen nieuwe bij. Wat je niet weet of niet wilt invullen mag je overslaan — Sparki vult dat eerlijk in als schatting en zegt er ook bij dát het een schatting is. Een koppeling (zoals Strava) is een aanbod, geen verplichting. Land je zonder koppeling en met vrijwel alles overgeslagen, dan start je met een proefweek met beperkt advies — géén volledig persoonlijk trainingsplan op schattingen; dat bouwt Sparki pas zodra er echte gegevens of bevestigde waarden zijn."
      proposed_by: replit
      rationale: "De eerste vijf minuten bepalen of iemand blijft. De wereldmarkt-lat (Strava/Whoop/TrainerRoad-onboardings) is: kort, overslaanbaar, en nooit een dood einde. Aangescherpt na review René 30-07-2026: (1) 'past zich aan' mocht niet suggereren dat Sparki intelligent doorvraagt — het selecteert en ordent uit een vaste catalogus; (2) een volledig plan zonder echte gegevens is vervangen door een proefweek met beperkt advies. Let op: de proefweek is NIEUW gewenst gedrag — het huidige product bouwt wél een volledig plan op schattingen; dit is dus een bouwopgave vóór deze belofte bewezen kan worden."
      rene_approved: false

    external_intelligence:
      research_required: true
