      recommended_default: "Gedragsspiegel-positie handhaven; mentale signalen laag-frequent en nooit als urgentie-kaart tenzij gecombineerd met gezondheidssignalen. Benoemen: neutraal beschrijven en voorzichtig duiden, altijd als mogelijkheid, nooit als diagnose (Besluit René 30-07-2026). Jeugd: gedempt en veiligheidsgericht, geen verborgen profilering, gevoelige escalatie alleen via passende ouder-/trainer-/professionele route (Besluit René 30-07-2026; BOUWOPGAVE). Chat weegt standaard niet mee; alleen na afzonderlijke, expliciete en intrekbare toestemming voor een omschreven doel (Besluit René 30-07-2026). Besluitniveau (advies/voorstel/automatisch): mentale signalen zijn uitsluitend advies (spiegel + technieken); nooit voorstellen tot planwijziging en nooit automatische aanpassing."
