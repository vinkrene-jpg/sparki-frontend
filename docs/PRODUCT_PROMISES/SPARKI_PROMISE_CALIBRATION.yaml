        - name: "GraphHopper (rejoin-routes)"
          coverage: "Herberekening naar route of bestemming."
          actuality: "Live."
          license_status: "GH-abonnement."
          limitations: ["zelfde wegdek-kanttekeningen als de generator; rejoin gebruikt fietsprofiel"]
          applicability: "Alleen op verzoek van de renner (off-route-kaart), nooit automatisch."
      sources_in_use:
        - "GPS + route-match-engine (kern)"
        - "GraphHopper voor expliciet gevraagde rejoins"
      privacy_status: unknown
      missing_information:
        - "Onafhankelijke veldmeting van vals-positief-ratio afwijk-meldingen (per rit-uur) ontbreekt."
        - "Bewijs achtergrond-opname bij gelockt scherm (open taken #215/#214)."

    replit_definition:
      objective_quality_standard: "Op een op-route gereden praktijkrit: 0 valse 'je wijkt af'-meldingen; bij echte afwijking melding binnen 10 s; cue-timing vóór de manoeuvre; route-vervanging: nooit."
      recommended_default: "Huidige engine + episode/cooldown-gating; geen automatische reroutes."
      technical_limits:
        - "Per-meting-toetsing (elke GPS-fix) is de basis van de state machine; ≥3 metingen + ≥6 s bevestiging is bewust — één fix is nooit bewijs."
      assumptions:
        - "Renner accepteert 6 s detectievertraging in ruil voor nul ruis."
      unknowns:
        - "Gedrag bij langdurig GPS-verlies (bos/tunnel) in de praktijk."
      evidence_method:
        - "GPX-replay-simulatie (opgenomen ritten door de engine spelen) als geautomatiseerde regressietoets; praktijkritten als eindbewijs."

    rene_calibration:
