            Aangescherpte belofte (2026-07-30): voor de racefiets wil René 0% onbekend wegdek —
            een route met één of meer onbekende segmenten mag niet als geschikte racefietsroute
            worden geadviseerd; Sparki zoekt dan een alternatief of meldt eerlijk dat er geen
            volledig verifieerbare route is. Dit geldt in Nederland (BGT) én in landen/regio's
            waar bruikbare kaartbronnen het onbekend-percentage omlaag kunnen brengen (nu al
            inbouwen; maandelijks controleren of er bronnen bijkomen). In regio's zonder
            voldoende informatie: het minimale onbekend-percentage eerlijk benoemen en de
            gebruiker laten beslissen. Algemene afraadgrens buiten racefiets: vanaf ~20% onbekend.
      completed: true # beantwoord 2026-07-30 — LET OP: 0%-onbekend-racefietseis is een aanscherping van de huidige belofte (nu telt alleen aantoonbaar onverhard); vergt productwerk + bronnenregister-uitbreiding

