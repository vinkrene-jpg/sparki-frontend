              proof_stage: executed
              proof_method: "GPX-replay-harnas: route diep bevroren (Object.freeze — elke mutatie zou hard gooien) én JSON-byte-vergelijking vóór/ná de volledige replay van zowel de op-route rit als de afwijkingsrit; geometrie blijft byte-gelijk."
              proof_result: passed
        - rule: "Eén afwijk-episode = maximaal één kaart; genegeerd blijft stil tot de afwijking wezenlijk groeit (geen meldingen-spervuur)."
          rule_type: hard_blockage
