    rene_calibration:
      questions:
        - question: "Vind je de bewijsdrempel goed staan (pas iets zeggen bij 2+ signalen of een 3-daagse trend), of mag Sparki eerder iets voorzichtigs zeggen zolang het de onzekerheid erbij noemt?"
          answer_rene: "(Besluit René 30-07-2026) Vóór de normale bewijsdrempel mag Sparki een voorzichtig signaal tonen met expliciet lage zekerheid. Geen stevige conclusie. BOUWOPGAVE: de engine blokkeert nu álles onder de drempel — een aparte klasse 'voorzichtig signaal, lage zekerheid' moet gebouwd worden."
        - question: "Hoe moet een waarschuwing voelen: neutraal-zakelijk ('je belasting stijgt snel'), of persoonlijk-dringend ('ik zou morgen echt rust nemen') — en verschilt dat tussen gezondheid en prestatie?"
          answer_rene: "(Besluit René 30-07-2026) Prestatieboodschappen zijn persoonlijk en rustig. Gezondheids- en veiligheidswaarschuwingen zijn helder en direct, zonder paniektaal."
        - question: "Wanneer mag Sparki zelfstandig handelen zonder eerst te vragen: nooit, alleen voorlopige plandagen bijstellen (huidig), of ook bijv. een herstelweek activeren bij duidelijke overbelastingssignalen?"
          answer_rene: "(Besluit René 30-07-2026) Voorlopige dagen mogen automatisch worden aangepast. Een herstelweek alleen automatisch bij een harde veiligheidsstatus; anders als duidelijk voorstel. Overkoepelend (besluit 20): zonder reactie past Sparki alleen voorlopige planning en niet-kritieke keuzes automatisch veilig aan; definitieve doelen, vaste week, grote belastingwijzigingen en coachbesluiten nooit; bij harde veiligheid mag Sparki blokkeren, met uitleg. BOUWOPGAVE: automatische herstelweek bij harde veiligheidsstatus bestaat nog niet."
      completed: true

    acceptance_contract:
      hard_reject_rules:
        - rule: "Geen enkele observatie of coachconclusie mag op één enkel datapunt rusten (uitzondering: door de atleet zelf gemelde gezondheidsfeiten)."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "Eén nacht slecht slapen (één meting) levert de observatie 'je herstel staat onder druk' — overtreding; pas bij een tweede signaal of trend mag dit bestaan."
              proof_stage: designed
              proof_method: "Redenering: de engine eist ≥2 overeenstemmende signalen of ≥3-daagse trend vóór een observatie ontstaat; health-declared is de enige uitzondering. Latere executed-stap: her-run van de observatie-contracttest met dit geval als expliciete assert."
              proof_result: not_yet_tested
        - rule: "Humor is verboden op medische, mentale, veiligheids-, privacy- en foutmomenten — functionele tekst blijft daar altijd puur serieus."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "Bij een ziekmelding bevat de reactie een grapje of luchtige kwinkslag — overtreding, ongeacht het ingestelde humorniveau."
              proof_stage: designed
              proof_method: "Redenering: de centrale humorlaag sluit gevoelige contexten allowlist-matig uit en de voice-laag forceert empathie bij tegenslag; humor-tests dekken uit/null-gedrag al. Latere executed-stap: her-run + gevoelige-context-asserts."
              proof_result: not_yet_tested
        - rule: "Geen enkel AI-verzoek mag buiten de centrale gateway om lopen; consent-intrekking, minderjarigen-blokkade en killswitch gelden dus altijd en overal."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "Consent ingetrokken, maar een coachkaart bevat nog verse LLM-tekst uit een route die rechtstreeks een SDK aanroept — overtreding van de poortarchitectuur."
              proof_stage: designed
              proof_method: "Redenering: aiMessage() is de ene poort (killswitch→consent→minor→redactie→dedupe); de latere executed-stap is een e2e-test die met ingetrokken consent alle coachroutes aanroept en 0 LLM-calls asserteert, plus een grep-gate op directe SDK-imports buiten de gateway."
              proof_result: not_yet_tested
      tolerances:
        - "Toon, humorniveau en trust-opbouwsnelheid zijn kalibreerbaar; de gevoelige-context-uitsluiting en de bewijsdrempels niet."
      unknown_data_policy: "Ontbrekende data wordt benoemd ('hier weet ik te weinig van') en verlaagt de confidence; er wordt nooit een ontbrekend signaal aangevuld of een verband verzonnen. Weer geldt tot de bron bestaat altijd als ontbrekend."
      approved: false

    validation:
      automated_tests:
        - "Observatie-contracttests (≥2-signaal-guard, confidence) — bestaan, groen"
        - "Humor-tests (uit/null, determinisme, anti-herhaling) — bestaan, groen"
      independent_checks: ["Gateway-e2e (3 blokkadepaden) + grep-gate op SDK-bypass — nog te bouwen"]
      practice_test_required: true
      practice_testers: ["René + Dylan (week-logboek advieskwaliteit/toon)"]
      result: not_tested
      expectation_gap:
        - "Grootste gat: gateway-discipline is architectuur-op-papier zonder e2e-bewijs; en ervaren advieskwaliteit is nooit gemeten."
    product_proof:
      score: null
      status: not_proven
      evidence_refs: []
    next_action:
