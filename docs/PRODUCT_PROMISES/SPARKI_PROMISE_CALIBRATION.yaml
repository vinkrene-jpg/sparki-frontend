    proposed_promise:
      text: "Tijdens het fietsen zie en hoor je op tijd waar je heen moet; wijk je echt af, dan krijgt je één rustige melding met eerlijke keuzes (terug naar de route, doorfietsen, of naar het einde) — nooit een spervuur van valse waarschuwingen, en je geplande route wordt nooit stiekem vervangen."
      proposed_by: replit
      rationale: "Vergelijkingsmaatstaf is Garmin-navigatie: betrouwbaar op-route-houden zonder ruis. De segment-projectie-engine en episode-gating zijn hiervoor gebouwd na aantoonbare valse-melding-klachten."
      rene_approved: false

    external_intelligence:
      research_required: true
      candidate_sources:
        - name: "Apparaat-GPS (Expo Location) + eigen route-match-engine"
          coverage: "Positie/snelheid op het toestel; NIET: nauwkeurigheid <5 m in bebouwing, tunnels."
