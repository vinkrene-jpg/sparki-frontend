      evidence_method:
        - "Bestaande webhook-/busy-/inhaaltests her-runnen als proof-artefact."
        - "Nieuw: deauthorize-webhook-tegenvoorbeeld en 24u-bevriezingsdetectie-test."
        - "Praktijkmeting: tijd-tot-zichtbaar over René's echte ritten gedurende twee weken loggen."

    rene_calibration:
      questions:
        - question: "Hoe lang mag een rit maximaal op zich laten wachten voordat jij het 'kapot' noemt: minuten, een uur, of 'zolang het er bij de volgende app-opening staat is het goed'?"
          answer_rene: "Binnen een paar minuten — daarna geldt het als kapot." # beantwoord 2026-07-30
        - question: "Wil je een actieve melding (push/badge) als de Strava-koppeling stuk is (toestemming verlopen, >24u geen sync), of is een duidelijke status op de koppelingenpagina genoeg?"
          answer_rene: "Ja, actief melden (push/badge) — anders merk je het pas dagen later." # beantwoord 2026-07-30
        - question: "Als Strava's voorwaarden Sparki's AI-analyse op Strava-data zouden beperken: wil je dan (a) Strava-data alleen tonen en AI-analyse op eigen ritten/bestanden doen, of (b) de Strava-koppeling heroverwegen? (Dit bepaalt hoeveel we op Strava als fundament bouwen.)"
          answer_rene: "Bewust geen voorkeuze: dit is een hypothese, hier nu niet op voorsorteren. Besluit valt pas als de juridische onzekerheid concreet wordt (vóór commerciële uitrol opnieuw toetsen)." # beantwoord 2026-07-30
      completed: true # alle 3 vragen beantwoord 2026-07-30

    acceptance_contract:
      hard_reject_rules:
        - rule: "Een partiële (gerichte) sync mag nooit eerder opgeslagen identiteits- of koppelingsvelden wissen."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
