# SPARKI PROMISE CALIBRATION
# Hoofdstuk D — Routes en navigatie
# Opgesteld: 2026-07-30 (opdracht v2, taak #444). Alleen dit hoofdstuk; geen productcode gewijzigd.
# Bindende context: Product Proof Doctrine; acceptatiegrenzen René 30-07-2026
# (PO-01 §Acceptatiegrenzen + Addendum obstakelbesluiten): 0% aantoonbaar onverhard
# racefiets; trap/fietsverbod/afgesloten poort = absolute weigering (nooit aanbieden);
# onbekend wegdek: rule_type unverifiable op racefiets (0% norm; niet geverifieerd = niet als
# geschikt aanbevelen, tonen alleen na expliciete keuze, %+locaties zichtbaar); wereldmarkt-lat: elk onderdeel ≥9/10 t.o.v. de beste
# marktspeler (Komoot voor routes).
#
# WERKAFSPRAAK POORT 5B (bindend, 2026-07-30, taak #488 — zie
# docs/PRODUCT_PROMISES/POORT_5B_SANITY_CHECK.md en Product Proof Doctrine §11):
# 1) Vóór elke praktijktest-oplevering wordt de Poort 5b-sanity-check uitgevoerd en
#    geregistreerd in docs/PRODUCT_PROMISES/sanity-checks/ (geen dode bediening, geen
#    contextueel onzinnige functies, geen laad-/placeholdertekst als eindresultaat).
# 2) Elke door een tester gevonden fout in een module uit dít document krijgt als vast
#    onderdeel van de fix: een afkeurregel mét tegenvoorbeeld bij die module
#    (hard_reject_rules, of sanity_reject_rules voor bedieningsfouten) én een
#    UITGEVOERDE test die aantoont dat het tegenvoorbeeld wordt geweigerd
#    (proof_method + verwijzing naar bewijsbestand/testnaam). Een fix zonder beide is
#    niet af.
chapter_d_routes_en_navigatie:

  - id: ROUTES_GENERATOR_001
    module: Routes en navigatie
    subject: "Routegenerator (lussen en A-B) met fietstype-geschiktheid"
    status: needs_calibration

    current_state:
      technical_status: implemented
      source_snapshot: 2026-07-30
      evidence_status: "Vers: volledige post-fix run 30-07 (route-suitability-2026-07-30-full-rerun.json): 7 startpunten × racefiets/gravel/gewone fiets, 21/21 onafhankelijk gedekt; racefiets 0 aantoonbaar onverhard op alle geleverde routes; 4 eerlijke harde afkeuringen (racefiets Veluwe/Salland, gravel heuvels, gewone fiets polder); 1 restafwijking: Maastricht racefiets 0,8% onverhard volgens de routebron zelf (nameting: 0 vakken)."
      practice_status: "René test mee in de praktijk (Hengelo/Zwolle-lussen); eerdere praktijktests vonden gravel op 'verharde' routes — aanleiding voor de 30-07-besluiten."
      known_limitations:
        - "GraphHopper custom model kent geen bike_access; fietslegaliteit leunt op het racingbike/bike-profiel zelf plus de Overpass-nameting achteraf."
        - "25–40% van de NL-routemeters heeft geen OSM-surface-tag; de motor mijdt onbekend (straf ×0.4 + selectie-gate taak #487) maar kan het niet altijd uitsluiten; BGT vult alleen het NL-gat. Resterend onbekend op de racefiets ⇒ 'niet volledig geverifieerd' + expliciete keuze vereist."
        - "Harde straf (multiply_by 0/0.01) laat de zoektocht exploderen; 0.05 + eerlijke herkansing zonder model is het compromis — de nameting blijft dan de poort."
        - "Overpass-nameting kan falen (mirror-storing); dan is er geen obstakel-/verbodsmeting en geldt fail-open (route wordt niet blind geweigerd)."
        - "ORS blijft terugvalmotor zonder wegdekbesef; alleen relevant als de GH-sleutel wegvalt."

    proposed_promise:
      text: "Je krijgt binnen 30 seconden een route die aantoonbaar geschikt is voor je gekozen fiets: op de racefiets 0% aantoonbaar onverhard, nooit een trap, fietsverbod of afgesloten poort, en zo min mogelijk onbekend wegdek. Kan dat in dit gebied niet, dan zegt Sparki dat eerlijk in plaats van een 'minst slechte' route te geven."
      proposed_by: replit
      rationale: "Dit is de Komoot-vervangingsbelofte: wielrenners gebruiken Komoot voor route→GPX→Garmin; elke geaccepteerde onverharde meter betekent dat niemand overstapt. Grenzen zijn al bindend vastgesteld door René (PO-01, 30-07-2026)."
      rene_approved: false

    external_intelligence:
      research_required: true
      candidate_sources:
        - name: "GraphHopper Directions API (betaald, hosted)"
          coverage: "Wereldwijde routering op OSM-data; custom models met surface/road_class-straffen; round_trip-lussen. Dekt NIET: bike_access in hosted custom models, garanties over OSM-datakwaliteit."
          actuality: "Live API, OSM-basis wordt door GraphHopper doorlopend ververst (dagen-orde); API-versie 1."
          license_status: "Commercieel abonnement met eigen sleutel (GRAPHHOPPER_API_KEY); commercieel gebruik toegestaan binnen abonnement; kosten-/limietbewaking nog niet ingericht (open punt PO-01)."
          limitations:
            - "surface-details alleen zo goed als OSM-tagging (25–40% onbekend in NL)"
            - "harde uitsluitingen (multiply_by 0) onbruikbaar (maximum nodes)"
            - "round_trip met custom model rekt afstand ~45% op; adaptieve hercorrectie nodig"
          applicability: "De routemotor zelf: kiest de wegen, levert per route gratis surface-path-details die als eerste geschiktheidsmeting dienen."
        - name: "OpenStreetMap via Overpass API (mirror-keten)"
          coverage: "NL/EU-dekkend voor tags surface/highway/bicycle/access/barrier/tracktype/smoothness. Dekt NIET: ongetagde wegen (geen tag ≠ verhard), actualiteit ter plekke."
          actuality: "Minutelijks bijgewerkte OSM-spiegel; tagdekking wisselt per regio en verandert doorlopend."
          license_status: "ODbL 1.0, commercieel gebruik toegestaan met bronvermelding; publieke Overpass-mirrors zijn fair-use zonder SLA (provider-compliance-risico voor commerciële schaal)."
          limitations:
            - "504's op verbose queries; mirror osm.ch onbruikbaar; maps.mail.ru primair"
            - "geen garantie dat ontbrekende tags 'geen probleem' betekenen"
          applicability: "Onafhankelijke nameting (verificatiepoort) per kandidaat: obstakels (trap/poort), fietsverbod, wegdekverdeling — de tweede sleutel naast de motor."
        - name: "BGT via PDOK OGC API (Basisregistratie Grootschalige Topografie)"
          coverage: "Alleen Nederland; verhardingssoort (fysiek_voorkomen) per wegdeel, landsdekkend door gemeentes onderhouden. Dekt NIET: buitenland, en 'transitie'-vakken."
          actuality: "Doorlopend gemuteerd door bronhouders; API live; wijzigingstempo traag (24h-cache verantwoord)."
          license_status: "CC0 1.0 — vrij, ook commercieel."
          limitations:
            - "rate-limited; tegelplafond per aanvraag → niet elke meter wordt beoordeeld"
            - "vlak-geometrie: punt-in-polygoon kan bij randen naastgelegen vlak raken"
          applicability: "Controlelaag die het OSM-onbekend-gat in NL dicht (selectie-straf + wegtypescherm), niet de motor."
        - name: "NDW (Nationaal Dataportaal Wegverkeer)"
          coverage: "NL wegwerkzaamheden/afsluitingen/verkeersdata, vooral hoofdwegennet; fietspaden en landelijke weggetjes mager gedekt."
          actuality: "Near-realtime feeds; open data."
          license_status: "Open data (CC0/CC-BY per dataset), commercieel bruikbaar."
          limitations:
            - "fietsinfrastructuur is geen kernscope; dekking voor racefietsroutes onbewezen"
            - "integratie-inspanning (DATEX II) aanzienlijk"
          applicability: "KANDIDAAT (nog niet in gebruik): actuele afsluitingen/werkzaamheden op de route melden — zou het 'OSM kan verouderd zijn'-gat deels dichten."
        - name: "EU-equivalenten van BGT — per land/gewest getoetst 30-07-2026 (PO-04): België GRB (Vlaanderen) + PICC (Wallonië) + UrbIS (Brussel), Duitsland ATKIS Basis-DLM, Frankrijk BD TOPO"
          coverage: "BE-Vlaanderen: GRB Wegsegment landsdekkend mét verhardingsattribuut (VERH/LBLVERH, lijngeometrie). BE-Wallonië: PICC Voirie-Axe/Surface heeft GEEN revêtement-attribuut, alleen wegklasse NATUR (Communale/Nationale/Autoroute/Piste cyclable/Chemin ou sentier) — proxy vergelijkbaar met FR. BE-Brussel: UrbIS straatassen/Topo/Vector zijn een wegenreferentieel zonder wegdekattribuut (klein, vrijwel volledig verhard gewest). DE: Basis-DLM per Bundesland, alleen GROF binair signaal (Befestigung befestigt/onbefestigd op weg-/padassen, geen materiaalsoort). FR: BD TOPO troncon_de_route heeft GEEN surface-attribuut, alleen Nature-proxy (route empierrée/chemin/sentier). Geen uniforme EU-brede verhardingsbron; INSPIRE-transport is te grof. De Vlaamse GRB-laag mag dus nooit 'heel België' claimen."
          actuality: "BE-Vlaanderen: live OGC API Features (geo.api.vlaanderen.be/GRB, zelf bevraagd 30-07). BE-Wallonië: live ArcGIS REST geoservices.wallonie.be TOPOGRAPHIE/PICC_VDIFF (zelf bevraagd 30-07, velden + distinct-waarden) + WMS/WFS/downloads. BE-Brussel: datastore.brussels downloads + WFS/Atom/WMS, maandelijkse versies. DE: bulk GeoPackage via basemap.de-opendata-dienst + per-Land-portalen, geen uniforme feature-API. FR: Géoplateforme (data.geopf.fr) downloads + diensten."
          license_status: "Alle getoetste bronnen open en commercieel bruikbaar: GRB onder 'Gratis open data licentie Vlaanderen v1.02' (naamvermelding Digitaal Vlaanderen); PICC sinds 21-05-2019 gratis voor elk gebruik incl. commercieel (CGA/CGU + Conditions particulières type C; naamvermelding 'Service public de Wallonie'; kanttekening: verkoopprijs moet in verhouding staan tot eigen bewerking); UrbIS-datasets op datastore.brussels CC0 1.0; Basis-DLM inmiddels in alle 16 Länder open (meestal DL-DE/BY-2.0 of DL-DE/Zero, Bremen CC-BY 4.0 — exacte bronvermeldingstekst per Land vastleggen bij activering); BD TOPO onder Licence Ouverte Etalab 2.0 sinds 1-1-2021 (naamvermelding IGN). Bronnen en details: docs/productonderzoek/PO-04-EU-BGT-EQUIVALENTEN-LICENTIES.md."
          limitations:
            - "alleen Vlaanderen biedt een BGT-waardig verhardingsattribuut per wegvak; DE alleen binair, FR/Wallonië alleen wegtype-proxy, Brussel niets — een 0%-belofte op BGT-niveau kan buiten NL alleen in Vlaanderen"
            - "DE = 16 leveringen (of basemap.de-bundel) met per-Land bronvermelding; integratie bewerkelijk"
            - "overige EU-landen (buiten BE/DE/FR) nog niet licentie-getoetst"
          applicability: "Vlaanderen GEACTIVEERD (30-07-2026, taak #470): GRB Wegsegment als controlelaag in lib/grb-verharding.ts — zelfde patroon als de BGT (tegelcache, plafond, eerlijk null), maar punt-op-lijn-matching op de lijngeometrie; Vlaanderen-omtrek-filter met Brussel als gat; verplichte naamvermelding 'Bron: Grootschalig Referentie Bestand Vlaanderen, Digitaal Vlaanderen' in grbSource() en in elke GRB-melding. De buitenland-copy 'minder zeker over wegdek' vervalt daarmee alleen voor Vlaanderen. Resterende kandidaten, volgorde-advies PO-04: 2) Duitsland (binair, eerlijk-zwakkere claim), 3) Frankrijk (geen sterkere claim mogelijk, copy blijft 'minder zeker over wegdek'). Wallonië en Brussel: juridisch open maar zonder wegdekattribuut — géén activeringskandidaat, eerlijk-zwakkere belofte blijft daar gelden. Buiten NL+Vlaanderen blijft de belofte zwakker (alleen OSM+GH)."
      sources_in_use:
        - "GraphHopper Directions API — motor + eerste wegdekmeting (enige motor met custom models binnen bereik)"
        - "OpenStreetMap/Overpass — onafhankelijke verificatiepoort (obstakels, verbod, wegdek)"
        - "BGT/PDOK — NL-controlelaag voor onbekend wegdek"
        - "GRB/Digitaal Vlaanderen — Vlaanderen-controlelaag voor onbekend wegdek (Wegsegment VERH+MORF, lijngeometrie; naamvermelding verplicht; sinds 30-07-2026, taak #470)"
      privacy_status: unknown
      missing_information:
        - "Kosten-/limietbewaking GraphHopper-abonnement (verbruik per dag, plafondgedrag) is niet ingericht."
        - "Commerciële status publieke Overpass-mirrors op schaal (eigen instance nodig?)."
        - "EU-brede wegdekbron bestaat niet; per-land-licenties voor de prioriteitslanden getoetst 30-07-2026 (PO-04, incl. aanvulling BE per gewest): heel België (GRB/PICC/UrbIS), DE en FR zijn open en commercieel bruikbaar, maar alleen Vlaams GRB heeft een BGT-waardig verhardingsattribuut (DE binair, FR en Wallonië alleen wegtype-proxy, Brussel niets). Nog open: overige EU-landen. Zie docs/productonderzoek/PO-04-EU-BGT-EQUIVALENTEN-LICENTIES.md."
        - "NDW-dekking voor fietsrelevante afsluitingen niet empirisch getoetst."
        - "Wikiloc als buitenland-wegdeksignaal onderzocht (30-07-2026) en afgewezen: geen publieke API, ToS staan uitsluitend persoonlijk/niet-commercieel gebruik toe, scraping expliciet verboden, sui-generis databankrecht; bovendien zeggen community-tracks waar gefietst wordt, niet wat verhard is. Alternatieven (waymarkedtrails = OSM-data die we al via Overpass hebben; Strava-heatmap = alleen OSM-editing toegestaan) voegen evenmin een legaal wegdeksignaal toe. Buitenland-copy blijft 'minder zeker over wegdek'. Zie docs/productonderzoek/PO-03-WIKILOC-BUITENLAND-WEGDEK.md."

    replit_definition:
      objective_quality_standard: "Per gegenereerde racefietsroute: 0 gemeten onverharde meters (GH-details én Overpass én BGT waar beschikbaar), 0 trappen, 0 fietsverbod-meters, 0 afgesloten poorten; afstandsafwijking ≤10% van het doel; generatie ≤30 s interactief. Onbekend-wegdek-aandeel structureel dalend (BGT-resolutie gemeten per route)."
      recommended_default: "Motor-straffen (onverhard 0.05, onbekend 0.4, trap 0.05) + best-of-N-selectie + absolute weigeringspoort; bij aantoonbare blokkade eerlijk falen met handelingsperspectief (ander startpunt/afstand)."
      technical_limits:
        - "Per-segment-toetsing is haalbaar (GH-details + Overpass-sampling ≤600 punten), maar de interactieve nameting draait onder een 2,5s-budget — bij trage Overpass valt de meting eerlijk weg (fail-open)."
        - "0% geldt voor AANTOONBAAR onverhard; fysieke werkelijkheid kan afwijken waar alle bronnen zwijgen."
      assumptions:
        - "OSM-wegen zonder surface-tag zijn in NL meestal asfalt (woonstraten) — daarom straf 0.4 en geen uitsluiting."
      unknowns:
        - "Slaagkans van de generator in gravel-rijke regio's (Veluwe/heuvelland) onder de absolute poort: hoe vaak 'geen route gevonden'?"
        - "Gedrag/kwaliteit buiten NL en Vlaanderen zonder officiële-kaart-controlelaag (BGT/GRB)."
      evidence_method:
        - "Geautomatiseerde suitability-proof over meerdere startpunten/fietstypen tegen René's grenzen (bestaat; her-runnen na motor-fix — taken #437/#442 leveren de afkeurpoort-bewijzen)."
        - "Tegenvoorbeeld-tests per afkeurregel (zie acceptance_contract)."
        - "Praktijktest door René/Dylan: route rijden of way-voor-way nalopen."

    rene_calibration:
      questions:
        - question: "Als er binnen de gevraagde afstand géén 100%-schone route bestaat: wil je (a) alleen de eerlijke foutmelding, of (b) ook een aangepast voorstel (andere afstand/startpunt) dat wél schoon is?"
          answer_rene: "Ook een aangepast voorstel (andere afstand/startpunt) dat wél schoon is." # beantwoord 2026-07-30
        - question: "Hoeveel afstandsafwijking is acceptabel als de schone route daardoor mogelijk wordt (bv. 40 km gevraagd, schoonste optie is 46 km)? [maximale omweg]"
          answer_rene: "Maakt niet uit: geschikt gaat vóór afstand (geen harde omweggrens)." # beantwoord 2026-07-30
        - question: "Prioriteitsvolgorde bij conflict tussen mooi/rustig/snel/veilig/exact-op-afstand — wat mag wijken zodra 'geschikt' geborgd is?"
          answer_rene: "De gebruiker stelt dit zelf in als voorkeur (smaak-volgorde instelbaar, ná de harde geschiktheidspoorten)." # beantwoord 2026-07-30 (herformuleerd met voorbeeld)
        - question: "Klinkers en slecht wegdek (smoothness=bad) op de racefiets: accepteren, mild melden, of meewegen als afkeur boven een drempel?"
          answer_rene: "Accepteren maar mild melden in de route-info." # beantwoord 2026-07-30
        - question: "Drukke wegen (N-wegen zonder vrijliggend fietspad): hoe zwaar moet 'rustig' wegen t.o.v. afstandsnauwkeurigheid?"
          answer_rene: "Balans: korte stukken N-weg zijn oké. Aanvulling René: bij route-selectie een keuze-optie toevoegen zodat de gebruiker N-wegen kan laten vermijden." # beantwoord 2026-07-30
        - question: "Buiten Nederland (vakantie/EU): is dezelfde 0%-belofte daar houdbaar zonder BGT, of geldt daar een eerlijk zwakkere belofte ('minder zeker over wegdek')?"
          answer_rene: "Eerlijk zwakkere belofte; vermeld dan duidelijk dat in die regio niet altijd bekend is hoe de wegen zijn. Vraag René: kan Wikiloc-kennis daar gebruikt worden? (uit te zoeken: licentie/API van Wikiloc-communityroutes)" # beantwoord 2026-07-30
      completed: true # alle 6 vragen beantwoord 2026-07-30

    acceptance_contract:
      hard_reject_rules:
        - rule: "Een racefietsroute met ook maar één aantoonbaar onverharde/halfverharde meter (gravel, compacted, fine_gravel, dirt, zand, gras, kasseien) wordt nooit aangeboden."
          rule_type: hard_blockage
          measurement_level: per_segment
          aggregate_justification: ""
          counterexamples:
            - case: "Kandidaat-lus van 40 km met één gemeten grindvak van 80 m (surface=gravel), verder 100% asfalt."
              proof_stage: designed
              proof_method: "Logica-doorloop: GH-details geven pavedFraction<0.999 → surfacePenalty ≥3 in de selectie; blijft hij als enige over, dan telt de Overpass-nameting het vak per segment en vuurt de afkeurpoort (#437/#441) — route wordt niet geleverd. Latere geautomatiseerde test: fixture-route met één gravel-way door de poort halen."
              proof_result: not_yet_tested
        - rule: "Een route met een trap, een aantoonbaar fietsverbod (bicycle=no/private) of een afgesloten/privé-poort zonder fiets-uitzondering wordt nooit aangeboden — ook niet als alle alternatieven hetzelfde gebrek hebben (dan faalt de generatie eerlijk)."
          rule_type: hard_blockage
          measurement_level: per_segment
          aggregate_justification: ""
          counterexamples:
            - case: "Alle N kandidaten bevatten dezelfde trap (enige verbinding); systeem zou vroeger de 'minst slechte' leveren."
              proof_stage: designed
              proof_method: "Logica-doorloop op de winnaar-check in de kandidaatselectie: gemeten winnaar met steps>0 ⇒ throw met eerlijke NL-fout, geen route. Latere test: obstaclesOf-stub die voor élke kandidaat een trap meldt en asserten dat de aanroep faalt i.p.v. levert."
              proof_result: not_yet_tested
            - case: "Poort met locked=yes zonder bicycle=yes op de enige kandidaat."
              proof_stage: designed
              proof_method: "classifyGatePassage(tags)='afgesloten' → blockedGates>0 → zelfde weigering; unit-test op classifyGatePassage bestaat al (20/20), de poort-tot-weigering-keten volgt in de bouwfase-test."
              proof_result: not_yet_tested
        - rule: "Zonder geslaagde onafhankelijke nameting (Overpass) mag een route nooit als 'gecontroleerd/geschikt' worden gepresenteerd — meting mislukt = eerlijk 'niet gecontroleerd', nooit stilzwijgend groen."
          rule_type: unverifiable
          measurement_level: per_sessie
          aggregate_justification: ""
          counterexamples:
            - case: "Overpass-mirrors geven 504 tijdens generatie; route wordt geleverd."
              proof_stage: designed
              proof_method: "Redenering: obstaclesOf retourneert null → weigering vuurt niet (fail-open, bewuste keuze) maar het wegdekscherm toont 'onvoldoende gegevens' i.p.v. een verdict. Latere test: null-meting ⇒ response bevat geen geschiktheids-claim."
              proof_result: not_yet_tested
        - rule: "Onbekend wegdek op de racefiets is niet-verifieerbaar en dus géén zachte tolerantie (aanscherping René 30-07-2026): zolang een onbekend segment niet geverifieerd is, wordt de route niet als geschikte racefietsroute aanbevolen. Gedrag: (1) eerst een alternatief zonder onbekend wegdek zoeken; (2) niet als geschikt aanbevelen zolang onbekend niet geverifieerd is; (3) alleen na expliciete keuze van de gebruiker tonen in regio's waar geen volledig verifieerbare route mogelijk is; (4) percentage én locaties van het onbekende wegdek duidelijk tonen."
          rule_type: unverifiable
          measurement_level: per_segment
          aggregate_justification: ""
          counterexamples:
            - case: "Racefietslus met 12% onbekend wegdek (knownPct 88) wordt zonder expliciete gebruikerskeuze als 'geschikte racefietsroute' aanbevolen."
              proof_stage: executed
              proof_method: "Gebouwd (taak #487, 30-07-2026) + geautomatiseerde tegenvoorbeeld-test `pnpm --filter @workspace/api-server run test:route-racefiets-verification` (src/tests/route-racefiets-verification.ts, 7/7 groen): (1) selectie zoekt eerst een alternatief zonder onbekend wegdek (roadUnknownGatePenalty +5 op gemeten onbekend, early-stop en verlengingsronde eisen knownFraction ≥0.999, nooit gokken bij null); (2) computeBikeSuitability geeft racefiets bij >0% onbekend het verdict 'niet_geverifieerd' ('Niet volledig geverifieerd') i.p.v. 'goed/gedeeltelijk' — 12% onbekend ⇒ afgewezen als geschikt; (3) UI (route-panel) blokkeert Bewaar/Navigeer tot een expliciete keuze-checkbox is aangevinkt, per kandidaat opnieuw; (4) onbekend-% (engineSurface.knownPct dan wel scherm-meting ná BGT/GRB) en de onbekende segmenten worden getoond en op de kaart gemarkeerd."
              proof_result: rejected_as_expected
        - rule: "Retroactief geregistreerd (vondst René 30-07-2026): de onverhard-voorkeur (gravel/MTB) mag nooit een dode knop zijn — bij een ingestelde voorkeur stuurt de routemotor zélf op onverhard wegdek (voorkeursstraf op verhard, schalend met de voorkeur, met vloer — nooit een harde 0), en de racefiets krijgt deze sturing nooit."
          rule_type: hard_blockage
          measurement_level: per_sessie
          aggregate_justification: ""
          counterexamples:
            - case: "Gravelfiets geselecteerd met onverhard-voorkeur, maar de geleverde lus is ~97% verhard (0,5% bospad, 0,1% los gravel) omdat de motor nooit op onverhard stuurde — de voorkeur werkte alleen als nakeuze tussen louter verharde kandidaten."
              proof_stage: executed
              proof_method: "Geautomatiseerde test `pnpm --filter @workspace/api-server run test:gravel-steering` (src/tests/gravel-unpaved-steering.ts, 4 tests): gravel+voorkeur ⇒ verhard-wegdek-straf aanwezig en schalend (0,4⇒×0.52; 1,0⇒vloer ×0.3, nooit 0); zonder voorkeur geen straf; racefiets krijgt de sturing nooit én houdt de ×0.05-onverhard-straf. Plus live-meting 30-07-2026 (Hengelo, 47 km, voorkeur 40%): vóór fix ~91–97% verhard, ná fix 76,8% verhard (23,2% onverhard) — voorkeur, geen garantie."
              proof_result: rejected_as_expected
