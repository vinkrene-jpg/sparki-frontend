# BIJLAGE — Bevestigde BOUWOPGAVEN hoofdstuk F (besluiten René 30-07-2026)
# Alle onderstaande gedragingen zijn GEWENST maar bestaan nog niet (of niet
# volledig) in het product. Niets hiervan is gebouwd; proof_stage blijft
# designed tot na bouw + onafhankelijk bewijs.
# ---------------------------------------------------------------------------
# 1. Racedag-SSOT: één samengevoegd racedag-voedingsplan (starttijd, duur/
#    intensiteit, route/hoogte, weer, belasting/herstel, geoefende inname,
#    voorkeuren/toestemming, coachinstructies); andere modules consumeren,
#    rekenen nooit zelf. Race-intel-hydratatie gelijktrekken hoort hierbij.
# 2. Onbekende leeftijd fail-closed in de fueling-engine (jeugdveilige route,
#    vriendelijke leeftijdsvraag; nooit stil als volwassene).
# 3. Eén veiligheidsgrens op 17 jaar: fueling-getallengrens 16→17; praktische
#    sportvoeding blijft; gram-per-uur alleen in begeleide context.
# 4. Gedempte gewichtstrend als volwaardig coachonderdeel (gedateerde
#    metingen, geen lineaire prognose) + wekelijkse overslaanbare
#    weeg-uitnodiging (uitschakelbaar, nooit jeugd).
# 5. LLM-getallencontrole als contracttest (elk getal herleidbaar tot engine
#    of coach-instructie).
# 6. Zichtbare 'houdt nog geen rekening met jouw voorkeuren'-melding zonder
#    consent + ernstige-allergie-blokkade (geen concreet productadvies).
# 7. Opt-in cafeïnelaag voor volwassenen met vastgelegde voorwaarden (nooit
#    jeugd/onbekende leeftijd, eerst in training, geen supplementaanbeveling).
# 8. Oefen-bewaking hoge wedstrijd-inname: niet geoefend ⇒ niet de hoogste
#    waarde adviseren, eerst progressieve opbouw; GI-feedback registreren.
# 9. Racedag-ochtendprotocol op werkelijke starttijd (ontbijtvenster,
#    bekende voeding, noodscenario).
# 10. Gewicht voor/na de rit optioneel invulbaar (zweetverlies-inzicht) met
#     eerlijke duiding; bij jeugd nooit als lichaamscontrole.
# 11. Gezondheidsstatus-koppeling: acute blokkade onderdrukt prestatie-
#     fueling (neutrale ondersteuning blijft); niet-acuut = aangepast.
# 12. Ouderzicht op praktische jeugdvoeding (rollen/toestemming correct);
#     gevoelige onderdelen alleen met aparte toestemming.
# 13. Aankomdoel-flow volwassenen binnen veiligheidskader (expliciete
#     bevestiging, onderscheid doeltypes, professional bij risicosignalen).
# 14. Instelbare bidonmaat + per-rit-registratie; 500 ml alleen als zichtbaar
#     geschatte tijdelijke default.
# 15. Rit-tijdstip-/routeweer voor hydratatie met fallback-ladder en
#     expliciete 'generiek advies'-melding.
# 16. Schattingsweergave met betrouwbaarheidsniveau + bandbreedte (geen
#     schijnprecisie).
