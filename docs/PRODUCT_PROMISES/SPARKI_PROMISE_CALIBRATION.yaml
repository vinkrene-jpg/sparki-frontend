          coverage: "Dekt het principe van gefaseerde terugkeer en 'geen intensieve training bij koorts'. Dekt NIET: individuele medische beoordeling."
          actuality: "Consensus-statements, periodiek herzien; stabiele kernprincipes."
          license_status: "Vrij toepasbaar als onderbouwing op richtlijnniveau."
          limitations:
