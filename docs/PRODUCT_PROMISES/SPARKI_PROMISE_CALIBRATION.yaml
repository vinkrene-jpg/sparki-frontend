    acceptance_contract:
      hard_reject_rules:
        - rule: "Bij een harde medische of acute blokkade (actieve status ziek/geblesseerd met klachten of 'niet trainen') bestaat er nergens in het product een trainingsprikkel of prestatie-aansporing voor die dag; bij een niet-acute klacht of herstel-/re-integratiefase bestaat uitsluitend aangepaste belasting volgens vooraf vastgelegde veiligheidscriteria, en bij duidelijke gezondheidsrisico's weegt veiligheid zwaarder dan de wens van sporter of coach."
          rule_type: hard_blockage
