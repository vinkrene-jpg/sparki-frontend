          answer_rene: "Huidige rustige 6 s, maar check ook de gps-signaalkwaliteit: bij zwak signaal terughoudender melden om onnodige afwijk-meldingen te voorkomen als de renner toch op de route blijkt te rijden." # beantwoord 2026-07-30
      completed: true # beantwoord 2026-07-30

    acceptance_contract:
      hard_reject_rules:
        - rule: "Een renner die aantoonbaar op de route rijdt mag nooit een afwijk-melding krijgen."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "Spaarzame routegeometrie (punten 80 m uiteen) laat punt-afstand 50 m 'off-route' lijken terwijl de renner op het wegvak rijdt."
              proof_stage: executed
