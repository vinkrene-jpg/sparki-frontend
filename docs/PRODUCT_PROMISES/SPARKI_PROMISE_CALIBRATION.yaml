# SPARKI PROMISE CALIBRATION
# Hoofdstuk D — Routes en navigatie
# Opgesteld: 2026-07-30 (opdracht v2, taak #444). Alleen dit hoofdstuk; geen productcode gewijzigd.
# Bindende context: Product Proof Doctrine; acceptatiegrenzen René 30-07-2026
# (PO-01 §Acceptatiegrenzen + Addendum obstakelbesluiten): 0% aantoonbaar onverhard
# racefiets; trap/fietsverbod/afgesloten poort = absolute weigering (nooit aanbieden);
# onbekend wegdek actief mijden; wereldmarkt-lat: elk onderdeel ≥9/10 t.o.v. de beste
# marktspeler (Komoot voor routes).

chapter_d_routes_en_navigatie:

  - id: ROUTES_GENERATOR_001
    module: Routes en navigatie
    subject: "Routegenerator (lussen en A-B) met fietstype-geschiktheid"
    status: needs_calibration

    current_state:
      technical_status: implemented
      source_snapshot: 2026-07-30
      evidence_status: "Deels: geautomatiseerde route-suitability-proof bestaat (docs/product/proof-evidence/route-suitability-*.json); laatste volledige run vóór de motor-fix van 30-07 faalde op onverhard-grenzen; taken #437/#441/#442 (harde afkeurpoort + bewijs) net gemerged, nieuwe volledige run tegen René's grenzen staat nog uit."
      practice_status: "René test mee in de praktijk (Hengelo/Zwolle-lussen); eerdere praktijktests vonden gravel op 'verharde' routes — aanleiding voor de 30-07-besluiten."
      known_limitations:
        - "GraphHopper custom model kent geen bike_access; fietslegaliteit leunt op het racingbike/bike-profiel zelf plus de Overpass-nameting achteraf."
        - "25–40% van de NL-routemeters heeft geen OSM-surface-tag; onbekend wordt gemeden (straf ×0.4) maar niet uitgesloten; BGT vult alleen het NL-gat."
        - "Harde straf (multiply_by 0/0.01) laat de zoektocht exploderen; 0.05 + eerlijke herkansing zonder model is het compromis — de nameting blijft dan de poort."
        - "Overpass-nameting kan falen (mirror-storing); dan is er geen obstakel-/verbodsmeting en geldt fail-open (route wordt niet blind geweigerd)."
        - "ORS blijft terugvalmotor zonder wegdekbesef; alleen relevant als de GH-sleutel wegvalt."

    proposed_promise:
      text: "Je krijgt binnen 30 seconden een route die aantoonbaar geschikt is voor je gekozen fiets: op de racefiets 0% aantoonbaar onverhard, nooit een trap, fietsverbod of afgesloten poort, en zo min mogelijk onbekend wegdek. Kan dat in dit gebied niet, dan zegt Sparki dat eerlijk in plaats van een 'minst slechte' route te geven."
      proposed_by: replit
      rationale: "Dit is de Komoot-vervangingsbelofte: wielrenners gebruiken Komoot voor route→GPX→Garmin; elke geaccepteerde onverharde meter betekent dat niemand overstapt. Grenzen zijn al bindend vastgesteld door René (PO-01, 30-07-2026)."
      rene_approved: false

    external_intelligence:
      research_required: true
      candidate_sources:
        - name: "GraphHopper Directions API (betaald, hosted)"
          coverage: "Wereldwijde routering op OSM-data; custom models met surface/road_class-straffen; round_trip-lussen. Dekt NIET: bike_access in hosted custom models, garanties over OSM-datakwaliteit."
          actuality: "Live API, OSM-basis wordt door GraphHopper doorlopend ververst (dagen-orde); API-versie 1."
          license_status: "Commercieel abonnement met eigen sleutel (GRAPHHOPPER_API_KEY); commercieel gebruik toegestaan binnen abonnement; kosten-/limietbewaking nog niet ingericht (open punt PO-01)."
          limitations:
            - "surface-details alleen zo goed als OSM-tagging (25–40% onbekend in NL)"
            - "harde uitsluitingen (multiply_by 0) onbruikbaar (maximum nodes)"
            - "round_trip met custom model rekt afstand ~45% op; adaptieve hercorrectie nodig"
          applicability: "De routemotor zelf: kiest de wegen, levert per route gratis surface-path-details die als eerste geschiktheidsmeting dienen."
        - name: "OpenStreetMap via Overpass API (mirror-keten)"
          coverage: "NL/EU-dekkend voor tags surface/highway/bicycle/access/barrier/tracktype/smoothness. Dekt NIET: ongetagde wegen (geen tag ≠ verhard), actualiteit ter plekke."
          actuality: "Minutelijks bijgewerkte OSM-spiegel; tagdekking wisselt per regio en verandert doorlopend."
          license_status: "ODbL 1.0, commercieel gebruik toegestaan met bronvermelding; publieke Overpass-mirrors zijn fair-use zonder SLA (provider-compliance-risico voor commerciële schaal)."
          limitations:
            - "504's op verbose queries; mirror osm.ch onbruikbaar; maps.mail.ru primair"
            - "geen garantie dat ontbrekende tags 'geen probleem' betekenen"
          applicability: "Onafhankelijke nameting (verificatiepoort) per kandidaat: obstakels (trap/poort), fietsverbod, wegdekverdeling — de tweede sleutel naast de motor."
        - name: "BGT via PDOK OGC API (Basisregistratie Grootschalige Topografie)"
          coverage: "Alleen Nederland; verhardingssoort (fysiek_voorkomen) per wegdeel, landsdekkend door gemeentes onderhouden. Dekt NIET: buitenland, en 'transitie'-vakken."
          actuality: "Doorlopend gemuteerd door bronhouders; API live; wijzigingstempo traag (24h-cache verantwoord)."
          license_status: "CC0 1.0 — vrij, ook commercieel."
          limitations:
            - "rate-limited; tegelplafond per aanvraag → niet elke meter wordt beoordeeld"
            - "vlak-geometrie: punt-in-polygoon kan bij randen naastgelegen vlak raken"
          applicability: "Controlelaag die het OSM-onbekend-gat in NL dicht (selectie-straf + wegtypescherm), niet de motor."
        - name: "NDW (Nationaal Dataportaal Wegverkeer)"
          coverage: "NL wegwerkzaamheden/afsluitingen/verkeersdata, vooral hoofdwegennet; fietspaden en landelijke weggetjes mager gedekt."
          actuality: "Near-realtime feeds; open data."
          license_status: "Open data (CC0/CC-BY per dataset), commercieel bruikbaar."
          limitations:
            - "fietsinfrastructuur is geen kernscope; dekking voor racefietsroutes onbewezen"
            - "integratie-inspanning (DATEX II) aanzienlijk"
          applicability: "KANDIDAAT (nog niet in gebruik): actuele afsluitingen/werkzaamheden op de route melden — zou het 'OSM kan verouderd zijn'-gat deels dichten."
        - name: "EU-equivalenten van BGT (o.a. Duitsland ALKIS/ATKIS, België GRB, Frankrijk BD TOPO)"
          coverage: "Per land verschillend; geen uniforme EU-brede verhardingsbron; INSPIRE-transport-thema is te grof voor wegdek per vak."
          actuality: "Per land wisselend; geen uniforme API."
          license_status: "Per land verschillend (GRB en BD TOPO open; Duitse Länder wisselend) — per land te toetsen vóór EU-uitrol."
          limitations:
            - "geen enkele bron geeft EU-breed wegdek per wegvak zoals de BGT"
          applicability: "KANDIDAAT voor de EU-uitrol: per land een BGT-achtige controlelaag; tot die tijd is de belofte buiten NL zwakker (alleen OSM+GH)."
      sources_in_use:
        - "GraphHopper Directions API — motor + eerste wegdekmeting (enige motor met custom models binnen bereik)"
        - "OpenStreetMap/Overpass — onafhankelijke verificatiepoort (obstakels, verbod, wegdek)"
        - "BGT/PDOK — NL-controlelaag voor onbekend wegdek"
      privacy_status: unknown
      missing_information:
        - "Kosten-/limietbewaking GraphHopper-abonnement (verbruik per dag, plafondgedrag) is niet ingericht."
        - "Commerciële status publieke Overpass-mirrors op schaal (eigen instance nodig?)."
        - "EU-brede wegdekbron bestaat niet; per-land-licenties niet uitgezocht."
        - "NDW-dekking voor fietsrelevante afsluitingen niet empirisch getoetst."

    replit_definition:
      objective_quality_standard: "Per gegenereerde racefietsroute: 0 gemeten onverharde meters (GH-details én Overpass én BGT waar beschikbaar), 0 trappen, 0 fietsverbod-meters, 0 afgesloten poorten; afstandsafwijking ≤10% van het doel; generatie ≤30 s interactief. Onbekend-wegdek-aandeel structureel dalend (BGT-resolutie gemeten per route)."
      recommended_default: "Motor-straffen (onverhard 0.05, onbekend 0.4, trap 0.05) + best-of-N-selectie + absolute weigeringspoort; bij aantoonbare blokkade eerlijk falen met handelingsperspectief (ander startpunt/afstand)."
      technical_limits:
        - "Per-segment-toetsing is haalbaar (GH-details + Overpass-sampling ≤600 punten), maar de interactieve nameting draait onder een 2,5s-budget — bij trage Overpass valt de meting eerlijk weg (fail-open)."
        - "0% geldt voor AANTOONBAAR onverhard; fysieke werkelijkheid kan afwijken waar alle bronnen zwijgen."
      assumptions:
        - "OSM-wegen zonder surface-tag zijn in NL meestal asfalt (woonstraten) — daarom straf 0.4 en geen uitsluiting."
      unknowns:
        - "Slaagkans van de generator in gravel-rijke regio's (Veluwe/heuvelland) onder de absolute poort: hoe vaak 'geen route gevonden'?"
        - "Gedrag/kwaliteit buiten NL zonder BGT-laag."
      evidence_method:
        - "Geautomatiseerde suitability-proof over meerdere startpunten/fietstypen tegen René's grenzen (bestaat; her-runnen na motor-fix — taken #437/#442 leveren de afkeurpoort-bewijzen)."
        - "Tegenvoorbeeld-tests per afkeurregel (zie acceptance_contract)."
        - "Praktijktest door René/Dylan: route rijden of way-voor-way nalopen."

    rene_calibration:
      questions:
        - "Als er binnen de gevraagde afstand géén 100%-schone route bestaat: wil je (a) alleen de eerlijke foutmelding, of (b) ook een aangepast voorstel (andere afstand/startpunt) dat wél schoon is?"
        - "Hoeveel afstandsafwijking is acceptabel als de schone route daardoor mogelijk wordt (bv. 40 km gevraagd, schoonste optie is 46 km)? [maximale omweg]"
        - "Prioriteitsvolgorde bij conflict tussen mooi/rustig/snel/veilig/exact-op-afstand — wat mag wijken zodra 'geschikt' geborgd is?"
        - "Klinkers en slecht wegdek (smoothness=bad) op de racefiets: accepteren, mild melden, of meewegen als afkeur boven een drempel?"
        - "Drukke wegen (N-wegen zonder vrijliggend fietspad): hoe zwaar moet 'rustig' wegen t.o.v. afstandsnauwkeurigheid?"
        - "Buiten Nederland (vakantie/EU): is dezelfde 0%-belofte daar houdbaar zonder BGT, of geldt daar een eerlijk zwakkere belofte ('minder zeker over wegdek')?"
      completed: false

    acceptance_contract:
      hard_reject_rules:
        - rule: "Een racefietsroute met ook maar één aantoonbaar onverharde/halfverharde meter (gravel, compacted, fine_gravel, dirt, zand, gras, kasseien) wordt nooit aangeboden."
          measurement_level: per_segment
          aggregate_justification: ""
          counterexamples:
            - case: "Kandidaat-lus van 40 km met één gemeten grindvak van 80 m (surface=gravel), verder 100% asfalt."
              proof_stage: designed
              proof_method: "Logica-doorloop: GH-details geven pavedFraction<0.999 → surfacePenalty ≥3 in de selectie; blijft hij als enige over, dan telt de Overpass-nameting het vak per segment en vuurt de afkeurpoort (#437/#441) — route wordt niet geleverd. Latere geautomatiseerde test: fixture-route met één gravel-way door de poort halen."
              proof_result: not_yet_tested
        - rule: "Een route met een trap, een aantoonbaar fietsverbod (bicycle=no/private) of een afgesloten/privé-poort zonder fiets-uitzondering wordt nooit aangeboden — ook niet als alle alternatieven hetzelfde gebrek hebben (dan faalt de generatie eerlijk)."
          measurement_level: per_segment
          aggregate_justification: ""
          counterexamples:
            - case: "Alle N kandidaten bevatten dezelfde trap (enige verbinding); systeem zou vroeger de 'minst slechte' leveren."
              proof_stage: designed
              proof_method: "Logica-doorloop op de winnaar-check in de kandidaatselectie: gemeten winnaar met steps>0 ⇒ throw met eerlijke NL-fout, geen route. Latere test: obstaclesOf-stub die voor élke kandidaat een trap meldt en asserten dat de aanroep faalt i.p.v. levert."
              proof_result: not_yet_tested
            - case: "Poort met locked=yes zonder bicycle=yes op de enige kandidaat."
              proof_stage: designed
              proof_method: "classifyGatePassage(tags)='afgesloten' → blockedGates>0 → zelfde weigering; unit-test op classifyGatePassage bestaat al (20/20), de poort-tot-weigering-keten volgt in de bouwfase-test."
              proof_result: not_yet_tested
        - rule: "Zonder geslaagde onafhankelijke nameting (Overpass) mag een route nooit als 'gecontroleerd/geschikt' worden gepresenteerd — meting mislukt = eerlijk 'niet gecontroleerd', nooit stilzwijgend groen."
          measurement_level: per_sessie
          aggregate_justification: ""
          counterexamples:
            - case: "Overpass-mirrors geven 504 tijdens generatie; route wordt geleverd."
              proof_stage: designed
              proof_method: "Redenering: obstaclesOf retourneert null → weigering vuurt niet (fail-open, bewuste keuze) maar het wegdekscherm toont 'onvoldoende gegevens' i.p.v. een verdict. Latere test: null-meting ⇒ response bevat geen geschiktheids-claim."
              proof_result: not_yet_tested
      tolerances:
        - "Afstandsafwijking lus: doel ±10% (huidige hercorrectie haalt ±5% in de geteste gevallen)."
        - "Onbekend wegdek: geen harde grens vastgesteld — kalibratievraag; huidig gedrag is actief mijden + eerlijk tonen."
      unknown_data_policy: "Onbekend is een risico, geen vrijbrief (PO-01 §3): motor mijdt onbekend (×0.4), BGT vult NL-gaten, resterend onbekend aandeel wordt eerlijk getoond; onbekend wordt nooit als verhard geteld of verzwegen."
      approved: false

    validation:
      automated_tests:
        - "test:route-suitability (live GH+Overpass, bewijs naar docs/product/proof-evidence/) — her-runnen na motor-fix"
        - "test:route-remarks, test:route-surfaces, test:bgt-verharding (puur, groen 30-07)"
        - "afkeurpoort-bewijstest (taak #442, net gemerged)"
      independent_checks:
        - "Overpass-nameting is een andere bron dan de motor (GH) — ingebouwde onafhankelijkheid"
        - "BGT is een derde, niet-OSM-bron voor NL"
      practice_test_required: true
      practice_testers: ["René", "Dylan"]
      result: not_tested
      expectation_gap:
        - "Eerder gat: 'Volledig' op modulestatus terwijl praktijkroutes gravel bevatten — precies wat deze kalibratie moet voorkomen."
    product_proof:
      score: null
      status: not_proven
      evidence_refs:
        - "docs/product/proof-evidence/route-suitability-*.json (pre-fix run: FAIL op onverhard-grenzen — eerlijk vastgelegd)"
    next_action:
      type: research_or_build_or_retest
      description: "Volledige suitability-proof her-runnen nu custom model + absolute poort actief zijn (meerdere startpunten, racefiets/gravel), en de kalibratievragen door René laten beantwoorden."
      approved_for_execution: false

  - id: ROUTES_HOOGTEPROFIEL_001
    module: Routes en navigatie
    subject: "Hoogteprofiel en hoogtemeters per route"
    status: needs_calibration

    current_state:
      technical_status: implemented
      source_snapshot: 2026-07-30
      evidence_status: "Unit-tests op smoothing/drempel aanwezig; één hoogtepijplijn (summarizeTrack: smooth ±150 m + 3 m-drempel) is SSOT voor de hm-som; profiel-y-as heeft 100 m minimumschaal."
      practice_status: "Eerdere praktijkklacht (400 valse hm op vlakke 48 km-lus; profiel sprak som tegen) is verholpen; nieuwe praktijkrondes na routewijzigingen beperkt."
      known_limitations:
        - "Bronhoogte is provider-SRTM (~30 m-raster, 1–2 m puntruis); absolute nauwkeurigheid per punt blijft een schatting, UI labelt '(geschat)'."
        - "Geen tweede hoogtebron (AHN) — bewust: één bron voor profiel én som, anders keert de tegenspraak terug."
        - "Klimprofielen kunnen bij routewijziging verdwijnen (open taak #427)."

    proposed_promise:
      text: "Het hoogteprofiel en het totaal aantal hoogtemeters komen uit dezelfde meting en spreken elkaar nooit tegen; vlak Nederland toont eerlijk (bijna) nul hoogtemeters, echte klimmen blijven volledig zichtbaar. Hoogtemeters zijn altijd gelabeld als schatting."
      proposed_by: replit
      rationale: "De historische vertrouwensbreuk was tegenspraak tussen profiel en som (twee bronnen). Eén pijplijn + sectorstandaard-ruisonderdrukking (Strava/Garmin/Komoot-aanpak) is de enige houdbare belofte."
      rene_approved: false

    external_intelligence:
      research_required: true
      candidate_sources:
        - name: "GraphHopper elevation (SRTM/vergelijkbaar, per routepunt)"
          coverage: "Wereldwijd; hoogte per routecoördinaat. Dekt NIET: sub-meter-nauwkeurigheid, bruggen/tunnels correct (raster volgt maaiveld)."
          actuality: "Statisch raster (SRTM-generatie ±2000); verandert praktisch niet."
          license_status: "Onderdeel van het GH-abonnement; commercieel bruikbaar."
          limitations: ["1–2 m puntruis", "~30 m raster", "maaiveld ≠ wegdek bij kunstwerken"]
          applicability: "Enige bron voor routeprofiel + hm-som (via summarizeTrack)."
        - name: "AHN (Actueel Hoogtebestand Nederland, via PDOK)"
          coverage: "Alleen NL; hoogte tot ~0,5 m-raster, veel nauwkeuriger dan SRTM. Dekt NIET: buitenland."
          actuality: "AHN4/AHN5-cycli (meerjarig); open data."
          license_status: "CC0/open, commercieel bruikbaar."
          limitations: ["groot datavolume; eigen sampling-infra nodig", "alleen-NL maakt EU-belofte tweedelig"]
          applicability: "KANDIDAAT (niet in gebruik): nauwkeuriger NL-profiel — alleen invoeren als route-hm én profiel tegelijk overgaan (één-bron-les)."
      sources_in_use:
        - "GraphHopper elevation — enige bron, bewust (tegenspraak-preventie)"
      privacy_status: unknown
      missing_information:
        - "Kwantitatieve vergelijking SRTM vs AHN op NL-testroutes (hoe groot is de winst echt?) niet uitgevoerd."

    replit_definition:
      objective_quality_standard: "Profiel-som en getoonde hm identiek (zelfde reeks); vlakke referentieroutes (polder) ≤30 hm/50 km; bekende klimmen (Zuid-Limburg) binnen ±10% van gepubliceerde klimdata."
      recommended_default: "Huidige pijplijn behouden; AHN alleen als bewezen verbetering én volledige omschakeling."
      technical_limits:
        - "SRTM-nauwkeurigheid is het plafond; 'exacte' hoogtemeters zijn onwaarachtig om te beloven."
      assumptions:
        - "Renners vergelijken hm vooral met Strava/Garmin — consistentie met dat ecosysteem telt zwaarder dan absolute waarheid."
      unknowns:
        - "Gedrag op bruggen/viaducten (maaiveld-artefacten) niet systematisch gemeten."
      evidence_method:
        - "Referentieroutes-set (vlak, glooiend, klim) met verwachte hm-banden als geautomatiseerde toets."

    rene_calibration:
      questions:
        - "Is consistentie met Strava/Garmin-cijfers de norm (±10%), of wil je absolute nauwkeurigheid nastreven (AHN-traject, alleen NL)?"
        - "Moet een route-hm-verschil met een later gereden rit (baro-meting) actief uitgelegd worden in de app?"
      completed: false

    acceptance_contract:
      hard_reject_rules:
        - rule: "Profiel en hoogtemeters-som mogen nooit uit verschillende reeksen komen of elkaar tegenspreken."
          measurement_level: per_sessie
          aggregate_justification: ""
          counterexamples:
            - case: "Nieuwe consumer sommeert rauwe provider-ascend naast het gedrempelde profiel (48 km vlak: 400 vs 20 hm)."
              proof_stage: designed
              proof_method: "Redenering: summarizeTrack is de enige export voor route-hm; rauwe ascend prefereren is per memory-regel verboden. Latere test: assert dat route-API-response-hm gelijk is aan thresholdedGainM van dezelfde reeks."
              proof_result: not_yet_tested
        - rule: "Een vlakke route mag nooit honderden valse hoogtemeters tonen (ruissom)."
          measurement_level: per_sessie
          aggregate_justification: ""
          counterexamples:
            - case: "Vlakke 48 km polderlus toont >100 hm."
              proof_stage: designed
              proof_method: "Rekenvoorbeeld: 1–2 m puntruis over ~2000 punten geeft naïef honderden hm; smooth ±150 m + 3 m-drempel drukt dit naar ~0. Bestaat als unit-test op de smoothing-functies; end-to-end-referentieroute-toets volgt."
              proof_result: not_yet_tested
      tolerances:
        - "±10% t.o.v. gepubliceerde klimdata op referentieklimmen (voorstel, te kalibreren)."
      unknown_data_policy: "Ontbreekt hoogtedata voor (een deel van) de route, dan geen som en geen profiel voor dat deel — nooit interpoleren en als meting tonen."
      approved: false

    validation:
      automated_tests: ["unit-tests smoothing/drempel (bestaand)", "referentieroutes-toets (te bouwen)"]
      independent_checks: ["vergelijking met gepubliceerde klimdata (climb-explorer-bron)"]
      practice_test_required: true
      practice_testers: ["René"]
      result: not_tested
      expectation_gap:
        - "Open taak #427: klimprofiel kan stil verdwijnen na routewijziging — belofte-relevant."
    product_proof:
      score: null
      status: not_proven
      evidence_refs: []
    next_action:
      type: research_or_build_or_retest
      description: "Referentieroutes-toets bouwen (vlak/klim-banden) en kalibratievraag Strava-consistentie vs AHN beantwoorden."
      approved_for_execution: false

  - id: ROUTES_OPMERKINGEN_001
    module: Routes en navigatie
    subject: "Routeopmerkingen (waarschuwingen langs de route)"
    status: needs_calibration

    current_state:
      technical_status: implemented
      source_snapshot: 2026-07-30
      evidence_status: "20/20 unit-scenario's groen (poortclassificatie, verbod vs beperking, voetpad-filter); way-voor-way praktijkverificaties Zwolle/Hengelo vastgelegd."
      practice_status: "René's praktijktest ving tientallen valse meldingen (parallelle N-weg, voetpaden) — afstandsgrenzen daarna verstrakt (6 m toegang, 10 m wegdek); doorfietsbare poorten worden sinds 30-07 niet meer gemeld."
      known_limitations:
        - "OSM kan verouderd zijn; elke response draagt bronvermelding + 'controleer ter plekke'."
        - "Upstream-fout ⇒ null (eerlijk gat), route toont dan geen 'geen bijzonderheden'."
        - "Poort zonder doorgang-tags blijft 'onbekend' → milde melding; werkelijke doorgang onbekend."

    proposed_promise:
      text: "Elke waarschuwing op je route (veerpont, trap, poort, onverhard vak, slecht wegdek, beperkte toegang, natuurgebied) is gebaseerd op een aantoonbaar kaartgegeven dat je kunt inzien; er wordt nooit een waarschuwing verzonnen, en dingen die geen probleem zijn (doorfietsbare poortjes) worden niet gemeld."
      proposed_by: replit
      rationale: "Waarde zit in signaal zonder ruis: valse meldingen ondermijnden het vertrouwen meetbaar (praktijktest). Evidence-per-melding maakt elke claim controleerbaar."
      rene_approved: false

    external_intelligence:
      research_required: true
      candidate_sources:
        - name: "OpenStreetMap via Overpass API"
          coverage: "Tags voor barrières, verboden, wegdek, natuurgebieden in NL/EU; NIET: actuele/tijdelijke afsluitingen, werkelijke staat ter plekke."
          actuality: "Minutelijkse spiegel; taggingactualiteit wisselend per gebied."
