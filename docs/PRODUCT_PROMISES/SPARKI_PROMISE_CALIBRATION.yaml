              proof_result: rejected_as_expected
      tolerances:
        - "Matching ≤25 m; km-afronding 0,1; pct-afronding 0,1."
      unknown_data_policy: "Onbekend is een eigen, zichtbare categorie; >40% onbekend ⇒ 'onvoldoende gegevens' i.p.v. schijnzekerheid; BGT mag alleen onbekend invullen."
