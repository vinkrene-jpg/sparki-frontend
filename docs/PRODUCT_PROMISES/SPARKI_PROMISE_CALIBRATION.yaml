              proof_stage: executed
              proof_method: "GPX-replay-harnas: bewuste afwijking van 500 m geeft precies één episode en één kaart; na 'negeren' blijft het aantoonbaar stil zolang de afwijking niet wezenlijk groeit, en precies één rustige her-melding pas bij ≥2× én ≥+150 m groei. Detectie binnen 10 s na de eerste buiten-corridor-fix ook geassert."
              proof_result: passed
      tolerances:
