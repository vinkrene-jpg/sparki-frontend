          answer_rene: "(Besluit René 30-07-2026) Na 'beter melden' niet automatisch volledig normaal. Gebruik een bewaakte, trapsgewijze hervatting op basis van klachten, belasting en reactie. Geen universeel vast aantal dagen. BOUWOPGAVE: een criteriagestuurde opbouwfase ná de herstelcheck bestaat nog niet in de plan-engine."
