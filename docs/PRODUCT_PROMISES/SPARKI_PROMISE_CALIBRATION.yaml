  - id: TRAIN_UITVOERING_001
    module: "Training, coaching en analyse"
    subject: "Trainingen — uitvoering, koppeling aan echte ritten en feedback-aanpassingen"
    status: needs_calibration

    current_state:
      technical_status: implemented
      source_snapshot: 2026-07-30
