# ---------------------------------------------------------------------------
# Hoofdstuk F: Voeding, hydratatie en gewicht
# Opgesteld 2026-07-30 (alleen-lezen inventarisatie); gekalibreerd 2026-07-30
# met de bindende besluitenlijst van René (16 besluiten, F1–F6).
# Leidende principes uit die besluiten: één canonieke voedingsengine,
# gezondheid boven prestatie, onbekende leeftijd fail-closed, geen
# schijnprecisie, nooit twee verschillende racedagadviezen naast elkaar.
# Conform opdracht v2: measurement_level + counterexamples per regel;
# uitsluitend proof_stage "designed" + proof_result "not_yet_tested";
# gewenste nieuwe gedragingen expliciet als BOUWOPGAVE gemarkeerd.
# ---------------------------------------------------------------------------

chapter_f_voeding_hydratatie_en_gewicht:

  # -------------------------------------------------------------------------
  # F1 — Richtwaarden per training (fueling engine)
  # -------------------------------------------------------------------------
  - id: VOED_RICHTWAARDEN_001
    module: "Voeding, hydratatie en gewicht"
    subject: "Deterministische voedingsrichtwaarden per training — vóór, tijdens en na"
    status: needs_calibration

    current_state:
      technical_status: implemented
      source_snapshot: 2026-07-30
      evidence_status: "De kern is een deterministische engine (computeSessionFuelTargets in api-server lib/fueling.ts): koolhydraten per uur op basis van duur en intensiteit (kort <75 min: geen tijdens-doel; >150 min: 60–90 g/u; intensief (wedstrijd of TSS/uur ≥70): 45–60 g/u; anders 30–60 g/u), pre-training 1–2 g/kg, herstel 1–1,2 g/kg koolhydraten + 0,25–0,4 g/kg eiwit (gewichtsafhankelijk, afgerond op 5 g). TSB ≤ −20 voegt herstel-nadruk toe (volwaardige maaltijden, nooit tekort). Coach-instructies (max 3, keyword-gefilterd uit actieve coach-context) gaan altijd letterlijk voorop. De LLM krijgt de berekende richtwaarden als leidend blok en mag alleen verwoorden, nooit rekenen. Tests bestaan voor de engine en de seizoensdoel-doorwerking (test:afvaldoel-touchpoints), maar er is geen onafhankelijke proof-run tegen een vastgelegde belofte."
      practice_status: "In gebruik via de Voeding-sheet (sessie-richtwaarden, vier-fasen-plan: voorbereiding/tijdens/direct herstel/later herstel) en via /api/nutrition/session-targets in het dagadvies."
      known_limitations:
        - "Onbekende duur ⇒ eerlijk gat (null) in plaats van een aanname — correct, maar de gebruiker ziet niet altijd waaróm er geen getal staat."
        - "Voorkeuren (allergieën, producten, maag/darm) worden alleen meegenomen bij expliciete toestemming (consentAt); zonder toestemming zijn adviezen generieker zonder dat de gebruiker dat ziet."
        - "Productvoorbeelden (gel ~25 g, reep ~40 g, sportdrank 30–40 g) zijn hardcoded vuistwaarden, geen productdatabase."
        - "Geen cafeïnelogica aanwezig (bewust of niet — nooit vastgelegd)."
        - "Gezondheidsstatus (ziek/geblesseerd) onderdrukt de voedingsrichtwaarden niet; de koppeling loopt alleen indirect via het (wegvallende) trainingsplan."

    proposed_promise:
      text: "Voor elke training krijg je concrete, uitlegbare richtwaarden voor vóór, tijdens en na — berekend uit jouw echte training, gewicht en belasting, nooit door een taalmodel verzonnen. Wat Sparki niet weet (duur onbekend, gewicht ontbreekt) zie je als eerlijk gat, nooit als aanname. Instructies van jouw coach gaan altijd voor."
      proposed_by: replit
      rationale: "Voedingsadvies is veiligheidsgevoelig terrein; de bestaande honest-numbers-regel (deterministisch rekenen, LLM alleen verwoorden) is precies wat een belofte hier verdedigbaar maakt."
      rene_approved: false

    external_intelligence:
      research_required: true
      candidate_sources:
        - name: "Eigen fueling-engine + trainings-/belastingsdata (sessies, gepland werk, TSB)"
          coverage: "Dekt duur, intensiteit, race-context, gewicht, belastingstoestand. Dekt NIET: werkelijke individuele tolerantie (maag/darm-training) en werkelijke inname buiten de logs."
          actuality: "Live eigen code en data."
          license_status: "Eigen werk / eigen data van de atleet."
          limitations:
            - "Richtwaardenbanden zijn vuistregels op richtlijnniveau, geen individuele diëtetiek."
          applicability: "De richtwaarden zelf en de koppeling aan training/herstel."
        - name: "Sportvoedingsrichtlijnen voor duursport (o.a. ACSM/IOC position stands; Jeukendrup-koolhydraatinname-literatuur)"
          coverage: "Dekt gangbare inname-banden per uur naar duur/intensiteit en herstelverhoudingen. Dekt NIET: individuele medische situaties."
          actuality: "Position stands, herzien op meerjarencadans; stabiele kennis."
          license_status: "Vrij toepasbaar als onderbouwing; geen tekstovername."
          limitations:
            - "Banden verschillen licht per bron; de eigen keuze (bijv. 60–90 bij >150 min) moet als eigen keuze binnen het richtlijnbereik benoemd blijven."
          applicability: "Onderbouwt (of corrigeert) de gekozen banden en de afwezigheid/aanwezigheid van cafeïne-advies."
      sources_in_use:
        - "Eigen fueling-engine — leidend en enige rekenbron."
      privacy_status: unknown
      missing_information:
        - "Geen vastgelegde onderbouwing per band (welke bron hoort bij welke bandkeuze)."
        - "Geen besluit over cafeïne: bewust weggelaten of gat?"

    replit_definition:
      objective_quality_standard: "Alle getallen in elk voedingsadvies zijn herleidbaar tot de deterministische engine of tot een coach-instructie; 0 door het taalmodel gerekende of afgeronde getallen; ontbrekende invoer levert een zichtbaar gat met reden, nooit een stille aanname; trainingen worden nooit ondervoed geadviseerd, ongeacht enig doel."
      recommended_default: "Huidige engine handhaven als enige rekenbron; consent-gated voorkeuren blijven fail-closed; coach-instructies blijven letterlijk en voorop; bij ontbrekende duur/gewicht eerlijk gat tonen met de reden en één duidelijke actie om het gat te vullen. Conform besluiten René 30-07-2026 aangevuld met drie bouwopgaven: (1) opt-in cafeïnelaag voor volwassenen met de vastgelegde voorwaarden, (2) zichtbare 'houdt nog geen rekening met jouw voorkeuren'-melding + ernstige-allergie-blokkade zonder toestemming, (3) gezondheidsstatus-koppeling: acute blokkade onderdrukt prestatie-fueling."
      technical_limits:
        - "Zonder gewicht geen pre-/herstelrichtwaarden (gewichtsafhankelijk)."
        - "Zonder geplande training of race geen sessie-richtwaarden (eerlijke null met reden)."
      assumptions:
        - "De gekozen banden liggen binnen gangbare richtlijnen; dit is aannemelijk maar niet per band gedocumenteerd."
      unknowns:
        - "Of gebruikers de richtwaarden begrijpen en toepasbaar vinden (geen praktijkmeting)."
      evidence_method:
        - "Proof-run: voor een matrix van sessietypes (kort/lang, rustig/intensief, race, hitte, onbekende duur, ontbrekend gewicht) de engine-uitvoer vastleggen en tegen de belofte toetsen."
        - "Praktijktest: René legt bij drie echte trainingen vooraf vast wat hij verwacht en vergelijkt met de getoonde richtwaarden."

    rene_calibration:
      questions:
        - question: "Cafeïne-advies (gangbaar in wedstrijdsport, maar met bijwerkingen en jeugdgevoeligheid): wil je dat Sparki dit volwassenen actief aanbiedt, alleen op verzoek, of helemaal niet?"
          answer_rene: "Besluit 2026-07-30: alleen aanbieden aan volwassen sporters die dit zelf activeren of er expliciet om vragen. Voorwaarden: nooit standaard onderdeel van ieder voedingsadvies; niet bij jeugd of onbekende leeftijd; eerst waarschuwing voor slaap, onrust, angstgevoeligheid en individuele verdraagzaamheid; eerst tijdens training uitproberen, nooit voor het eerst op racedag; geen automatische dosering op basis van alleen lichaamsgewicht; geen aanbeveling van pillen, poeders of onbekende supplementen. Reden: cafeïne kan prestaties ondersteunen, maar hogere doses geven vaker bijwerkingen en supplementgebruik kent gezondheids- en antidopingrisico's (lijn IOC-consensus). BOUWOPGAVE: cafeïnelaag bestaat nu niet."
        - question: "Als je geen toestemming hebt gegeven voor voorkeuren (allergieën, maag/darm): moet Sparki dan zichtbaar zeggen 'dit advies houdt geen rekening met jouw voorkeuren' of stil generiek adviseren (huidig)?"
          answer_rene: "Besluit 2026-07-30: altijd zichtbaar melden: 'Dit algemene advies houdt nog geen rekening met jouw persoonlijke voedingsvoorkeuren, allergieën of intoleranties.' Sparki mag nooit suggereren dat hiermee rekening is gehouden wanneer toestemming of gegevens ontbreken. Bij bekende ernstige allergieën zonder verwerkingstoestemming: geen concreet product- of maaltijdadvies, wel een neutrale melding dat persoonlijk advies niet veilig kan worden samengesteld. BOUWOPGAVE: melding + ernstige-allergie-blokkade bestaan nu niet (huidig gedrag is stil generiek)."
        - question: "Moeten voedingsrichtwaarden reageren op je gezondheidsstatus (ziek/geblesseerd), bijvoorbeeld door tijdens ziekte geen prestatiegerichte fueling te tonen, of is de indirecte koppeling via het (wegvallende) plan genoeg?"
          answer_rene: "Besluit 2026-07-30: gezondheid staat ook binnen voeding boven prestatie. Bij een harde of acute gezondheidsblokkade: geen prestatiegerichte fuelingdoelen, wel neutrale ondersteuning rond voldoende eten, drinken en herstel, en nooit caloriebeperking of gewichtsdoelsturing. Bij een niet-acute blessure: voeding blijft herstel en passende energie-inname ondersteunen; alleen de voeding voor niet-uitgevoerde trainingsbelasting vervalt. Sluit aan op de B+C-lijn (acute blokkade = 0 prikkels vs. aangepaste belasting). BOUWOPGAVE: directe gezondheidsstatus-koppeling in de fueling-engine bestaat nu niet."
      completed: true

    acceptance_contract:
      hard_reject_rules:
        - rule: "Geen enkel getal (gram, milliliter, milligram, kcal) in een voedingsadvies mag door het taalmodel worden berekend of aangepast; elk getal komt uit de deterministische engine of letterlijk uit een coach-instructie."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "De engine geeft 45–60 g/u; de LLM-tekst noemt '70 gram per uur voor extra energie' — overtreding, ook als 70 op zichzelf een verdedigbaar getal zou zijn."
              proof_stage: designed
              proof_method: "Redenering: de prompt levert de berekende richtwaarden als leidend blok met de regel dat de LLM alleen verwoordt; de latere executed-stap is een test die LLM-uitvoer parseert op getallen en asserteert dat elk getal in de engine-uitvoer of een coach-instructie voorkomt."
              proof_result: not_yet_tested
        - rule: "Een training wordt nooit ondervoed geadviseerd: richtwaarden tijdens en rond een training mogen nooit verlaagd worden om welk doel dan ook (gewicht, calorie-budget, weektotaal)."
          rule_type: hard_blockage
          measurement_level: per_sessie
          aggregate_justification: ""
          counterexamples:
            - case: "Actief afvaldoel en een lange duurtraining: het tijdens-advies zakt naar 20 g/u 'vanwege je doel' — overtreding; het juiste gedrag is volledige fueling en sturing uitsluitend via gewone maaltijden op rustige momenten."
              proof_stage: designed
              proof_method: "Redenering: de seizoensdoel-leeslaag injecteert de harde regel 'training altijd volledig gevoed' en de engine kent geen tekort-parameter; executed na een her-run van de touchpoints-test uitgebreid met dit expliciete scenario."
              proof_result: not_yet_tested
        - rule: "Ontbrekende invoer (duur onbekend, gewicht ontbreekt) levert een zichtbaar gat met reden; er mag nooit een richtwaarde op een stille aanname verschijnen."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "Atleet zonder gewicht in het profiel ziet toch 'eet 90 gram koolhydraten na afloop' — overtreding: het herstel-getal is gewichtsafhankelijk en had een eerlijk gat met de actie 'vul je gewicht in' moeten zijn."
              proof_stage: designed
              proof_method: "Redenering: de engine geeft null bij ontbrekend gewicht/duur; executed na een test die met leeg gewicht/duur asserteert dat de betreffende velden null zijn en de UI het gat met reden toont."
              proof_result: not_yet_tested
      tolerances:
        - "De bandbreedtes zelf (30–60/45–60/60–90 g/u; 1–2 g/kg pre; 1–1,2 g/kg + 0,25–0,4 g/kg herstel) zijn kalibreerbare toleranties binnen richtlijnbereik, geen harde grenzen."
      unknown_data_policy: "Onbekende duur, ontbrekend gewicht of ontbrekende toestemming leiden tot een kleiner maar eerlijk advies met zichtbare reden; nooit aanvullen met aannames."
      approved: false

    validation:
      automated_tests:
        - "test:afvaldoel-touchpoints (canonieke zin + jeugd-afwezigheid op alle raakvlakken incl. session-targets) — bestaat, groen"
        - "Engine-gedrag deels gedekt via bestaande nutrition-/fueling-paden; geen dedicated engine-matrixtest"
      independent_checks: ["Matrix-proof-run over sessietypes — nog te ontwerpen en te draaien"]
      practice_test_required: true
      practice_testers: ["René (drie echte trainingen, verwachting vooraf vastgelegd)"]
      result: not_tested
      expectation_gap:
        - "Geen test die LLM-uitvoer op verzonnen getallen controleert; de honest-numbers-regel is prompt-afspraak, niet bewezen contract."
    product_proof:
      score: null
      status: not_proven
      evidence_refs: []
