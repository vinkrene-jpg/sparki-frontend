              proof_stage: designed
              proof_method: "Ontwerp-redenering uit taak #438 (net gemerged): één uitgelegd beeld met beide metingen. Uitgevoerde toetsing = voorgestelde praktijkbewijs-taak #439."
              proof_result: not_yet_tested
        - rule: "Verdeling met mislukte bronmeting mag nooit als volledige verdeling ogen ('alles bekend')."
          rule_type: hard_blockage
          measurement_level: per_sessie
          aggregate_justification: ""
          counterexamples:
            - case: "Overpass faalt; scherm zou 100% 'onbekend=0' tonen."
              proof_stage: designed
              proof_method: "Redenering: analysis=null bij upstream-fout (honesty contract in code); latere contract-test op de route-API."
              proof_result: not_yet_tested
        - rule: "Retroactief geregistreerd (vondst René 30-07-2026): de meting-loopt-nog-toestand (pending, trage kaartbron) en de melding 'geen bruikbare geometrie' sluiten elkaar uit — het wegdekscherm mag nooit twee tegenstrijdige toestandsboodschappen tegelijk tonen."
          rule_type: hard_blockage
