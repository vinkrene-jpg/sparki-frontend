  - id: START_SPORTPASPOORT_001
    module: "Start, profiel en doelen"
    subject: "Sportpaspoort — herkomst, actualiteit en voorstellen per profielwaarde"
    status: needs_calibration

    current_state:
      technical_status: implemented
      source_snapshot: 2026-07-30
      evidence_status: "Deels: de herkomstlaag (value-events met old/new, origin, bron, confidence), de 180-dagen-versheidsgrens en het race-safe voorstelbesluit (alleen open → besloten, waarde+event in één transactie) zijn geïmplementeerd en er bestaan tests rond FTP-floor en profielconsistentie. Geen onafhankelijke proof-run tegen een vastgelegde belofte; geen praktijkbewijs dat een gebruiker de herkomst ook begrijpt."
      practice_status: "In gebruik bij René/Dylan; herkomst-chips en voorstellen zichtbaar, maar nooit systematisch tegen verwachtingen getoetst."
      known_limitations:
        - "Confidence zit in de API maar wordt in de UI niet getoond; de gebruiker ziet wel Gemeten/Handmatig/Berekend/Geschat, niet hoe zeker."
        - "Niet elk correctiepad is gelijk: profielconsistentie-correcties schrijven FTP-historie via compare-and-set maar géén paspoort-value-event; de paspoort-historie kan die correctie dus missen."
        - "Een bestaande waarde zonder passend event valt eerlijk terug op 'herkomst onbekend' — correct, maar legacy-waarden blijven zo permanent herkomstloos."
        - "Versheid is een vaste 180-dagen-grens voor alle velden; gewicht veroudert in werkelijkheid sneller dan lengte."

    proposed_promise:
      text: "Bij elke waarde in je Sportpaspoort zie je waar hij vandaan komt (gemeten, door jou gezet, berekend of geschat), van wanneer hij is, en of hij verouderd raakt. Sparki past nooit stilletjes een waarde aan: het doet hooguit een voorstel met de reden erbij, en jij beslist. Wat jij zelf zet, wint altijd."
      proposed_by: replit
      rationale: "Vertrouwen in álle andere modules (zones, plan, analyse) hangt aan de vraag of de profielwaarden kloppen en of de gebruiker kan zien waaróm ze zijn wat ze zijn. Herkomst-per-waarde is bovendien een aantoonbaar onderscheid t.o.v. de meeste marktspelers."
      rene_approved: false

    external_intelligence:
      research_required: true
      candidate_sources:
        - name: "Eigen value-event-administratie (passport events + athlete_profiles)"
          coverage: "Dekt alle gevolgde paspoortvelden met herkomst, actor en tijdstip. Dekt NIET: waarden die vóór de invoering van de eventlaag zijn gezet (herkomst onbekend) en correctiepaden die de eventlaag omzeilen."
          actuality: "Live eigen database; events sinds invoering van de herkomstlaag."
          license_status: "Eigen data van de atleet; export privacy-gated (gezondheid/locatie/notities standaard uit)."
          limitations:
            - "Herkomst is zo compleet als de schrijfpaden; het profielconsistentie-pad schrijft nu geen paspoort-event."
          applicability: "De herkomst-, actualiteits- en historieweergave zelf; ook de bron voor de kwaliteitssamenvatting (missing/estimated/stale/unknownOrigin)."
        - name: "Trainingsleer-vuistregels voor veldversheid (FTP-hertest-interval, gewichtsdynamiek) uit gangbare literatuur (o.a. Coggan/Allen 'Training and Racing with a Power Meter')"
          coverage: "Dekt hoe vaak FTP/gewicht realistisch opnieuw bevestigd horen te worden. Dekt NIET: individuele variatie; het blijven vuistregels op richtlijnniveau."
          actuality: "Boekpublicaties (3e druk 2019); stabiele kennis, wijzigt traag."
          license_status: "Kennis vrij toepasbaar; geen tekstovername nodig."
          limitations:
            - "Geen harde consensus over één juist interval; 180 dagen is een eigen keuze binnen een redelijk bereik."
          applicability: "Onderbouwt (of corrigeert) de per-veld-versheidsgrens in plaats van één vaste 180-dagen-grens voor alles."
      sources_in_use:
        - "Eigen value-event-administratie — de enige plek waar herkomst nu wordt vastgelegd en getoond."
      privacy_status: unknown
      missing_information:
        - "Geen per-veld-onderbouwde versheidsgrenzen (nu één vaste 180-dagengrens)."
        - "Geen meting of gebruikers de herkomst-chips begrijpen (begrips-praktijktest ontbreekt)."

    replit_definition:
      objective_quality_standard: "Elke gevolgde waarde toont herkomst óf eerlijk 'herkomst onbekend'; elke wijziging produceert precies één event met old/new+actor; 0 automatische waarde-wijzigingen zonder geaccepteerd voorstel; voorstel-besluiten zijn race-safe (dubbel klikken kan nooit twee keer toepassen)."
      recommended_default: "Voorstellen alleen bij aantoonbaar bewijs (zoals FTP-floor uit echte sessies >5% boven de gezette waarde); geaccepteerde afgeleide waarden blijven als 'geschat/berekend' gemarkeerd tot een echte meting of handmatige bevestiging volgt."
      technical_limits:
        - "Herkomst met terugwerkende kracht voor legacy-waarden is niet reconstrueerbaar."
        - "De eventlaag beschermt alleen paden die haar gebruiken; afwijkende schrijfpaden (profielconsistentie) vallen erbuiten tot ze worden aangesloten."
      assumptions:
        - "Versheid verschilt per waardesoort (besluit René 30-07-2026: geen algemene grens). De huidige uniforme 180-dagen-grens is bestaand gedrag; vervanging door veldspecifieke versheidsgrenzen is een BOUWOPGAVE, net als het zichtbaar maken van zekerheid (hoog/redelijk/laag) in de gebruikersinterface (confidence zit al in de API, niet in de UI)."
      unknowns:
        - "Hoeveel paspoortwaarden in de praktijk 'herkomst onbekend' zijn (geen telling vastgelegd)."
      evidence_method:
        - "Onafhankelijke proof-run: waarde wijzigen via elk bestaand schrijfpad en verifiëren dat er precies één passend event ontstaat (dekt ook het profielconsistentie-gat)."
        - "Praktijktest: René benoemt van drie waarden blind waar ze vandaan komen; verwachting vooraf vastgelegd."

    rene_calibration:
      questions:
        - question: "Wil je per waarde ook zien hoe ZEKER Sparki is (bijv. 'vrij zeker' / 'onzeker'), of is alleen de herkomst (gemeten/handmatig/berekend/geschat) genoeg?"
          answer_rene: "Ja: naast herkomst ook zekerheid tonen, eenvoudig als hoog / redelijk / laag. (Besluit René 30-07-2026)"
        - question: "Moet 'verouderd' per veld verschillen (gewicht bijv. na 60 dagen, lengte vrijwel nooit, FTP na ~120 dagen), of is één vaste grens van 180 dagen voor alles duidelijker?"
          answer_rene: "Versheid per soort waarde; geen algemene grens van 180 dagen. (Besluit René 30-07-2026)"
        - question: "Als Sparki sterk bewijs heeft dat een waarde niet klopt (bijv. gereden vermogen bewijst een hogere FTP): mag het dan blijven herinneren tot je beslist, of één keer voorstellen en daarna zwijgen?"
          answer_rene: "Beperkt blijven herinneren totdat de gebruiker beslist — niet bij ieder bezoek; veiligheidsrelevante afwijkingen mogen nooit definitief verdwijnen. (Besluit René 30-07-2026)"
      completed: true

    acceptance_contract:
      hard_reject_rules:
        - rule: "Sparki mag nooit automatisch een profielwaarde wijzigen zonder geaccepteerd voorstel; een gevonden afwijking wordt altijd eerst een voorstel met reden en bewijs."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "FTP-floor uit echte sessies ligt 8% boven de handmatig gezette FTP; een nachtelijke job die de FTP direct ophoogt zonder open voorstel is een overtreding — ook al is de nieuwe waarde 'beter'."
              proof_stage: designed
              proof_method: "Redenering: recalibrateEstimatedFtp wijzigt handmatig/gemeten FTP nooit automatisch en maakt bij floor > FTP×1,05 een berekend voorstel met bewijsbron; de latere executed-stap is een test die de nachtelijke herberekening draait en asserteert dat de profielwaarde ongewijzigd blijft terwijl er een open voorstel ontstaat."
              proof_result: not_yet_tested
        - rule: "Een voorstel mag maar één keer effect hebben: dubbel accepteren, gelijktijdig accepteren+afwijzen of accepteren van een al besloten voorstel mag nooit een tweede wijziging of event opleveren."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "Twee gelijktijdige accepteer-verzoeken op hetzelfde open voorstel; twee value-events of een dubbele waarde-toepassing is een overtreding."
              proof_stage: designed
              proof_method: "Redenering: het besluitpad muteert alleen rijen met status open en past waarde+event in één transactie toe; de latere executed-stap is een concurrency-test met twee parallelle accepts (verwacht: één event, tweede verzoek eerlijk 'al besloten')."
              proof_result: not_yet_tested
        - rule: "Een getoonde waarde zonder herleidbare herkomst moet 'herkomst onbekend' tonen; er mag nooit een herkomst worden verzonnen of stilzwijgend 'handmatig' worden aangenomen."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "Legacy-gewichtswaarde zonder event toont de chip 'Handmatig' — dat is een verzonnen herkomst en dus een overtreding, ook als de waarde zelf klopt."
              proof_stage: designed
              proof_method: "Redenering: composePassport valt bij een waarde zonder passend event expliciet terug op herkomst onbekend; latere executed-stap: test met geseede waarde zonder event asserteert de 'Herkomst onbekend'-chip."
              proof_result: not_yet_tested
      tolerances:
        - "De versheidsgrens (nu 180 dagen voor alle velden) is een kalibreerbare tolerantie, geen harde grens."
      unknown_data_policy: "Ontbrekende waarde = eerlijk 'ontbreekt'; onbekende herkomst = 'herkomst onbekend'; nooit een chip of datum verzinnen. Geaccepteerde afgeleide waarden blijven gemarkeerd als geschat tot echte bevestiging."
      approved: false

    validation:
      automated_tests:
        - "FTP-floor-afleiding en herkalibratie-voorstel — tests bestaan (derived-load/backfill), groen"
        - "Profielconsistentie-checks (notice→ask→confirm→correct, re-verify vóór correctie) — tests bestaan, groen"
      independent_checks: ["Proof-run 'elk schrijfpad → precies één event' — nog te doen; dekt het bekende profielconsistentie-event-gat"]
      practice_test_required: true
      practice_testers: ["René (herkomst-begripstest met drie blinde waarden)"]
      result: not_tested
      expectation_gap:
        - "Bekend gat: profielconsistentie-correcties schrijven geen paspoort-event; de paspoort-historie is dus niet gegarandeerd volledig — dat botst met de belofte zolang het niet is aangesloten."
    product_proof:
      score: null
      status: not_proven
      evidence_refs: []
    next_action:
      type: research_or_build_or_retest
      description: "Bouwen en testen: veldspecifieke versheidsgrenzen (i.p.v. de uniforme 180 dagen) en de zekerheidsweergave hoog/redelijk/laag in de UI; daarnaast profielconsistentie-pad op de eventlaag aansluiten en de proof-run per schrijfpad draaien."
      approved_for_execution: false

  - id: START_VANDAAG_001
    module: "Start, profiel en doelen"
    subject: "Vandaag — één leidend moment, eerlijk gevoed, proactief zonder te schreeuwen"
    status: needs_calibration

    current_state:
      technical_status: implemented
      source_snapshot: 2026-07-30
      evidence_status: "Sterk op contractniveau: day-type-precedentie (gezondheid → race → rust → coach → herstel → training → algemeen), de aandachtswet (één leidend Momentblok, één nudge per bezoek, weer/leskaart-gates, wederzijdse uitsluiting) en dagadvies-contracten zijn elk afzonderlijk getest en groen. Ontbreekt: één geïntegreerde test die alle bronnen en de echte rendering tegelijk vastzet, en praktijkbewijs dat het gekozen moment ook het JUISTE moment was."
      practice_status: "Dagelijks in gebruik; geen gestructureerde toets 'toonde Vandaag vandaag het juiste?' tegen vooraf vastgelegde verwachtingen."
      known_limitations:
        - "Bij actieve commercial_shell-flag is de commerciële schil de feitelijke surface; de contract-tests dekken vooral de pure logica, niet de volledige geïntegreerde rendering."
        - "Emergency- en race-daytypes zijn deels slapend tot echte gezondheids-/racebronnen bestaan."
        - "Weer komt indirect via de eigen API; de frontend toont geen upstream-foutdetail (eerlijk 'niet beschikbaar', maar zonder waarom)."
        - "Open-Meteo free tier is non-commercial-only — bij commerciële start is dit een licentierisico (reeds geregistreerd als provider-compliance-punt)."

    proposed_promise:
      text: "Vandaag opent met één ding: wat er nú voor jou toe doet — je gezondheid gaat altijd voor, dan je wedstrijd, dan je training of rust. Alles wat Sparki toont komt uit jouw echte gegevens; wat het niet weet, zegt het eerlijk. Sparki dringt niet: hooguit één duwtje per bezoek, en wat je negeert komt een paar dagen niet terug."
      proposed_by: replit
      rationale: "Vandaag is het gezicht van Sparki en de plek waar de aandachtswet en de eerlijkheidsdoctrine samenkomen. De wereldmarkt-lat (Whoop's dagopening, Garmin's morning report) is één helder leidend moment in plaats van een dashboard vol kaarten."
      rene_approved: false

    external_intelligence:
      research_required: true
      candidate_sources:
        - name: "Eigen state-/beslislagen (day-type-engine, aandachtswet, state engine, coach decision)"
          coverage: "Dekt de volledige keuze wat Vandaag leidt en wat mag meerijden. Dekt NIET: of die keuze subjectief de juiste was (dat is praktijktest-terrein)."
          actuality: "Live eigen code met contract-tests; wijzigt mee met het product."
          license_status: "Eigen werk."
          limitations:
            - "Precedentie is deterministisch maar hard-coded; er is geen leerlus die aan René's werkelijke voorkeur kalibreert."
          applicability: "De leidende-moment-keuze zelf en het bewijs dat gezondheid nooit wordt weggedrukt."
        - name: "Open-Meteo (weer voor de thuislocatie)"
          coverage: "Dekt uur/dag-weer wereldwijd voor de opgeslagen thuislocatie. Dekt NIET: locaties buiten de forecast-horizon en hypergelokaliseerde omstandigheden."
          actuality: "Live API, modellen meermaals per dag ververst."
          license_status: "Free tier uitsluitend niet-commercieel; commercieel gebruik vereist betaald abonnement — reeds geregistreerd risico vóór commerciële start."
          limitations:
            - "Forecast-onzekerheid; Sparki toont daarom alleen echt beschikbare forecasts en verzint niets."
          applicability: "Het weer-meerijden bij voor-training/racedag; nergens anders."
      sources_in_use:
        - "Eigen state-/beslislagen — leidend."
        - "Open-Meteo — alleen het weer-meerijden, met de bekende licentiekanttekening."
      privacy_status: unknown
      missing_information:
        - "Geen geïntegreerde end-to-end-test die de echte DayHome/commerciële shell met alle bronnen tegelijk vastzet."
        - "Geen meting of het leidende moment overeenkomt met wat de gebruiker zelf als belangrijkste ervaart (verwachting-gap-instrument ontbreekt)."

    replit_definition:
      objective_quality_standard: "Bij elke render precies één leidend Momentblok volgens de vaste prioriteit; gezondheid wint altijd; maximaal één nudge per bezoek; 0 verzonnen of placeholder-gegevens als eindstaat; genegeerde niet-kritieke meerijders pauzeren na 3 getoonde dagen."
      recommended_default: "Volgorde conform besluit René 30-07-2026: gezondheid → racedag → na-rit → geplande rit/training → voorbereiding → herstel → balans; een voorstel komt alléén boven een geplande training wanneer er een aantoonbare reden is om die training aan te passen (BOUWOPGAVE: de huidige code zet een voorstel nog onvoorwaardelijk boven de geplande training — deze conditionele voorstelprioriteit is nieuw gewenst gedrag). Weer alleen bij voorbereiding/racedag; kritieke zaken (defect vastgesteld, gezondheid) roteren nooit weg."
      technical_limits:
        - "Slapende daytypes (emergency/race-varianten) activeren pas bij echte bronnen."
        - "Geen upstream-foutdetail bij weer (bewuste eenvoud)."
      assumptions:
        - "De vaste prioriteitsvolgorde weerspiegelt René's productvisie; dit is nog nooit expliciet als kalibratievraag bevestigd."
      unknowns:
        - "Of één nudge per bezoek in de praktijk als te stil of precies goed voelt."
      evidence_method:
        - "Bestaande day-type/aandachtswet/dagadvies-tests her-runnen als proof-artefact."
        - "Nieuw: één geïntegreerde renderingstest (echte surface, alle bronnen gemockt op contractniveau)."
        - "Praktijktest: een week lang dagelijks vastleggen wat Vandaag als leidend koos vs. wat René/Dylan verwachtte (verwachting-gap-logboek)."

    rene_calibration:
      questions:
        - question: "De vaste volgorde is nu: gezondheid → racedag → na-rit → rit → voorstel → voor-training → herstel → balans. Klopt die volgorde met jouw gevoel, of moet iets hoger/lager?"
          answer_rene: "Volgorde bruikbaar: gezondheid → racedag → na-rit → geplande rit/training → voorbereiding → herstel → balans. Aanvulling: een voorstel komt alleen boven een geplande training wanneer er een aantoonbare reden is om die training aan te passen. (Besluit René 30-07-2026)"
        - question: "Wat je negeert pauzeert nu na 3 getoonde dagen een paar dagen. Te snel, te traag, of precies goed — en mag een genegeerd niet-kritiek punt ooit definitief verdwijnen?"
          answer_rene: "Drie getoonde dagen en daarna tijdelijk pauzeren is goed. Een niet-kritiek punt mag na expliciet wegdrukken verdwijnen — nooit stilletjes. (Besluit René 30-07-2026)"
        - question: "Hoeveel mag er naast het leidende moment meerijden: alleen weer bij training/race (huidig), of ook bijvoorbeeld een leskaart of sociaal signaal op rustige dagen?"
          answer_rene: "Alleen direct relevante context (weer, materiaal- of routewaarschuwing); geen standaard leskaart of sociaal signaal dat de focus vertroebelt. (Besluit René 30-07-2026)"
      completed: true

    acceptance_contract:
      hard_reject_rules:
        - rule: "Een actief gezondheidsissue (ziek/geblesseerd) mag nooit door iets anders van de leidende plek worden gedrukt."
          rule_type: hard_blockage
          measurement_level: per_dag
          aggregate_justification: ""
          counterexamples:
            - case: "Atleet is ziek gemeld én heeft morgen een wedstrijd; als de racedag-kaart leidt in plaats van het gezondheidsblok is dat een overtreding — óók op de dag vóór de belangrijkste wedstrijd van het seizoen."
              proof_stage: designed
              proof_method: "Redenering: zowel de day-type-detectie (health eerst) als de aandachtswet (health als hoogste runge) zetten gezondheid boven race; beide zijn afzonderlijk getest. Voor dit contract telt pas een her-run met dit exacte dubbelscenario in de geïntegreerde surface."
              proof_result: not_yet_tested
        - rule: "Vandaag mag nooit meer dan één nudge per bezoek tonen, en nooit een placeholder-/laadtekst als eindstaat presenteren."
          rule_type: hard_blockage
          measurement_level: per_sessie
          aggregate_justification: ""
          counterexamples:
            - case: "Connector-nudge én materiaal-nudge tegelijk zichtbaar in één bezoek; of een weerblok dat permanent 'wordt geladen…' toont omdat de thuislocatie ontbreekt in plaats van eerlijk te verdwijnen."
              proof_stage: designed
              proof_method: "Redenering: de nudge-selectie kiest exact één volgens vaste rangorde (getest incl. volgorde-onafhankelijkheid), en het weerblok rendert alleen bij een echt beschikbare forecast. Latere executed-stap: geïntegreerde renderingstest + Poort 5b-doorloop van Vandaag."
              proof_result: not_yet_tested
        - rule: "Vandaag mag nooit gegevens tonen die niet uit echte bronnen komen; ontbrekende data is zichtbaar afwezig of eerlijk 'niet beschikbaar', nooit verzonnen."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "Geen thuislocatie ingesteld, maar er verschijnt toch een weersverwachting; of een rit-verhaal verschijnt zonder dat er een echte verse import/analyse is."
              proof_stage: designed
              proof_method: "Redenering: weer levert available:false zonder thuislocatie/horizon en het rit-moment rendert alleen bij echte verse status; beide contracten bestaan als test. Executed pas na her-run als proof-artefact tegen dit contract."
              proof_result: not_yet_tested
