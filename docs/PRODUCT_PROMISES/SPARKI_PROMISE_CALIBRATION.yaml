  - id: START_SPORTPASPOORT_001
    module: "Start, profiel en doelen"
    subject: "Sportpaspoort — herkomst, actualiteit en voorstellen per profielwaarde"
    status: needs_calibration

    current_state:
      technical_status: implemented
      source_snapshot: 2026-07-30
      evidence_status: "Deels: de herkomstlaag (value-events met old/new, origin, bron, confidence), de 180-dagen-versheidsgrens en het race-safe voorstelbesluit (alleen open → besloten, waarde+event in één transactie) zijn geïmplementeerd en er bestaan tests rond FTP-floor en profielconsistentie. Geen onafhankelijke proof-run tegen een vastgelegde belofte; geen praktijkbewijs dat een gebruiker de herkomst ook begrijpt."
      practice_status: "In gebruik bij René/Dylan; herkomst-chips en voorstellen zichtbaar, maar nooit systematisch tegen verwachtingen getoetst."
      known_limitations:
        - "Confidence zit in de API maar wordt in de UI niet getoond; de gebruiker ziet wel Gemeten/Handmatig/Berekend/Geschat, niet hoe zeker."
        - "Niet elk correctiepad is gelijk: profielconsistentie-correcties schrijven FTP-historie via compare-and-set maar géén paspoort-value-event; de paspoort-historie kan die correctie dus missen."
        - "Een bestaande waarde zonder passend event valt eerlijk terug op 'herkomst onbekend' — correct, maar legacy-waarden blijven zo permanent herkomstloos."
        - "Versheid is een vaste 180-dagen-grens voor alle velden; gewicht veroudert in werkelijkheid sneller dan lengte."

    proposed_promise:
      text: "Bij elke waarde in je Sportpaspoort zie je waar hij vandaan komt (gemeten, door jou gezet, berekend of geschat), van wanneer hij is, en of hij verouderd raakt. Sparki past nooit stilletjes een waarde aan: het doet hooguit een voorstel met de reden erbij, en jij beslist. Wat jij zelf zet, wint altijd."
      proposed_by: replit
      rationale: "Vertrouwen in álle andere modules (zones, plan, analyse) hangt aan de vraag of de profielwaarden kloppen en of de gebruiker kan zien waaróm ze zijn wat ze zijn. Herkomst-per-waarde is bovendien een aantoonbaar onderscheid t.o.v. de meeste marktspelers."
      rene_approved: false

    external_intelligence:
      research_required: true
      candidate_sources:
        - name: "Eigen value-event-administratie (passport events + athlete_profiles)"
          coverage: "Dekt alle gevolgde paspoortvelden met herkomst, actor en tijdstip. Dekt NIET: waarden die vóór de invoering van de eventlaag zijn gezet (herkomst onbekend) en correctiepaden die de eventlaag omzeilen."
          actuality: "Live eigen database; events sinds invoering van de herkomstlaag."
          license_status: "Eigen data van de atleet; export privacy-gated (gezondheid/locatie/notities standaard uit)."
          limitations:
            - "Herkomst is zo compleet als de schrijfpaden; het profielconsistentie-pad schrijft nu geen paspoort-event."
          applicability: "De herkomst-, actualiteits- en historieweergave zelf; ook de bron voor de kwaliteitssamenvatting (missing/estimated/stale/unknownOrigin)."
        - name: "Trainingsleer-vuistregels voor veldversheid (FTP-hertest-interval, gewichtsdynamiek) uit gangbare literatuur (o.a. Coggan/Allen 'Training and Racing with a Power Meter')"
          coverage: "Dekt hoe vaak FTP/gewicht realistisch opnieuw bevestigd horen te worden. Dekt NIET: individuele variatie; het blijven vuistregels op richtlijnniveau."
          actuality: "Boekpublicaties (3e druk 2019); stabiele kennis, wijzigt traag."
          license_status: "Kennis vrij toepasbaar; geen tekstovername nodig."
          limitations:
            - "Geen harde consensus over één juist interval; 180 dagen is een eigen keuze binnen een redelijk bereik."
          applicability: "Onderbouwt (of corrigeert) de per-veld-versheidsgrens in plaats van één vaste 180-dagen-grens voor alles."
      sources_in_use:
        - "Eigen value-event-administratie — de enige plek waar herkomst nu wordt vastgelegd en getoond."
      privacy_status: unknown
      missing_information:
        - "Geen per-veld-onderbouwde versheidsgrenzen (nu één vaste 180-dagengrens)."
        - "Geen meting of gebruikers de herkomst-chips begrijpen (begrips-praktijktest ontbreekt)."

    replit_definition:
      objective_quality_standard: "Elke gevolgde waarde toont herkomst óf eerlijk 'herkomst onbekend'; elke wijziging produceert precies één event met old/new+actor; 0 automatische waarde-wijzigingen zonder geaccepteerd voorstel; voorstel-besluiten zijn race-safe (dubbel klikken kan nooit twee keer toepassen)."
      recommended_default: "Voorstellen alleen bij aantoonbaar bewijs (zoals FTP-floor uit echte sessies >5% boven de gezette waarde); geaccepteerde afgeleide waarden blijven als 'geschat/berekend' gemarkeerd tot een echte meting of handmatige bevestiging volgt."
      technical_limits:
        - "Herkomst met terugwerkende kracht voor legacy-waarden is niet reconstrueerbaar."
        - "De eventlaag beschermt alleen paden die haar gebruiken; afwijkende schrijfpaden (profielconsistentie) vallen erbuiten tot ze worden aangesloten."
      assumptions:
        - "180 dagen is een acceptabele eerste versheidsgrens voor alle velden totdat per-veld-grenzen zijn gekalibreerd."
      unknowns:
        - "Hoeveel paspoortwaarden in de praktijk 'herkomst onbekend' zijn (geen telling vastgelegd)."
      evidence_method:
        - "Onafhankelijke proof-run: waarde wijzigen via elk bestaand schrijfpad en verifiëren dat er precies één passend event ontstaat (dekt ook het profielconsistentie-gat)."
        - "Praktijktest: René benoemt van drie waarden blind waar ze vandaan komen; verwachting vooraf vastgelegd."

    rene_calibration:
      questions:
        - question: "Wil je per waarde ook zien hoe ZEKER Sparki is (bijv. 'vrij zeker' / 'onzeker'), of is alleen de herkomst (gemeten/handmatig/berekend/geschat) genoeg?"
          answer_rene: "Ja: naast herkomst ook zekerheid tonen, eenvoudig als hoog / redelijk / laag. (Besluit René 30-07-2026)"
        - question: "Moet 'verouderd' per veld verschillen (gewicht bijv. na 60 dagen, lengte vrijwel nooit, FTP na ~120 dagen), of is één vaste grens van 180 dagen voor alles duidelijker?"
          answer_rene: "Versheid per soort waarde; geen algemene grens van 180 dagen. (Besluit René 30-07-2026)"
        - question: "Als Sparki sterk bewijs heeft dat een waarde niet klopt (bijv. gereden vermogen bewijst een hogere FTP): mag het dan blijven herinneren tot je beslist, of één keer voorstellen en daarna zwijgen?"
          answer_rene: "Beperkt blijven herinneren totdat de gebruiker beslist — niet bij ieder bezoek; veiligheidsrelevante afwijkingen mogen nooit definitief verdwijnen. (Besluit René 30-07-2026)"
      completed: true

    acceptance_contract:
      hard_reject_rules:
        - rule: "Sparki mag nooit automatisch een profielwaarde wijzigen zonder geaccepteerd voorstel; een gevonden afwijking wordt altijd eerst een voorstel met reden en bewijs."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "FTP-floor uit echte sessies ligt 8% boven de handmatig gezette FTP; een nachtelijke job die de FTP direct ophoogt zonder open voorstel is een overtreding — ook al is de nieuwe waarde 'beter'."
              proof_stage: designed
              proof_method: "Redenering: recalibrateEstimatedFtp wijzigt handmatig/gemeten FTP nooit automatisch en maakt bij floor > FTP×1,05 een berekend voorstel met bewijsbron; de latere executed-stap is een test die de nachtelijke herberekening draait en asserteert dat de profielwaarde ongewijzigd blijft terwijl er een open voorstel ontstaat."
              proof_result: not_yet_tested
        - rule: "Een voorstel mag maar één keer effect hebben: dubbel accepteren, gelijktijdig accepteren+afwijzen of accepteren van een al besloten voorstel mag nooit een tweede wijziging of event opleveren."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "Twee gelijktijdige accepteer-verzoeken op hetzelfde open voorstel; twee value-events of een dubbele waarde-toepassing is een overtreding."
              proof_stage: designed
              proof_method: "Redenering: het besluitpad muteert alleen rijen met status open en past waarde+event in één transactie toe; de latere executed-stap is een concurrency-test met twee parallelle accepts (verwacht: één event, tweede verzoek eerlijk 'al besloten')."
              proof_result: not_yet_tested
        - rule: "Een getoonde waarde zonder herleidbare herkomst moet 'herkomst onbekend' tonen; er mag nooit een herkomst worden verzonnen of stilzwijgend 'handmatig' worden aangenomen."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "Legacy-gewichtswaarde zonder event toont de chip 'Handmatig' — dat is een verzonnen herkomst en dus een overtreding, ook als de waarde zelf klopt."
              proof_stage: designed
              proof_method: "Redenering: composePassport valt bij een waarde zonder passend event expliciet terug op herkomst onbekend; latere executed-stap: test met geseede waarde zonder event asserteert de 'Herkomst onbekend'-chip."
              proof_result: not_yet_tested
      tolerances:
        - "De versheidsgrens (nu 180 dagen voor alle velden) is een kalibreerbare tolerantie, geen harde grens."
      unknown_data_policy: "Ontbrekende waarde = eerlijk 'ontbreekt'; onbekende herkomst = 'herkomst onbekend'; nooit een chip of datum verzinnen. Geaccepteerde afgeleide waarden blijven gemarkeerd als geschat tot echte bevestiging."
      approved: false

    validation:
      automated_tests:
        - "FTP-floor-afleiding en herkalibratie-voorstel — tests bestaan (derived-load/backfill), groen"
        - "Profielconsistentie-checks (notice→ask→confirm→correct, re-verify vóór correctie) — tests bestaan, groen"
      independent_checks: ["Proof-run 'elk schrijfpad → precies één event' — nog te doen; dekt het bekende profielconsistentie-event-gat"]
      practice_test_required: true
      practice_testers: ["René (herkomst-begripstest met drie blinde waarden)"]
      result: not_tested
      expectation_gap:
        - "Bekend gat: profielconsistentie-correcties schrijven geen paspoort-event; de paspoort-historie is dus niet gegarandeerd volledig — dat botst met de belofte zolang het niet is aangesloten."
    product_proof:
      score: null
      status: not_proven
      evidence_refs: []
    next_action:
      type: research_or_build_or_retest
      description: "Kalibratievragen beantwoorden; profielconsistentie-pad op de eventlaag aansluiten (bouwvoorstel, na akkoord); daarna proof-run per schrijfpad."
