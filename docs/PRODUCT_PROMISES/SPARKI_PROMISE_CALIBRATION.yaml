  - id: DATA_BESTANDIMPORT_001
    module: "Data, koppelingen en synchronisatie"
    subject: "Bestandimport (GPX/FIT/TCX/CSV) als volwaardige bron in de Data Hub"
    status: needs_calibration

    current_state:
      technical_status: implemented
      source_snapshot: 2026-07-30
      evidence_status: "Deels: geautomatiseerde tests dekken FIT/TCX/GPX-parsing incl. hoogte- en sensordata (test:ingest-elevation-fit-tcx e.a., groen), idempotente herimport (inhouds-hash als extern id) en de statussemantiek (gekoppeld/geparsed/geüpload). CSV heeft GEEN parser: een CSV-upload wordt eerlijk als 'geüpload' bewaard zonder metrics (open taak 'Parse TCX and CSV activity files for real metrics' dekt de CSV-kant)."
      practice_status: "GPX-import wordt in de praktijk gebruikt (o.a. routes en oude ritten van René); FIT/TCX vooral synthetisch getest, weinig praktijkvolume."
      known_limitations:
        - "CSV wordt niet geparsed — bewaard maar zonder rit-metrics; de UI moet dat eerlijk blijven zeggen."
        - "Een GPX zonder echte starttijd is een ROUTE, geen activiteit: er wordt nooit een datum verzonnen; status blijft 'geparsed' zonder sessie."
        - "Extern id is een hash van de inhoud (bestandsnaam bewust uitgesloten): hernoemd identiek bestand = dezelfde activiteit; maar een door een tool minimaal herschreven export (andere bytes, zelfde rit) telt als nieuwe upload en leunt dan op de gewone hub-dedupe."
        - "Velden die het bestand niet bevat blijven null; FIT-bestanden van exotische apparaten kunnen velden anders coderen dan de spec-hoofdlijn."
        - "Ontkoppelen van een import herstelt de eerlijke pre-koppelstatus; bij een nieuwe parser moet de parseerbaar-lijst mee, anders degradeert ontkoppelen stil naar 'geüpload'."
    proposed_promise:
      text: "Sleep een ritbestand (GPX, FIT of TCX) in Sparki en het wordt een gewone rit in je administratie — met alle meetwaarden die er echt in staan, niets erbij verzonnen. Hetzelfde bestand twee keer uploaden geeft nooit een dubbele rit. Een routebestand zonder datum wordt eerlijk als route behandeld, nooit als verzonnen training. Wat Sparki (nog) niet kan lezen, zegt het eerlijk."
      proposed_by: replit
      rationale: "Bestandimport is de bron-neutraliteitsgarantie: elk platform dat nooit een API geeft (TrainingPeaks) blijft bereikbaar via export→import. Marktlat: Strava's eigen bestandsupload (accepteert FIT/TCX/GPX vlekkeloos incl. sensordata)."
      rene_approved: false

    external_intelligence:
      research_required: true
      candidate_sources:
        - name: "Garmin FIT SDK / FIT-bestandspecificatie"
          coverage: "Binair activiteitenformaat van vrijwel alle fietscomputers/horloges; definieert records voor vermogen, HR, cadans, GPS, ronden. Dekt NIET: fabrikant-specifieke developer-fields buiten de standaardprofielen."
          actuality: "Actief onderhouden door Garmin, meerdere releases per jaar; ons parsing-doel is het stabiele activiteitenprofiel."
          license_status: "SDK gratis onder Garmin's FIT-licentie (vrij te gebruiken voor het lezen/schrijven van FIT); geen beperkingen op commercieel parsen bekend."
          limitations:
            - "Developer-fields en fabrikant-extensies vallen buiten de standaard en kunnen data bevatten die wij niet lezen."
          applicability: "Contract voor de FIT-parser: welke velden bestaan, eenheden, en wat eerlijk 'ontbreekt' is."
        - name: "GPX 1.1-schema + Garmin TrackPointExtension"
          coverage: "GPS-tracks met tijd/hoogte; sensordata (HR/cadans/vermogen) alleen via extensies (gpxtpx, power-element). Dekt NIET: ronden/structuur; veel exports laten sensordata weg."
          actuality: "GPX 1.1 uit 2004, stabiel; TrackPointExtension v2 stabiel."
          license_status: "Open schema, vrij bruikbaar, geen beperkingen."
          limitations:
            - "Geen verplichte starttijd: een GPX kan een pure route zijn — vandaar de route≠activiteit-regel."
            - "Extensie-prefixen variëren per exporteur; parser moet prefix-agnostisch lezen."
          applicability: "Contract voor GPX-parsing én voor onze eigen mobiele rit-GPX (zelfde extensieconventie, zodat telefoonritten identiek geparsed worden)."
        - name: "Garmin TCX-schema (Training Center XML v2)"
          coverage: "Activiteiten met ronden, HR, cadans, vermogen (extensie); ouder maar nog gangbaar exportformaat. Dekt NIET: moderne velden als links/rechts-balans."
          actuality: "Stabiel/bevroren schema; wijzigt niet meer."
          license_status: "Open schema van Garmin, vrij bruikbaar."
          limitations:
            - "Vermogen zit in een extensie die niet elke exporteur meegeeft."
          applicability: "Contract voor de TCX-parser."
        - name: "CSV-exports van platforms (o.a. TrainingPeaks/Strava bulk-export)"
          coverage: "Samenvattingsregels per activiteit (geen tracks); kolomindeling verschilt PER PLATFORM en per exportversie — er bestaat geen standaard."
          actuality: "Geen versiebeheer; platforms wijzigen kolommen onaangekondigd."
          license_status: "Eigen data van de atleet; geen licentieprobleem, wel geen formeel contract om tegen te bouwen."
          limitations:
            - "Zonder vaste kolomstandaard is elke CSV-parser per platform maatwerk met breekrisico."
          applicability: "KANDIDAAT voor de openstaande CSV-taak: alleen bouwen per concreet platformformaat met voorbeelden, nooit een 'algemene' CSV-gok."
      sources_in_use:
        - "FIT SDK-spec, GPX 1.1+gpxtpx, TCX v2 — de drie gebouwde parsers volgen deze contracten."
      privacy_status: unknown
      missing_information:
        - "Dekking van fabrikant-afwijkingen in FIT-bestanden (welke apparaten produceren niet-standaard velden) — geen inventarisatie."
        - "Welke CSV-platformformaten René's doelgroep echt gebruikt (bepaalt of de CSV-taak maatwerk voor 1 of 5 formaten is)."

    replit_definition:
      objective_quality_standard: "Per geïmporteerd bestand: alle in het bestand aanwezige standaardvelden landen correct (steekproef tegen het bronbestand); 0 verzonnen waarden voor afwezige velden; byte-identieke herimport ⇒ 0 nieuwe sessies; GPX zonder starttijd ⇒ 0 sessies; parsefout ⇒ import blijft bewaard met eerlijke foutnotitie (parse gaat nooit verloren door een hub-fout)."
      recommended_default: "Bestand als volwaardige hub-bron onder provider 'file' (bestaand); consent lokaal verleend (het bestand ÍS de data van de atleet); CSV pas beloven na platform-specifieke parsers uit de open taak."
      technical_limits:
        - "Samenvattings-CSV zonder track kan nooit dezelfde analysediepte geven als FIT/GPX (geen vermogenscurve, geen hoogteprofiel)."
        - "Inhouds-hash-idempotentie beschermt alleen tegen identieke bytes; her-geëxporteerde varianten leunen op de gewone dedupe met haar toleranties."
      assumptions:
        - "De drie standaardformaten dekken vrijwel alle export-behoeften van wielrenners; CSV is een nakomer voor samenvattingsdata."
      unknowns:
        - "Praktijkfoutpercentage van FIT-parsing over een brede apparatenmix (nooit breed gemeten)."
      evidence_method:
        - "Bestaande parser-/ingest-tests her-runnen als proof-artefact."
        - "Nieuw: veldgetrouwheids-steekproef (bestand → sessie, veld-voor-veld-vergelijking) over een set echte bestanden van verschillende apparaten."
        - "Praktijktest: René importeert een oude export (bv. TrainingPeaks/Garmin bulk) en controleert een handvol ritten inhoudelijk."

    rene_calibration:
      questions:
        - question: "Hoe belangrijk is CSV-import voor jou (bv. oude TrainingPeaks-exports)? Dat bepaalt of de openstaande CSV-taak prioriteit krijgt en voor wélke platformformaten we bouwen."
          answer_rene: "Belangrijk — er is oude data die meegenomen moet worden; de openstaande CSV-taak krijgt prioriteit." # beantwoord 2026-07-30
        - question: "Als een bestand deels leesbaar is (bv. track prima, vermogensdata corrupt): wil je (a) importeren wat kan met een zichtbare kanttekening, of (b) de hele import weigeren zodat je het merkt?"
          answer_rene: "Importeren wat kan, met een duidelijke kanttekening bij de rit." # beantwoord 2026-07-30
      completed: true # beide vragen beantwoord 2026-07-30

    acceptance_contract:
      hard_reject_rules:
        - rule: "Er wordt nooit een activiteit met een verzonnen datum of verzonnen meetwaarde aangemaakt."
          rule_type: hard_blockage
          measurement_level: per_sessie
          aggregate_justification: ""
          counterexamples:
            - case: "GPX-routebestand zonder tijdstempels wordt geüpload."
              proof_stage: designed
              proof_method: "Redenering: de canonieke mapping retourneert null zonder echte starttijd ⇒ geen sessie, status 'geparsed' (route). Latere test: timeless GPX → 0 training_sessions-rijen."
              proof_result: not_yet_tested
            - case: "TCX zonder vermogensextensie; downstream zou TSS op geschat vermogen willen rekenen."
              proof_stage: designed
              proof_method: "Redenering: afwezige velden blijven null; TSS-afleiding vereist echt vermogen + FTP en slaat anders eerlijk over. Latere test: sessie uit zo'n bestand heeft avgPower=null en geen afgeleide belastingsscore uit vermogen."
              proof_result: not_yet_tested
        - rule: "Hetzelfde bestand twee keer uploaden mag nooit een tweede sessie opleveren."
          rule_type: hard_blockage
          measurement_level: per_sessie
          aggregate_justification: ""
          counterexamples:
            - case: "Byte-identiek FIT-bestand, tweede keer onder een andere bestandsnaam geüpload."
              proof_stage: designed
              proof_method: "Redenering: extern id = hash van uitsluitend de inhoud (naam bewust uitgesloten) ⇒ zelfde provenance-rij, geen tweede sessie. Latere test: dubbele upload → 1 sessie, idempotente boeking."
