chapter_bc_training_coaching_en_analyse:

  - id: TRAIN_PLAN_001
    module: "Training, coaching en analyse"
    subject: "Trainingsplan — veilig, uitvoerbaar en doelgericht plannen zonder coach"
    status: needs_calibration

    current_state:
      technical_status: implemented
      source_snapshot: 2026-07-30
      evidence_status: "Deels: de plan-engine is deterministisch (alle cijfers uit guardrails/skeleton; AI schrijft alleen titels/uitleg met template-fallback), sessieplafonds per ervaring/type en risk-/loadcapaciteitsfactoren bestaan, ziek/geblesseerd blokkeert alle trainingsdruk, en de plan-lifecycle (pauze/hervat/verwijder met single-current-invariant) is getest. Ontbreekt: een directe geautomatiseerde test op de plan-engine zelf (caps/weekquota als asserts) en praktijkbewijs dat een gegenereerd plan door een echte renner als uitvoerbaar wordt ervaren."
      practice_status: "In dagelijks gebruik bij René/Dylan; nooit systematisch getoetst tegen vooraf vastgelegde verwachtingen (uitvoerbaarheid, logica na verstoring)."
      known_limitations:
        - "Er bestaan twee planbouwpaden: het actieve API-pad (skeleton met availableDays/races/gezondheid/weer/risk) en een oudere gestructureerde generator die busyDays/leefagenda ondersteunt. De leefagenda-sturing zit NIET aantoonbaar in het actieve pad — de belofte 'levensgebeurtenissen sturen het plan' geldt dus niet uniform."
        - "Handmatige edits en toegepaste voorstellen accepteren duur tot 1440 min en TSS tot 1000 — ver boven de plan-caps; de guardrails gelden bij genereren, niet bij wijzigen."
        - "Er is geen letterlijke TSB-drempelguard in de plan-engine; risico loopt via een samengesteld risicosignaal (CTL/ATL/TSB + readiness) met committed/provisional-factoren."
        - "Extra (ongeplande) trainingen worden niet door de engine herverdeeld; alleen de weekimpact wordt getoond."
        - "Eerste 7 dagen zijn vast (committed), twee weken daarna voorlopig; herstelwijzigingen passen alleen voorlopige dagen aan — dit onderscheid is in de UI-belofte nog niet expliciet."

    proposed_promise:
      text: "Sparki plant drie weken vooruit: de komende week staat vast, de twee weken daarna zijn een voorlopige vooruitblik die meegroeit met jouw herstel, gezondheid en agenda. Elke training past binnen wat voor jouw ervaring en beschikbare tijd realistisch is — Sparki propt nooit meer in je week dan er past. Bij een harde medische of acute blokkade verdwijnt elke trainingsdruk; bij een niet-acute klacht of in een herstelfase plant Sparki alleen aangepaste belasting volgens vooraf vastgelegde veiligheidscriteria, en terugkeer na ziekte of blessure gaat trapsgewijs en criteriagestuurd — nooit automatisch volledig normaal. De getallen (duur, zwaarte, rust) komen altijd uit vaste, controleerbare regels; taal en uitleg mogen van de AI komen, de cijfers nooit."
      proposed_by: replit
      rationale: "Een coach-loos plan is Sparki's kernbelofte richting zelfstandige renners. De wereldmarkt-lat (TrainerRoad/JOIN-achtige adaptieve plannen) is: adaptief én voorspelbaar veilig. Determinisme van de cijfers is de bestaansreden van het vertrouwen — dat moet aantoonbaar blijven."
      rene_approved: false

    external_intelligence:
      research_required: true
      candidate_sources:
        - name: "Eigen plan-engine + guardrails (skeleton, caps, risk-factoren)"
          coverage: "Dekt de volledige plangeneratie en veiligheidsgrenzen in het actieve pad. Dekt NIET: leefagenda-sturing (alleen in het oude pad) en grenzen bij handmatig wijzigen."
          actuality: "Live eigen code; wijzigt mee met het product."
          license_status: "Eigen werk."
          limitations:
            - "Caps en factoren zijn eigen keuzes; geen externe validatie per waarde."
          applicability: "De meetbasis voor alle afkeurregels hieronder (caps, ziek=rust, determinisme)."
        - name: "Trainingsleer-standaarden voor periodisering en belastingsopbouw (Coggan/Allen; Seiler polarisatie; ACWR-literatuur o.a. Gabbett)"
          coverage: "Dekt veilige weekopbouw, verhouding intensief/rustig en het spike-risico (acute:chronische belasting). Dekt NIET: individuele medische situaties of jeugdspecifieke periodisering in detail."
          actuality: "Boek 3e druk 2019; Seiler-publicaties 2006–2019; ACWR-debat loopt (methodiekkritiek sinds 2020) — geen vaste versie."
          license_status: "Wetenschappelijke kennis vrij toepasbaar als onderbouwing; geen tekstovername."
          limitations:
            - "ACWR is omstreden als voorspeller; bruikbaar als waarschuwingssignaal, niet als bewezen blessurevoorspelling."
          applicability: "Onderbouwt de risk-factoren en de keuze dat een spike (ATL/CTL > ~1,5) het plan dempt in plaats van doorduwt. Nadrukkelijk: deze verhouding is GEEN bewezen blessure- of ziektevoorspeller — zij mag alleen dienen als voorzichtig waarschuwingssignaal, altijd gecombineerd met meerdere gegevens, nooit zelfstandig voor diagnose, harde medische conclusie of automatische escalatie, en altijd met expliciete benoeming van onzekerheid en beperkingen."
      sources_in_use:
        - "Eigen plan-engine — leidend."
        - "Trainingsleer-standaarden — als onderbouwing van caps/risk-factoren, niet als letterlijke formule."
      privacy_status: unknown
      missing_information:
        - "Geen directe engine-test die de sessieplafonds en week-onderfilling als asserts vastzet."
        - "Geen vastgelegde onderbouwing per capwaarde (waarom 300 min long-ride max bij gevorderd, etc.)."
        - "Onbekend of het actieve pad leefagenda-events ooit gaat consumeren of dat het oude pad wordt uitgefaseerd (architectuurkeuze open)."

    replit_definition:
      objective_quality_standard: "Elk gegenereerd plan: 0 sessies boven het cap voor die DayKind×ervaring; weekminuten ≤ target×fase/risk-factor (onderfillen mag, overfillen nooit); bij een harde medische of acute blokkade 0 trainingsprikkels, bij een niet-acute klacht of herstelfase uitsluitend aangepaste belasting binnen vooraf vastgelegde veiligheidscriteria, en terugkeer altijd trapsgewijs (nooit automatisch volledig normaal); bij duidelijke gezondheidsrisico's weegt veiligheid zwaarder dan de wens van sporter of coach; alle cijfers herleidbaar tot deterministische regels (AI-uitval verandert geen enkel getal)."
      recommended_default: "Committed week vast houden, voorlopige weken automatisch mee laten bewegen met herstel/gezondheid (huidig gedrag); onrealistische weekdoelen: kort het conflict benoemen en daarna eerlijk veilig onderfillen, nooit oplossen met onhaalbare sessies (Besluit René 30-07-2026). Besluitniveau (advies/voorstel/automatisch): automatische aanpassing op voorlopige plandagen; de vaste (committed) week alleen automatisch bij een duidelijke veiligheidsreden (BOUWOPGAVE — bestaat nog niet), anders als voorstel dat de sporter toepast; handmatige wijzigingen blijven binnen harde veiligheidsgrenzen, waarbij een ervaren volwassene niet-kritieke adviezen mag overrulen maar nooit een harde gezondheidsblokkade (BOUWOPGAVE: caps-validatie op het wijzig-pad); al het overige is advies."
      technical_limits:
        - "Leefagenda stuurt alleen het oude generatorpad; het actieve pad kent availableDays maar geen event-mapping."
        - "Wijzig-pad (PUT) valideert niet tegen de plan-caps."
      assumptions:
        - "De committed/provisional-splitsing (7+14 dagen) past bij hoe renners plannen ervaren; nooit gekalibreerd."
      unknowns:
        - "Hoe vaak het automatische doorrollen (maybeRollForward) in de praktijk een verrassend ander plan oplevert."
      evidence_method:
        - "Nieuwe engine-test: genereer plannen voor randprofielen (beginner met 20 uur wens; high risk; ziek) en assert caps/onderfilling/0-druk."
        - "Praktijktest: René/Dylan beoordelen één gegenereerd 3-wekenplan vooraf op uitvoerbaarheid tegen vastgelegde verwachting, en na een gemiste week opnieuw."

    rene_calibration:
      questions:
        - question: "Hoeveel mag Sparki zonder jouw bevestiging aan het plan veranderen: alleen de voorlopige weken automatisch bijstellen (huidig), óók de vaste week bij duidelijke signalen, of nooit iets zonder akkoord?"
          answer_rene: "(Besluit René 30-07-2026) Voorlopige weken mogen automatisch worden aangepast. De vaste week alleen automatisch bij een duidelijke veiligheidsreden; anders als voorstel. Overkoepelend (besluit 20): zonder reactie van de sporter mag Sparki alleen voorlopige planning en niet-kritieke keuzes automatisch veilig aanpassen — definitieve doelen, vaste week, grote belastingwijzigingen en coachbesluiten niet; bij harde veiligheid mag Sparki wél blokkeren, met uitleg. BOUWOPGAVE: automatische vaste-week-aanpassing bij een duidelijke veiligheidsreden bestaat nog niet in code."
        - question: "Als jouw weekdoel niet realistisch past (te veel uren voor je ervaring/beschikbare dagen): wil je dat Sparki stil minder inplant met uitleg (huidig), of het gesprek aangaat vóór het plan er staat?"
          answer_rene: "(Besluit René 30-07-2026) Sparki benoemt kort het conflict en plant daarna veilig minder in. Geen langdurige dialoog nodig."
        - question: "Moet een handmatige wijziging door jou aan een training aan dezelfde veiligheidsgrenzen gebonden zijn als het plan zelf (bijv. max-duur per sessie), of mag jij als gebruiker alles overrulen?"
          answer_rene: "(Besluit René 30-07-2026) Handmatige wijzigingen blijven binnen harde veiligheidsgrenzen. Een ervaren volwassene mag niet-kritieke adviezen overrulen, maar nooit een harde gezondheidsblokkade. BOUWOPGAVE: het wijzig-pad (PUT) valideert nu niet tegen de plan-caps (accepteert tot 1440 min/1000 TSS) — die validatie moet gebouwd worden."
      completed: true

    acceptance_contract:
      hard_reject_rules:
        - rule: "Bij een harde medische of acute blokkade (gemeld ziek met actieve klachten, acute blessure, 'niet trainen') bevat het plan geen enkele trainingsprikkel — geen enkele sessie, hoe licht ook. Bij een niet-acute klacht of herstel-/re-integratiefase mag uitsluitend aangepaste belasting bestaan volgens vooraf vastgelegde veiligheidscriteria; terugkeer verloopt trapsgewijs en criteriagestuurd en wordt nooit automatisch volledig normaal. Bij duidelijke gezondheidsrisico's weegt veiligheid zwaarder dan de wens van sporter of coach."
          rule_type: hard_blockage
          measurement_level: per_dag
          aggregate_justification: ""
          counterexamples:
            - case: "Atleet meldt ziek met actieve klachten op maandag; het gegenereerde/doorgerolde plan bevat woensdag een 'lichte hersteltraining' van 30 min — overtreding: bij een harde blokkade is élke prikkel te veel."
              proof_stage: designed
              proof_method: "Redenering: de engine blokkeert bij sick/injured alle trainingsdruk in het skeleton; per_dag omdat élke dag afzonderlijk vrij van prikkels moet zijn. Latere executed-stap: engine-test met ziek-status asserteert 0 workouts. BOUWOPGAVE: de huidige code kent alleen de binaire blokkade — het onderscheid niet-acute klacht/herstelfase met aangepaste belasting volgens vastgelegde veiligheidscriteria en een trapsgewijze, criteriagestuurde terugkeer bestaat nog niet en moet gebouwd worden."
              proof_result: not_yet_tested
            - case: "Atleet zit in een herstelfase na ziekte; het plan springt in één keer terug naar het volledige normale weekvolume zonder trapsgewijze opbouw of criteria — overtreding: terugkeer mag nooit automatisch volledig normaal zijn."
              proof_stage: designed
              proof_method: "Redenering: de resume-gate vereist een bewuste herstelcheck, maar een criteriagestuurde opbouwfase ná de check ontbreekt in de plan-engine (bouwopgave); de latere executed-stap toetst dat de eerste week na herstel aantoonbaar gedempt is en pas bij voldoen aan criteria normaliseert."
              proof_result: not_yet_tested
        - rule: "Geen enkele geplande sessie mag boven het sessieplafond voor die trainingssoort en dat ervaringsniveau uitkomen."
          rule_type: hard_blockage
          measurement_level: per_sessie
          aggregate_justification: ""
          counterexamples:
            - case: "Beginner met een (onrealistisch) weekdoel van 15 uur krijgt een duurrit van 6 uur ingepland om het quotum te halen — overtreding; het juiste gedrag is eerlijk onderfillen."
              proof_stage: designed
              proof_method: "Redenering: caps per DayKind×ervaring zijn hard in het skeleton (long max 120 min voor beginner) en week-overschot wordt niet ingepland; per_sessie zodat één te lange rit nooit wegvalt tegen een verder correct weekgemiddelde. Latere executed-stap: randprofiel-test."
              proof_result: not_yet_tested
        - rule: "AI mag nooit een getal in het plan bepalen of wijzigen: bij AI-uitval of afwijkende AI-output zijn duur, TSS, intensiteit en rustdagen identiek."
          rule_type: hard_blockage
          measurement_level: per_sessie
          aggregate_justification: ""
          counterexamples:
            - case: "LLM-uitval tijdens plangeneratie; als het plan dan andere duur/TSS-waarden bevat (of niet gegenereerd kan worden), is dat een overtreding — alleen titels/uitleg mogen terugvallen op templates."
              proof_stage: designed
              proof_method: "Redenering: de engine berekent alle cijfers vóór de AI-stap en heeft een expliciete template-fallback voor tekst; latere executed-stap: test met geforceerde LLM-fout vergelijkt de numerieke planinhoud byte-voor-byte."
              proof_result: not_yet_tested
        - rule: "Plan verwijderen of opnieuw genereren mag nooit sessiehistorie of voltooide trainingen aantasten."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "Atleet verwijdert het plan; een vorige week voltooide gekoppelde training verdwijnt of verliest zijn koppeling met terugwerkende kracht — overtreding."
              proof_stage: designed
              proof_method: "Redenering: DELETE verwijdert alleen plandagen en nog-geplande workouts, ontkoppelt voltooide workouts zonder ze te wissen, en regeneratie verwijdert uitsluitend toekomstige planned rijen. Latere executed-stap: lifecycle-test met voltooide sessie vóór delete/regenerate."
              proof_result: not_yet_tested
      tolerances:
        - "Onderfillen van een onrealistisch weekdoel is toegestaan en gewenst (met uitleg); de mate van demping bij verhoogd risico (factoren 0,6–1,05) is kalibreerbaar."
      unknown_data_policy: "Zonder FTP werkt het plan op duur/RPE-niveau in plaats van wattages; zonder readiness-data geldt het voorzichtige pad. Ontbrekende data verhoogt nooit de belasting en wordt nooit stilzwijgend aangevuld met aannames richting zwaarder."
