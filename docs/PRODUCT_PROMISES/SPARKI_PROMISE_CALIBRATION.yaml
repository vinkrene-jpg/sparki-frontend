              proof_result: not_yet_tested
        - rule: "Gezondheidsstatus kan alleen verlicht worden via de herstelcheck, en terugkeer na ziekte of blessure is daarna trapsgewijs en criteriagestuurd — nooit automatisch volledig normaal; elk ander pad dat de status verlaagt of de belasting in één keer normaliseert is een defect."
