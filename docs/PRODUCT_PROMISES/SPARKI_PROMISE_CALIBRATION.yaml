  - id: START_VANDAAG_001
    module: "Start, profiel en doelen"
    subject: "Vandaag — één leidend moment, eerlijk gevoed, proactief zonder te schreeuwen"
    status: needs_calibration

    current_state:
      technical_status: implemented
      source_snapshot: 2026-07-30
      evidence_status: "Sterk op contractniveau: day-type-precedentie (gezondheid → race → rust → coach → herstel → training → algemeen), de aandachtswet (één leidend Momentblok, één nudge per bezoek, weer/leskaart-gates, wederzijdse uitsluiting) en dagadvies-contracten zijn elk afzonderlijk getest en groen. Ontbreekt: één geïntegreerde test die alle bronnen en de echte rendering tegelijk vastzet, en praktijkbewijs dat het gekozen moment ook het JUISTE moment was."
      practice_status: "Dagelijks in gebruik; geen gestructureerde toets 'toonde Vandaag vandaag het juiste?' tegen vooraf vastgelegde verwachtingen."
      known_limitations:
        - "Bij actieve commercial_shell-flag is de commerciële schil de feitelijke surface; de contract-tests dekken vooral de pure logica, niet de volledige geïntegreerde rendering."
        - "Emergency- en race-daytypes zijn deels slapend tot echte gezondheids-/racebronnen bestaan."
