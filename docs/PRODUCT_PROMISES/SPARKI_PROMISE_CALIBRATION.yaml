  - id: START_DOELEN_001
    module: "Start, profiel en doelen"
    subject: "Doelen — afgeleide en eigen doelen, veilige sturing en conflictgedrag"
    status: needs_calibration

    current_state:
      technical_status: implemented
      source_snapshot: 2026-07-30
      evidence_status: "Sterk op de veiligheidsranden: afvaldoel-tests bewijzen de 0,5 kg/week-grens, de RED-S-weigering onder 17 of bij onbekend geboortejaar (fail-closed), volledige voeding rond trainingen en de vaste rationale-zin; doelen-tests dekken voortgang, voorstel-dedupe (DB-unique + onConflict) en de directive-filtering. Ontbreekt: bewijs voor conflictgedrag tussen meerdere doelen (er ís geen expliciete conflictengine) en praktijkbewijs dat doelsturing als juist wordt ervaren."
      practice_status: "In gebruik; seizoens-/ontwikkeldoel sturen plan en dagadvies via één leeslaag. Geen praktijktoets van conflictsituaties."
      known_limitations:
        - "Er is geen expliciete conflict-/afwegingsengine tussen concurrerende doelen; prioriteit bepaalt volgorde van presentatie en voorstellen, niet een aantoonbare winnaar. Gezondheid/herstel fungeert wel als veiligheids-overrider."
        - "Voortgang van het seizoensgewichtsdoel meet geen echte gewichtstrend (de engine beoordeelt op algemene load/plan/health-signalen)."
        - "Afgeleide doelen tonen maximaal de zes eerstvolgende races."
        - "Presentatie en sturing lopen niet volledig gelijk: een voedings-seizoensdoel kan als afgeleid doel getoond worden terwijl de leeftijdspoort de doorvoering blokkeert."

    proposed_promise:
      text: "Je doelen sturen echt: je wedstrijd, je ontwikkelrichting en je seizoensdoel werken door in je plan, je dagadvies en je voeding — met één en dezelfde uitleg overal. Sparki bewaakt daarbij altijd de veilige grens: afvallen gaat nooit sneller dan een halve kilo per week, trainingen worden nooit uitgehongerd, en voor jonge renners doet Sparki niet aan gewichtssturing."
      proposed_by: replit
      rationale: "Doelen zijn het contract tussen atleet en coach; als de sturing niet aantoonbaar of niet veilig is, is alle coaching willekeur. De veiligheidsranden zijn hier belangrijker dan de featurebreedte (RED-S bij jeugd is een absolute ondergrens, geen productkeuze)."
      rene_approved: false

    external_intelligence:
      research_required: true
      candidate_sources:
        - name: "Eigen doelen-/seizoensdoel-lagen (goals engine + season-goal leeslaag)"
          coverage: "Dekt afgeleide doelen (race/ontwikkeling/seizoensgewicht), gebruikersdoelen, voorstellen en de doorvoering in plan/dagadvies/voeding. Dekt NIET: expliciete conflictresolutie tussen doelen (bestaat niet)."
          actuality: "Live eigen code met tests."
          license_status: "Eigen werk."
          limitations:
            - "Voortgangsmeting van het gewichtsdoel gebruikt geen echte gewichtstrend."
          applicability: "De sturing zelf en de veiligheidsranden; meetbasis voor alle regels hieronder."
        - name: "RED-S/jeugd-richtlijnen (IOC-consensus REDs 2023; NOC*NSF-lijn jeugd en gewicht)"
          coverage: "Dekt waarom gewichtssturing bij minderjarigen en agressieve energietekorten schadelijk zijn. Dekt NIET: individuele diagnose — Sparki blijft op richtlijnniveau en weigert, het behandelt niet."
          actuality: "IOC-consensus 2023; stabiel, herziening op meerjarencadans."
          license_status: "Wetenschappelijke consensus vrij toepasbaar als onderbouwing; geen tekstovername."
          limitations:
            - "Leeftijdsgrens 17 is een eigen veilige keuze binnen de richtlijngeest; de richtlijnen noemen geen exacte productgrens."
          applicability: "Onderbouwt de fail-closed jeugdweigering en de 0,5 kg/week-grens."
        - name: "Gangbare sportvoedingsrichtlijnen voor gewichtsverlies bij duursporters (o.a. ACSM/IOC-position stands)"
          coverage: "Dekt veilige afvalsnelheid (~0,5–1 kg/week max, behoud rond training) voor volwassen duursporters. Dekt NIET: individuele medische situaties."
          actuality: "Position stands; herzien op meerjarencadans."
          license_status: "Vrij toepasbaar als onderbouwing."
          limitations:
            - "Sparki kiest bewust de conservatieve onderkant (0,5) — strenger dan sommige richtlijnen toestaan."
          applicability: "Onderbouwt de gekozen 0,5 kg/week als harde bovengrens."
      sources_in_use:
        - "Eigen doelen-/seizoensdoel-lagen — leidend."
        - "RED-S/jeugdrichtlijnen + sportvoedingsrichtlijnen — als onderbouwing van de veiligheidsranden."
      privacy_status: unknown
      missing_information:
        - "Geen vastgelegd conflictbeleid: wat wint als een wedstrijddoel en een afvaldoel elkaar bijten (nu impliciet: veiligheid overruled, verder presentatievolgorde)."
        - "Geen echte gewichtstrend in de voortgangsmeting van het seizoensdoel."

    replit_definition:
      objective_quality_standard: "Elk actief doel is aantoonbaar terug te vinden in plan/dagadvies/voeding met één canonieke uitlegzin; 0 gewichtssturing onder 17 of bij onbekend geboortejaar; 0 adviezen die sneller dan 0,5 kg/week sturen; afgeleide doelen bestaan nooit dubbel (stabiele id's, DB-unique voorstellen)."
      recommended_default: "Veiligheid > gezondheid/herstel > wedstrijddoel > seizoensdoel > overige doelen als vaste afwegingsvolgorde bij conflicten; conflicten zichtbaar benoemen ('je afvaldoel staat deze week in de wacht voor je wedstrijd') in plaats van stil kiezen."
      technical_limits:
        - "Zonder gewichtsdata is voortgang op het gewichtsdoel niet echt meetbaar; dan eerlijk 'niet meetbaar' tonen."
        - "Race-afgeleide doelen beperkt tot de zes eerstvolgende races."
      assumptions:
        - "De impliciete huidige volgorde (veiligheid overruled alles) komt overeen met René's visie; de rest van de conflictvolgorde is nooit vastgelegd."
      unknowns:
        - "Hoe vaak doelconflicten in de praktijk voorkomen (geen meting)."
      evidence_method:
        - "Bestaande goals/afvaldoel/development-goal-tests her-runnen als proof-artefact."
        - "Nieuw tegenvoorbeeld: gecombineerd wedstrijd- + afvaldoel in wedstrijdweek — verwachting: voeding volledig, afvaldoel zichtbaar 'in de wacht'."
        - "Praktijktest: René zet een echt seizoensdoel en controleert de doorwerking op drie plekken (plan, dagadvies, voeding) tegen de canonieke zin."

    rene_calibration:
      questions:
        - question: "Als twee doelen botsen (bijv. afvallen vs. topvorm voor een wedstrijd): wil je dat Sparki stil de veilige keuze maakt, of het conflict expliciet benoemt en jou laat kiezen welk doel deze periode wint?"
          answer_rene: "Doelconflicten altijd benoemen: Sparki geeft de veilige aanbeveling en de gebruiker kiest welk doel tijdelijk leidend is; veiligheidsgrenzen blijven hard. (Besluit René 30-07-2026)"
        - question: "Mogen doelen die Sparki zelf afleidt (uit je wedstrijdkalender of ontwikkelrichting) direct meesturen in het plan, of pas nadat jij ze bevestigd hebt?"
          answer_rene: "Afgeleide doelen mogen pas na bevestiging door de gebruiker het plan gaan sturen. (Besluit René 30-07-2026)"
        - question: "Hoe streng wil je het afvaldoel bewaakt hebben: bij elke stagnatie een gesprek, alleen bij afwijking van de veilige lijn, of pas als jij er zelf om vraagt?"
          answer_rene: "Alleen bespreken bij afwijking van de veilige lijn of een betekenisvolle langdurige stagnatie; niet bij iedere normale gewichtsschommeling. (Besluit René 30-07-2026)"
      completed: true

    acceptance_contract:
      hard_reject_rules:
        - rule: "Onder 17 jaar of bij onbekend geboortejaar is er nooit enige vorm van gewichtssturing — ook niet als er een doelrij in de database staat."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "16-jarige met een (bijv. door een eerdere fout aangemaakte) seizoensgewichtsdoelrij opent het dagadvies; elke calorie-/gewichtssturing in dat advies is een overtreding."
              proof_stage: designed
              proof_method: "Redenering: de leeftijdspoort is fail-closed in de leeslaag (weigert ook bij bestaande doelrij en bij onbekend geboortejaar) en is als test aanwezig; voor dit contract geldt executed pas na her-run als proof-artefact. Bekende zwakte om óók te toetsen: de presentatielaag kan zo'n doel nog wél tonen — de regel moet op sturing én presentatie worden getoetst."
              proof_result: not_yet_tested
        - rule: "Geen enkel advies mag sneller sturen dan 0,5 kg gewichtsverlies per week; een doel dat sneller vereist wordt eerlijk 'niet haalbaar binnen veilige grens' genoemd en NIET versneld."
          rule_type: hard_blockage
          measurement_level: per_dag
          aggregate_justification: ""
          counterexamples:
            - case: "Doel: 4 kg eraf in 4 weken (1 kg/week vereist). Elk dagadvies dat het tekort vergroot om dat tempo te halen is een overtreding; het juiste gedrag is feasible:false + sturing op maximaal 0,5."
              proof_stage: designed
              proof_method: "Redenering: SAFE_KG_PER_WEEK=0,5 is de enige sturingsconstante en het onhaalbare-tempo-pad geeft feasible:false zonder versnelling; per_dag omdat élk individueel dagadvies veilig moet zijn — een week die gemiddeld veilig uitkomt met één agressieve dag is tóch een overtreding. Executed na her-run van de afvaldoel-testset tegen dit contract."
              proof_result: not_yet_tested
        - rule: "Een training wordt nooit uitgehongerd: rond en tijdens trainingen is de voedingssturing altijd volledig, ongeacht het afvaldoel."
          rule_type: hard_blockage
          measurement_level: per_sessie
          aggregate_justification: ""
          counterexamples:
            - case: "Trainingsdag binnen een actief afvaldoel waarop het fuel-advies voor de training zelf verlaagd wordt om het weektekort te halen — overtreding, ook als het weektotaal 'klopt'."
              proof_stage: designed
              proof_method: "Redenering: de seizoensdoel-leeslaag beperkt het tekort tot rustige momenten en houdt trainingen volledig gevoed; per_sessie zodat één uitgehongerde training nooit wegvalt tegen een verder correcte week. Executed na her-run met dit scenario als expliciete assert."
              proof_result: not_yet_tested
        - rule: "Afgeleide doelen en maandvoorstellen mogen nooit dubbel ontstaan, ook niet bij gelijktijdige verzoeken."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "Twee gelijktijdige triggers voor hetzelfde maandvoorstel (zelfde doel, zelfde maand); twee voorstelrijen is een overtreding."
              proof_stage: designed
              proof_method: "Redenering: dedupe loopt via DB-unique (clerk_id, dedupe_key) + onConflictDoNothing — concurrency-safe by construction, niet read-then-insert; afgeleide doelen hebben stabiele id's en bestaan alleen read-time. Executed na een parallelle-trigger-test."
              proof_result: not_yet_tested
      tolerances:
        - "De conflictvolgorde onder het veiligheidsniveau (wedstrijd vs. seizoensdoel vs. overige) is een kalibreerbare productkeuze, geen harde grens."
      unknown_data_policy: "Zonder benodigde data (geboortejaar, huidig gewicht, voldoende trainingsdata) wordt sturing geweigerd of 'niet meetbaar' getoond — nooit met aannames doorgestuurd. Onbekende leeftijd telt als minderjarig (fail-closed)."
      approved: false

    validation:
