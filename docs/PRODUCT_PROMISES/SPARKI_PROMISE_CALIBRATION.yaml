    replit_definition:
      objective_quality_standard: "Statusverzwaring kan altijd en direct; statusverlichting uitsluitend via de herstelcheck (409 bij 'niet trainen'); bij actieve status ziek/geblesseerd 0 trainingsprikkels waar dan ook; dagelijkse check-in vraagt alleen ontbrekende velden; 0 medische diagnose- of behandeltaal in enige copy."
      recommended_default: "Zelfrapportage-eerst houden en wearable-data (zodra beschikbaar) alleen als extra signaal, nooit als automatische statuswijziging. Na 'beter melden' een bewaakte, trapsgewijze hervatting op basis van klachten, belasting en reactie — geen universeel vast aantal dagen en nooit automatisch volledig normaal (Besluit René 30-07-2026; BOUWOPGAVE). Bij afwijkende metingen eerst direct vragen wat er speelt; bij duidelijke risico-indicatoren tegelijk het dagadvies voorzichtig verlagen; bij één zwakke afwijking alleen informeren (Besluit René 30-07-2026; BOUWOPGAVE). Besluitniveau (advies/voorstel/automatisch): een ziek-/blessuremelding werkt automatisch door als rem op plan en Vandaag (veiligheidshandeling); statusverlichting is altijd een expliciete keuze van de sporter via de herstelcheck; al het overige (opbouwadvies, signalen) is advies."
      technical_limits:
