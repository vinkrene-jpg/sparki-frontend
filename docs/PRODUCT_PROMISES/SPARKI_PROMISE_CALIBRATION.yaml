              proof_stage: designed
              proof_method: "Redenering: het schrijfpad markeert handmatige invoer expliciet Estimated=false en geseede waarden estimated; de connect-step-test controleert estimated-vlaggen op canonieke persistentie. Geautomatiseerde her-run met dit exacte geval als assert is de latere executed-stap."
              proof_result: not_yet_tested
        - rule: "Geen enkele onboarding-stap mag een dood einde zijn: elke stap biedt doorgaan of overslaan, ook bij een mislukte koppeling of mislukte planbouw."
          rule_type: hard_blockage
          measurement_level: per_segment
          aggregate_justification: ""
          counterexamples:
            - case: "Strava-OAuth mislukt halverwege (gebruiker weigert autorisatie); terugkomend in de app is er geen knop om zonder koppeling verder te gaan — dat is een blokkerende overtreding, ook als 95% van de doorlopen wél soepel verloopt."
              proof_stage: designed
              proof_method: "Redenering: de connect-stap heeft een expliciet doorgaan-zonder-koppeling-pad en gap-fill een 'toch doorgaan'-optie bij fouten; per_segment betekent dat élke stap afzonderlijk wordt getoetst, nooit de flow als geheel gemiddeld. Latere test doorloopt elke stap met geforceerde fout."
              proof_result: not_yet_tested
      tolerances:
        - "Aantal en volgorde van optionele vervolgvragen mag variëren per persoon (adaptieve selectie), zolang de catalogus vast en overslaanbaar blijft."
      unknown_data_policy: "Niet-ingevulde velden blijven leeg of worden als expliciet gemarkeerde schatting geseed; een schatting wordt nooit stilzwijgend een 'gemeten' waarde. Wat de gebruiker weigert te delen wordt niet opnieuw bij elke sessie afgedwongen."
      approved: false

