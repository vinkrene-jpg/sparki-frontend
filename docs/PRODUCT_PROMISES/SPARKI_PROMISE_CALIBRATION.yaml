          applicability: "Enige route naar native Garmin-data (ritten binnenhalen) en course-push (routes naar het apparaat) — precies de twee beloofde functies."
        - name: "Wahoo Cloud API"
          coverage: "Workouts/ritten en route-upload (multipart GPX naar /v1/routes) voor Wahoo-fietscomputers. Dekt NIET: gezondheidsdata; toegang vereist eveneens developer-goedkeuring."
          actuality: "Levende API v1; implementatie uit publieke docs (2026), live nooit gevalideerd."
          license_status: "Developer-programma met goedkeuring; commerciële voorwaarden pas bij toelating definitief; webhook-verificatie via webhook_token in de body."
          limitations:
            - "Kleinere ecosysteem-dekking dan Garmin; documentatie dunner, groter risico op contract-afwijkingen."
          applicability: "Zelfde twee functies als Garmin, voor Wahoo-gebruikers (o.a. ELEMNT-computers)."
      sources_in_use: []
      privacy_status: unknown
      missing_information:
