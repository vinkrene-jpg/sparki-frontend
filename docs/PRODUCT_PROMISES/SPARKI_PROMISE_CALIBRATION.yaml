              proof_result: not_yet_tested
      tolerances:
        - "Inhaal-afkoelperiode 15 min per atleet; inhaalvenster laatste-sync −48u overlap (dedupe absorbeert), anders 30 dagen terug."
        - "Vers-grens: precies 24u oud telt nog als vers (inclusieve grens)."
      unknown_data_policy: "Ontbrekende velden in een Strava-activiteit blijven null (nooit schatten); events voor onbekende externe gebruikers worden eerlijk als 'skipped' geboekt, nooit als fout richting Strava (dat zou eindeloos herleveren)."
      approved: false

