              proof_stage: designed
              proof_method: "Redenering: upsert gebruikt COALESCE(EXCLUDED.kolom, bestaande kolom) voor velden die een partiële sync mag weglaten; dit was een eerder daadwerkelijk opgetreden bug (webhooks werden onherleidbaar). Latere test: webhook-sync zonder id → veld ongewijzigd."
              proof_result: not_yet_tested
        - rule: "Een ingetrokken Strava-autorisatie mag nooit tot verdere data-ophaling leiden."
          rule_type: hard_blockage
          measurement_level: per_sessie
          aggregate_justification: ""
          counterexamples:
            - case: "Atleet ontkoppelt in Sparki; een uur later komt nog een webhook-event voor die atleet binnen."
              proof_stage: designed
              proof_method: "Redenering: webhook-resolutie matcht alleen koppelingen met status 'connected'; ontkoppeld ⇒ eerlijke skip. Latere test: disconnect → webhook → skipped-boeking, 0 API-calls naar Strava."
              proof_result: not_yet_tested
        - rule: "Sync-pogingen mogen het gedeelde rate-limit nooit ongeremd opeten bij een aanhoudende storing."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
