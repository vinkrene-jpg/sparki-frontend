        - "Wisselhysterese van 120 s voorkomt zenuwachtig springen tussen aansluitpunten (ontwerpkeuze, praktisch onbewezen)."
      unknowns:
        - "Praktijkgedrag bij slechte mobiele dekking van de volgauto."
      evidence_method:
        - "Gesimuleerde rit (fiets- + autopositie-replay) + één echte praktijkrit met volgauto."

    rene_calibration:
      questions:
        - question: "Is een ruwe geschatte ETA (zonder file-informatie) goed genoeg voor de volgauto-belofte, of wil je verkeersbewuste ETA's (NDW-traject) vóór dit 'gereed' mag heten?"
          answer_rene: >-
            Ruwe schatting is goed genoeg mits eerlijk 'geschat' erbij. Uitgediepte gewenste
            scope (2026-07-30) — René vindt de huidige module absoluut onvoldoende uitgebouwd.
            Doelgroep: training én wedstrijd; chauffeurs: ploegleider, mechanieker, ouder,
            vrijwilliger. Alles gewenst: echte autoroute-navigatie voor de chauffeur naar het
            volgende ontmoetingspunt; slimme ontmoetingspunten vooraf plannen langs de
            fietsroute; actieve meldingen aan de chauffeur (renner nadert, renner gestopt,
            val-alarm); meerdere volgauto's/begeleiders tegelijk; kort signaal renner↔auto
            (bv. 'bidon nodig'); achteraf terugkijken hoe de volgrit verliep. Bestaande harde
            grens blijft: de fietsroute wordt door volgauto-functionaliteit nooit gewijzigd.
      completed: true # uitgediept en beantwoord 2026-07-30 — gewenste scope is een forse uitbouw; huidige module telt niet als 'gereed' voor deze belofte

    acceptance_contract:
      hard_reject_rules:
        - rule: "De fietsroute mag door volgauto-functionaliteit nooit worden gewijzigd."
          rule_type: hard_blockage
          measurement_level: per_sessie
          aggregate_justification: ""
          counterexamples:
            - case: "Auto-rejoin zou de fietsroute-endpoints hergebruiken en de fietslijn aanpassen."
              proof_stage: designed
              proof_method: "Redenering: volgautoplan is een aparte datalaag; auto-rejoin gebruikt uitsluitend driving-car. Latere test: byte-vergelijking fietsgeometrie vóór/na planning."
              proof_result: not_yet_tested
        - rule: "Een ETA zonder bruikbaar aansluitpunt (carKm null) of zonder recente positie mag nooit als getal worden getoond."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "Aansluitpunt waar de auto niet ≤150 m komt; systeem zou toch een ETA rekenen."
              proof_stage: designed
              proof_method: "Redenering: carKm nullable ⇒ ETA-berekening retourneert null (vastgelegde contract-les). Latere unit-test op de ETA-functie met carKm=null en met positie ouder dan 3 min."
              proof_result: not_yet_tested
      tolerances:
        - "Aansluitpunt geldig ≤150 m; positie vers ≤3 min; wissel pas na 120 s aanhoudende voorkeur."
      unknown_data_policy: "Geen recente positie of geen bereikbaar aansluitpunt = eerlijk 'geen positie'/'geen ETA'; nooit doorrekenen op oude of ontbrekende data."
      approved: false

    validation:
      automated_tests: []
      independent_checks: ["positie-replay-simulatie (te bouwen)"]
      practice_test_required: true
      practice_testers: ["René (als volgauto-bestuurder)", "Dylan (als renner)"]
      result: not_tested
      expectation_gap:
        - "Hele module is praktisch onbeproefd met een echte auto — grootste gat van dit onderwerp."
    product_proof:
      score: null
      status: not_proven
      evidence_refs: []
    next_action:
      type: research_or_build_or_retest
      description: "ETA-kalibratievraag beantwoorden; daarna één begeleide praktijkrit met volgauto als eerste echt bewijs."
      approved_for_execution: false

# ---------------------------------------------------------------------------
# Hoofdstuk H — Data, koppelingen en synchronisatie
# Opgesteld: 2026-07-30 (opdracht v2, los aangeleverd document). Alleen dit
# hoofdstuk; geen productcode gewijzigd. Scope: Data Hub, Strava,
# Garmin/Wahoo (voorbereid), bestandimport, Bluetooth-sensoren.
# ---------------------------------------------------------------------------

chapter_h_data_koppelingen_en_synchronisatie:

  - id: DATA_HUB_001
    module: "Data, koppelingen en synchronisatie"
    subject: "Data Hub — centrale ingest, deduplicatie, herkomst en consent voor alle databronnen"
    status: needs_calibration

    current_state:
      technical_status: implemented
      source_snapshot: 2026-07-30
      evidence_status: "Deels: geautomatiseerde ketentests bestaan en draaien groen (cross-source-dedupe-test bewijst dat dezelfde rit uit twee bronnen tot één sessie met beide bronnen samensmelt; betrouwbaarheidsketentest met 12 scenario's bewijst rollback-per-activiteit, doorlopen-bij-één-kapotte-activiteit en eerlijke 'partial'-status). Geen onafhankelijke proof-run tegen een vastgelegde belofte; geen praktijkbewijs met twee echte gelijktijdige bronnen bij één atleet."
      practice_status: "In de praktijk draait vrijwel alles via Strava als enige actieve bron; het meerbronnen-samensmeltpad is vooral synthetisch getest, nauwelijks met echte parallelle koppelingen."
      known_limitations:
        - "Dedupe-sleutel is sport + starttijd afgerond op 5 minuten, met buurvak-matching en ~20% duur/afstand-tolerantie; twee ECHT verschillende activiteiten van dezelfde sport die binnen ~5 minuten starten en op elkaar lijken kunnen theoretisch onterecht samensmelten."
        - "Consent is default-grant: een datatype is toegestaan tenzij er expliciet een geweigerde rij bestaat. Activiteiten-ingest vereist wél een dubbele EN-toestemming (activiteiten ÉN trainingshistorie), zodat intrekken van één van beide altijd blokkeert."
        - "Per-veld-herkomst (fieldSources) is first-source-wins; handmatige correcties zijn alleen beschermd als het schrijfpad ze in manualFields markeert — een vergeten markering betekent dat de volgende sync een correctie stil terugdraait."
        - "Sync-telling (nieuw/samengevoegd/fouten) is eerlijk per run, maar er is geen dashboard dat verloop over runs bewaakt; stille achteruitgang van een bron valt alleen op bij klachten."
        - "Productie-schemadrift is eerder voorgekomen (nieuwe hub-tabellen niet gepusht); er is geen automatische bewaking dat dev- en prod-schema gelijk lopen."

    proposed_promise:
      text: "Alles wat over je training binnenkomt — via een koppeling, een bestand of je telefoon — komt in één administratie terecht. Dezelfde rit die uit twee bronnen binnenkomt wordt één rit, met zichtbaar welke bron wat leverde. Wat jij zelf corrigeert, blijft staan. Als een deel van een synchronisatie mislukt, gaat de rest gewoon door en is de uitkomst eerlijk 'gedeeltelijk gelukt' — nooit stilletjes half."
      proposed_by: replit
      rationale: "Dit is de fundering onder elk ander hoofdstuk: analyses, belastingsmodel en coaching zijn maar zo goed als de administratie eronder. De wereldmarkt-lat hier is Strava/intervals.icu-niveau samensmelting zonder dubbele ritten en zonder verlies van handmatige correcties."
      rene_approved: false

    external_intelligence:
      research_required: true
      candidate_sources:
        - name: "Eigen canonieke datamodel (training_sessions + connector_activities + sync_runs)"
          coverage: "Dekt alle bronnen die door de hub lopen (Strava, bestand, mobiele ritten; Garmin/Wahoo zodra sleutels bestaan). Dekt NIET: data die buiten de hub om geschreven wordt — dat is per doctrine verboden maar niet technisch afgedwongen."
          actuality: "Live eigen database; schema wijzigt mee met het product."
          license_status: "Eigen data van de atleet; verwerking privacy-gated via consent-rijen; geen externe licentie."
          limitations:
            - "Herkomst is zo betrouwbaar als het schrijfpad; paden die manualFields vergeten breken de bescherming stil."
            - "merge_log is intern en begrensd (laatste 20), dus geen volledige historie."
          applicability: "De administratie zelf: dedupe, herkomst per veld, samensmeltlog en sync-boekhouding worden hierop uitgevoerd en gemeten."
        - name: "Officiële API-documentatie van bronplatforms (Strava/Garmin/Wahoo) + bestandspecificaties (FIT/GPX/TCX)"
          coverage: "Definieert per bron welke velden bestaan en hoe betrouwbaar ze zijn (bv. vermogen uit meter vs geschat). Dekt NIET: hoe bronnen zich in de praktijk gedragen bij drift (zelfde rit, licht afwijkende duur/afstand/starttijd per platform)."
          actuality: "Levende documentatie; Strava API v3, Garmin/Wahoo cloud-API's wijzigen op fabrikantsritme; FIT SDK meermaals per jaar, GPX 1.1 (2004, stabiel), TCX v2 (stabiel)."
          license_status: "Documentatie vrij raadpleegbaar; API-gebruik onder platform-voorwaarden (per onderwerp hieronder uitgewerkt)."
          limitations:
            - "Geen enkele bron documenteert cross-platform-drift; onze 5-minuten/20%-toleranties zijn eigen empirie, geen standaard."
          applicability: "Bepaalt de bronprioriteit per veld (zie replit_definition) en welke velden per bron eerlijk 'ontbreekt' moeten blijven."
      sources_in_use:
        - "Eigen canonieke datamodel — de enige plek waar dedupe/herkomst/consent afgedwongen wordt (single runSync-pad)."
        - "Platform-API-docs + bestandspecificaties — als ontwerpbasis voor veldmapping en bronprioriteit."
      privacy_status: unknown
      missing_information:
        - "Empirische meting van fout-samensmelting (twee echte verschillende activiteiten die onterecht mergen) ontbreekt volledig."
        - "Geen inventarisatie of álle schrijfpaden naar training_sessions daadwerkelijk door de hub lopen (doctrine vs afdwinging)."
        - "Privacy-/bewaartermijnkader per bron (wat mag hoe lang bewaard, ook na ontkoppelen) is niet formeel vastgelegd."

    replit_definition:
      objective_quality_standard: "Per activiteit: dezelfde rit uit N bronnen levert exact 1 sessie met N herkomstrijen; 0 verloren handmatige correcties na een sync; elke sync-run eindigt met een eerlijke status (success/partial/failed) waarvan de tellers optellen; 0 activiteiten geïngest zonder geldige EN-toestemming."
      recommended_default: "Bronprioriteit per veld: (1) directe sensormeting (vermogensmeter/HR-band) boven platformschatting; (2) het platform dat het veld native meet boven een doorgever; (3) handmatig door de atleet gezet wint ALTIJD van elke sync (manualFields heilig). Dedupe: sleutel grof houden (sport + 5-min-vak), disambiguatie via tolerantie-guard, nooit duur/afstand in de sleutel."
      technical_limits:
        - "Herkomst per veld is first-source-wins; met terugwerkende kracht van bronvoorrang wisselen vergt her-ingest, dat pad bestaat niet."
        - "Dedupe kan alleen zien wat binnenkomt; een bron die starttijden >7,5 min laat driften ontsnapt aan de buurvak-matching."
      assumptions:
        - "Platform-drift voor dezelfde rit blijft binnen ~5 min starttijd en ~20% duur/afstand (empirie Garmin↔Strava)."
      unknowns:
        - "Fout-samensmeltkans bij intervalachtige korte activiteiten kort na elkaar (zelfde sport, zelfde kwartier)."
        - "Gedrag bij een atleet met 3+ gelijktijdige actieve bronnen (nooit in praktijk gezien)."
      evidence_method:
        - "Bestaande geautomatiseerde ketentests (cross-source dedupe, betrouwbaarheid/rollback) her-runnen als onafhankelijke proof met vastgelegde uitkomst."
        - "Nieuw te ontwerpen tegenvoorbeeld-set: echte-verschillende-activiteiten die NIET mogen mergen (zie acceptance_contract)."
        - "Praktijkbewijs: één atleet met twee echte bronnen tegelijk (bv. Strava + bestandsupload van dezelfde rit) gedurende een week."

    rene_calibration:
      questions:
        - question: "Hoeveel synchronisatie-detail wil je dat een atleet ziet: alleen 'laatste sync + gelukt/mislukt', of ook per rit welke bron welk veld leverde (herkomst zichtbaar in de app)?"
          answer_rene: "Per rit zichtbaar welke bron welk gegeven leverde (herkomst in de app)." # beantwoord 2026-07-30
        - question: "Als twee bronnen een verschillend getal geven voor hetzelfde veld (bv. Strava zegt 250 W gemiddeld, het bestand zegt 243 W): wil je vaste bronvoorrang (stil), of wil je dat Sparki het conflict toont en jou laat kiezen?"
          answer_rene: "Sparki kiest zelf de beste bron, maar het conflict moet bij de rit terug te vinden zijn (stil met inzicht)." # beantwoord 2026-07-30
        - question: "Wanneer moet een sync-fout ACTIEF gemeld worden (melding/badge), en wanneer is stil herstellen bij de volgende poging goed genoeg? Bijvoorbeeld: pas melden na X dagen zonder geslaagde sync?"
          answer_rene: "Meteen bij elke mislukte sync — René wil alles weten." # beantwoord 2026-07-30
      completed: true # alle 3 vragen beantwoord 2026-07-30

    acceptance_contract:
      hard_reject_rules:
        - rule: "Twee verschillende activiteiten mogen nooit tot één sessie samensmelten."
          rule_type: hard_blockage
          measurement_level: per_sessie
          aggregate_justification: ""
          counterexamples:
            - case: "Twee korte fietsritten van dezelfde atleet, start 4 minuten na elkaar (warming-up 20 min + wedstrijd 25 min), uit twee bronnen."
              proof_stage: designed
              proof_method: "Redenering: starttijden vallen in hetzelfde/aangrenzende 5-min-vak, dus de sleutel botst; de tolerantie-guard (duur/afstand ~20%) moet ze scheiden omdat 20 vs 25 min binnen 20% valt — dit is dus een GRENSGEVAL dat de huidige guard mogelijk NIET weigert. Latere geautomatiseerde test met exact dit scenario moet uitwijzen of de guard scherp genoeg staat."
              proof_result: not_yet_tested
        - rule: "Een handmatig door de atleet gecorrigeerd veld mag door geen enkele latere sync worden overschreven."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "Atleet zet FTP-gerelateerd sessieveld handmatig leeg; de volgende Strava-sync levert voor dat veld een waarde."
              proof_stage: designed
              proof_method: "Redenering: buildMergePatch slaat manualFields over, óók bewust leeggemaakte velden; updateFieldSources negeert null-writes. Latere unit-test: PUT met leegmaking → sync → veld blijft leeg."
              proof_result: not_yet_tested
        - rule: "Zonder geldige toestemming (activiteiten ÉN trainingshistorie) wordt geen enkele activiteit opgeslagen."
          rule_type: hard_blockage
          measurement_level: per_sessie
          aggregate_justification: ""
          counterexamples:
            - case: "Atleet trekt alleen 'trainingshistorie' in terwijl 'activiteiten' toegestaan blijft; daarna komt een webhook-sync binnen."
              proof_stage: designed
              proof_method: "Redenering: ingest-poort is een EN-voorwaarde (activitiesIngestAllowed), dus één ingetrokken type blokkeert; importedDataTypes wordt gefilterd zodat de koppeling niet vals claimt data te hebben opgeslagen. Latere test: consent-rij granted=false op één type → sync → 0 nieuwe sessies + eerlijke skipped-telling."
              proof_result: not_yet_tested
        - rule: "Een sync-run waarvan een deel mislukt mag nooit als volledig geslaagd worden geboekt."
          rule_type: hard_blockage
          measurement_level: per_sessie
          aggregate_justification: ""
          counterexamples:
            - case: "Batch van 10 activiteiten waarvan nr. 6 een kapotte payload heeft die pas ná de sessie-insert breekt."
              proof_stage: designed
              proof_method: "Reeds als geautomatiseerde ketentest gebouwd (betrouwbaarheidstest, 12 scenario's: rollback per activiteit, run eindigt 'partial' met errorSamples); voor dit contract geldt hij pas als executed na een her-run met vastgelegd resultaat als proof-artefact."
              proof_result: not_yet_tested
      tolerances:
        - "Dedupe-matching: starttijd binnen aangrenzende 5-minuten-vakken; duur/afstand-verschil ≤ ~20% geldt als 'plausibel dezelfde rit'."
      unknown_data_policy: "Een veld dat geen enkele bron levert blijft null en wordt overal als 'ontbreekt' getoond; nooit een schatting stilletjes als meting opslaan. Onbekende herkomst = geen herkomstclaim."
      approved: false

    validation:
      automated_tests:
        - "test:data-hub (cross-source dedupe) — bestaat, groen"
        - "test:data-reliability (12 scenario's rollback/partial) — bestaat, groen"
      independent_checks: ["Onafhankelijke proof-run met vastgelegde uitkomst tegen dit contract — nog te doen"]
      practice_test_required: true
      practice_testers: ["René (twee echte bronnen tegelijk, week lang)"]
      result: not_tested
      expectation_gap:
        - "Grootste gat: fout-samensmelting (regel 1) is nooit met een tegenvoorbeeld getest; het grensgeval hierboven kan de huidige guard mogelijk passeren."
    product_proof:
      score: null
      status: not_proven
      evidence_refs: []
    next_action:
      type: research_or_build_or_retest
      description: "Tegenvoorbeeld-set voor fout-samensmelting bouwen en draaien; daarna René's drie kalibratievragen verwerken in het meldings-/herkomstontwerp."
      approved_for_execution: false

  - id: DATA_STRAVA_001
    module: "Data, koppelingen en synchronisatie"
    subject: "Strava-koppeling — per-gebruiker OAuth, webhook-gedreven sync en leespad-inhaalslag"
    status: needs_calibration

    current_state:
      technical_status: implemented
      source_snapshot: 2026-07-30
      evidence_status: "Deels: geautomatiseerde tests dekken webhook-verwerking (gerichte fetch zonder list/profiel-call), busy-gating (twee gelijktijdige syncs → precies één draait), token-refresh en de leespad-inhaalslag met 15-minuten-afkoelperiode. Praktijkbewijs: René's eigen Strava-account synchroniseert al maanden echt. NIET bewezen: gedrag onder Strava-storing van dagen en rate-limit-plafondgedrag onder veel gebruikers."
      practice_status: "In productie de enige echte platformkoppeling; er is één bekende maand-lange stille bevriezing geweest doordat de webhook-registratie in productie ontbrak — sindsdien vangt de leespad-inhaalslag dit op, maar de webhook-registratie zelf blijft een handmatige operationele stap."
      known_limitations:
        - "Webhook-registratie (push_subscriptions bij Strava) is een handmatige API-stap per omgeving; ontbreekt die, dan is er geen push en leunt alles op de leespad-inhaalslag (Vandaag/Activiteiten openen)."
        - "Inhaalslag heeft een 15-minuten-afkoelperiode per gebruiker om het gedeelde app-rate-limit te sparen; een atleet die net na een rit de app opent kan die rit dus tot ~15 min later zien als de vorige poging faalde."
        - "Strava-rate-limits gelden per APP (alle gebruikers samen, 15-minuten- en dagvenster); bij groei is er geen quotabewaking of prioritering ingebouwd."
        - "Toestemming-verlopen (token verlopen zonder refresh-token) wordt gedetecteerd en als 'verbind opnieuw' getoond, maar niet actief gemeld — de atleet moet het scherm zelf openen."
        - "Alleen door Strava daadwerkelijk verleende scopes worden opgeslagen; een atleet die vinkjes uitzet krijgt een eerlijk beperkte koppeling, maar er is geen uitleg welke functies daardoor uitvallen."
    proposed_promise:
      text: "Koppel je Strava één keer en je ritten staan er daarna vanzelf in — meestal binnen enkele minuten na uploaden bij Strava. Werkt dat even niet (storing, verlopen toestemming), dan haalt Sparki het gemiste alsnog op zodra je de app opent, en zie je eerlijk wat de status van je koppeling is. Sparki slaat alleen op waarvoor jij toestemming gaf."
      proposed_by: replit
      rationale: "Strava is de facto de bron waar fietsers hun data al hebben; naadloze, eerlijke sync is de instapvoorwaarde om Sparki naast/boven Strava te gebruiken. Marktlat: intervals.icu-achtige betrouwbaarheid (webhook + inhaal, nooit stil bevriezen)."
      rene_approved: false

    external_intelligence:
      research_required: true
      candidate_sources:
        - name: "Strava API v3 (developers.strava.com) incl. Webhook Events API"
          coverage: "Activiteiten, atleetprofiel, streams; push-events bij nieuwe/gewijzigde/verwijderde activiteiten en bij intrekken van toestemming. Dekt NIET: historische data ouder dan wat de atleet op Strava heeft, en geen gezondheidsdata (slaap/HRV)."
          actuality: "Live API v3; wijzigt zelden maar Strava heeft in het verleden scopes en voorwaarden eenzijdig aangescherpt (o.a. AI-gebruiksbeperkingen in de API-voorwaarden, 2024)."
          license_status: "Gratis developer-programma met eigen client-ID/secret; commerciële toepassing toegestaan binnen de Strava API Agreement — die verbiedt o.a. het doorleveren van Strava-data aan derden en stelt beperkingen aan AI-training op Strava-data; per-app rate-limits (15-minuten- en dagvenster, standaard laag en op aanvraag te verhogen)."
          limitations:
            - "Rate-limit is per app, niet per gebruiker — één drukke gebruiker eet het budget van iedereen."
            - "Webhook levert alleen een verwijzing (object-id), geen data; elke event kost dus alsnog een API-call."
            - "Strava kan scopes/voorwaarden wijzigen; AI-gerelateerde voorwaarden vereisen periodieke hercheck vóór commerciële uitrol."
          applicability: "Enige bron voor de Strava-koppeling: OAuth, gerichte activity-fetch per webhook-event, inhaal-listing bij gemiste periodes."
        - name: "Strava API Agreement / Brand Guidelines"
          coverage: "Juridisch kader: wat mag met Strava-data (weergave, opslag, AI), verplichte attributie en 'Connect with Strava'-knopvormgeving. Dekt NIET: technisch gedrag."
          actuality: "Door Strava eenzijdig aanpasbaar; laatst bekende materiële aanscherping 2024; hercheck nodig vóór commerciële lancering."
          license_status: "Bindend contract bij API-gebruik; niet-naleving = intrekking API-toegang."
          limitations:
            - "AI-analysebepalingen zijn breed geformuleerd; onduidelijk waar Sparki's AI-coaching precies onder valt."
          applicability: "Bepaalt of Sparki's AI-analyses op Strava-data commercieel zijn toegestaan — dit is een blokkerende onzekerheid vóór betaalde uitrol, geen detail."
      sources_in_use:
        - "Strava API v3 + Webhook Events — volledige koppeling draait hierop."
      privacy_status: unknown
      missing_information:
        - "Actuele juridische duiding of Sparki's AI-coaching op Strava-data binnen de 2024-voorwaarden valt (blokkerend vóór commerciële uitrol)."
        - "Het exacte huidige rate-limit-quotum van onze app en het aanvraagpad voor verhoging zijn niet vastgelegd."
        - "Gedrag bij Strava's 'deauthorize'-webhook (atleet trekt toegang in op Strava-zijde) is niet als tegenvoorbeeld getest."

    replit_definition:
      objective_quality_standard: "Per nieuwe Strava-activiteit: zichtbaar in Sparki ≤5 min na het webhook-event (bij werkende webhook), of uiterlijk bij de eerstvolgende app-opening +15 min afkoel bij inhaal; 0 stille bevriezingen langer dan 24 uur zonder eerlijke statusmelding op de koppelingenpagina; 0 identiteitsvelden gewist door partiële syncs."
      recommended_default: "Webhook-eerst met leespad-inhaalslag als vangnet (bestaand); toestemming-verlopen en >24u-zonder-geslaagde-sync worden zichtbaar op de koppelingenpagina; actieve melding pas na René's kalibratiekeuze."
      technical_limits:
        - "Zonder geregistreerde webhook is 'binnen enkele minuten' onhaalbaar; dan geldt alleen de app-open-inhaal."
        - "Strava levert geen data in het webhook-event zelf; elke rit kost minimaal één API-call binnen het gedeelde quotum."
      assumptions:
        - "De webhook-registratie wordt bij elke productie-omgeving als vaste operationele stap uitgevoerd en gecontroleerd (nu handmatig)."
      unknowns:
        - "Rate-limit-gedrag bij >50 actieve gekoppelde atleten (nooit gemeten)."
