              proof_stage: designed
              proof_method: "Logica-doorloop: forbiddenFlags per meetpunt ⇒ forbiddenKm=0.2 ⇒ verdict 'afgeraden' met reden 'fietsen niet toegestaan'; scenario zit in de unit-suite, telt als executed na de eerstvolgende run in de bouwfase."
              proof_result: not_yet_tested
        - rule: "Het scherm mag nooit 'volledig verhard' tonen terwijl de motor-meting van dezelfde route onverhard registreerde (tegenspraakverbod)."
