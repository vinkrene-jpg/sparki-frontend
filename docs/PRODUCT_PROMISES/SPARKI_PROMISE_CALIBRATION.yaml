      objective_quality_standard: "Koppelen kan alleen aan een eigen sessie van exact dezelfde datum; elk oordeel is reproduceerbaar uit dezelfde inputs; een pijn-/moe-feedback levert nooit een voorstel met hogere duur of TSS; coach-trainingen worden nooit automatisch inhoudelijk gewijzigd."
      recommended_default: "Voorstel-flow (mens beslist) voor alles wat de committed week raakt; automatische bijstelling alleen op voorlopige plandagen (huidig gedrag). 'Te licht' leidt pas na tweemaal of een duidelijk patroon tot een verzwaringsvoorstel (Besluit René 30-07-2026; BOUWOPGAVE — nu al bij één melding); een toegepaste wijziging blijft zichtbaar als 'aangepast t.o.v. origineel' inclusief reden, nooit stille vervanging (Besluit René 30-07-2026). Besluitniveau (advies/voorstel/automatisch): feedback leidt altijd tot een voorstel, nooit tot automatische aanpassing van een training; het uitvoeringsoordeel bij koppelen is een automatische registratie die niets aan het plan wijzigt."
