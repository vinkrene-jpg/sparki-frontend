  - id: TRAIN_GEZONDHEID_001
    module: "Training, coaching en analyse"
    subject: "Gezondheid & herstel — status, readiness en veilige terugkeer"
    status: needs_calibration

    current_state:
      technical_status: implemented
      source_snapshot: 2026-07-30
      evidence_status: "Redelijk: de health-flow is contractueel getest (status alleen omhoog via melding, herstel uitsluitend via de resume-gate met 409 bij 'niet trainen', dagelijkse check-in vraagt alleen ontbrekende metingen, cross-account 404, historie). Ziek/geblesseerd blokkeert plandruk en neemt Vandaag over. Ontbreekt: bewijs dat backend- en web-readiness dezelfde werkelijkheid tonen (labels en inputs verschillen) en praktijkbewijs van een echte ziekte-/herstelcyclus."
      practice_status: "In gebruik; een echte volledige ziekte→herstel→opbouw-cyclus is nooit tegen vastgelegde verwachtingen gevolgd."
      known_limitations:
        - "Backend- en web-readiness verschillen: backend kent fresh/ok/tired, de web-state toont PRIMED/GOED/MATIG/LAAG en telt HRV niet mee in de score ondanks het type — twee bijna-gelijke waarheden."
        - "Er is geen echte gezondheidsdata-ingest via connectors (HEALTH_INGEST_PROVIDERS leeg); de dagelijkse beoordeling leunt op zelfrapportage."
        - "Sensorafwijking-signaal (RHR +10% bij ≥5 metingen) is expliciet géén diagnose — de grens tussen signaal en medische suggestie moet in copy bewaakt blijven."

    proposed_promise:
      text: "Bij een harde medische of acute blokkade gaat bij Sparki alles opzij: geen trainingsdruk, geen plan dat doordramt. Bij een niet-acute klacht of in een herstelfase blijft alleen aangepaste belasting over, binnen vooraf vastgelegde veiligheidscriteria. Beter melden gaat bewust via een korte herstelcheck, en daarna bouwt Sparki trapsgewijs en criteriagestuurd op — nooit in één keer automatisch terug naar volledig normaal. Bij duidelijke gezondheidsrisico's weegt veiligheid zwaarder dan wat sporter of coach op dat moment wil. Sparki stelt nooit een diagnose en doet nooit alsof: het signaleert alleen wat jouw eigen metingen en meldingen laten zien, en vraagt per dag alleen wat het nog niet weet."
      proposed_by: replit
      rationale: "Gezondheid is de enige plek waar een fout advies echt schade doet; raises-only + resume-gate is daarom bewust asymmetrisch (makkelijk ziek melden, bewust beter melden). Dit is ook juridisch de veilige lijn: signaleren, nooit diagnosticeren."
      rene_approved: false

    external_intelligence:
      research_required: true
      candidate_sources:
