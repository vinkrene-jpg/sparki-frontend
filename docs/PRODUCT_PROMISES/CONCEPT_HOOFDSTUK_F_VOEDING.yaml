      recommended_default: "Sessie-engine als enige rekenbron ook voor racedagen aanwijzen en race-intel daarop laten consumeren (bouwopgave); tot die tijd de inconsistentie eerlijk zichtbaar maken in plaats van verhullen."
      technical_limits:
