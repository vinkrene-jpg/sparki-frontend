# ---------------------------------------------------------------------------
# CONCEPT — Hoofdstuk F: Voeding, hydratatie en gewicht
# Status: CONCEPT, NIET GECOMMIT in het kalibratiebestand. Opgesteld 2026-07-30
# op basis van een alleen-lezen inventarisatie (geen productcode gewijzigd).
# Alle kalibratievragen staan open (answer_rene leeg, completed: false) —
# er is niets namens René beantwoord.
# Conform opdracht v2: measurement_level + counterexamples per regel;
# uitsluitend proof_stage "designed" + proof_result "not_yet_tested".
# ---------------------------------------------------------------------------

chapter_f_voeding_hydratatie_en_gewicht_CONCEPT:

  # -------------------------------------------------------------------------
  # F1 — Richtwaarden per training (fueling engine)
  # -------------------------------------------------------------------------
  - id: VOED_RICHTWAARDEN_001
    module: "Voeding, hydratatie en gewicht"
    subject: "Deterministische voedingsrichtwaarden per training — vóór, tijdens en na"
    status: needs_calibration

    current_state:
      technical_status: implemented
      source_snapshot: 2026-07-30
      evidence_status: "De kern is een deterministische engine (computeSessionFuelTargets in api-server lib/fueling.ts): koolhydraten per uur op basis van duur en intensiteit (kort <75 min: geen tijdens-doel; >150 min: 60–90 g/u; intensief (wedstrijd of TSS/uur ≥70): 45–60 g/u; anders 30–60 g/u), pre-training 1–2 g/kg, herstel 1–1,2 g/kg koolhydraten + 0,25–0,4 g/kg eiwit (gewichtsafhankelijk, afgerond op 5 g). TSB ≤ −20 voegt herstel-nadruk toe (volwaardige maaltijden, nooit tekort). Coach-instructies (max 3, keyword-gefilterd uit actieve coach-context) gaan altijd letterlijk voorop. De LLM krijgt de berekende richtwaarden als leidend blok en mag alleen verwoorden, nooit rekenen. Tests bestaan voor de engine en de seizoensdoel-doorwerking (test:afvaldoel-touchpoints), maar er is geen onafhankelijke proof-run tegen een vastgelegde belofte."
      practice_status: "In gebruik via de Voeding-sheet (sessie-richtwaarden, vier-fasen-plan: voorbereiding/tijdens/direct herstel/later herstel) en via /api/nutrition/session-targets in het dagadvies."
      known_limitations:
        - "Onbekende duur ⇒ eerlijk gat (null) in plaats van een aanname — correct, maar de gebruiker ziet niet altijd waaróm er geen getal staat."
        - "Voorkeuren (allergieën, producten, maag/darm) worden alleen meegenomen bij expliciete toestemming (consentAt); zonder toestemming zijn adviezen generieker zonder dat de gebruiker dat ziet."
        - "Productvoorbeelden (gel ~25 g, reep ~40 g, sportdrank 30–40 g) zijn hardcoded vuistwaarden, geen productdatabase."
        - "Geen cafeïnelogica aanwezig (bewust of niet — nooit vastgelegd)."
        - "Gezondheidsstatus (ziek/geblesseerd) onderdrukt de voedingsrichtwaarden niet; de koppeling loopt alleen indirect via het (wegvallende) trainingsplan."

    proposed_promise:
      text: "Voor elke training krijg je concrete, uitlegbare richtwaarden voor vóór, tijdens en na — berekend uit jouw echte training, gewicht en belasting, nooit door een taalmodel verzonnen. Wat Sparki niet weet (duur onbekend, gewicht ontbreekt) zie je als eerlijk gat, nooit als aanname. Instructies van jouw coach gaan altijd voor."
      proposed_by: replit
      rationale: "Voedingsadvies is veiligheidsgevoelig terrein; de bestaande honest-numbers-regel (deterministisch rekenen, LLM alleen verwoorden) is precies wat een belofte hier verdedigbaar maakt."
      rene_approved: false

    external_intelligence:
      research_required: true
      candidate_sources:
        - name: "Eigen fueling-engine + trainings-/belastingsdata (sessies, gepland werk, TSB)"
          coverage: "Dekt duur, intensiteit, race-context, gewicht, belastingstoestand. Dekt NIET: werkelijke individuele tolerantie (maag/darm-training) en werkelijke inname buiten de logs."
          actuality: "Live eigen code en data."
          license_status: "Eigen werk / eigen data van de atleet."
          limitations:
            - "Richtwaardenbanden zijn vuistregels op richtlijnniveau, geen individuele diëtetiek."
          applicability: "De richtwaarden zelf en de koppeling aan training/herstel."
        - name: "Sportvoedingsrichtlijnen voor duursport (o.a. ACSM/IOC position stands; Jeukendrup-koolhydraatinname-literatuur)"
          coverage: "Dekt gangbare inname-banden per uur naar duur/intensiteit en herstelverhoudingen. Dekt NIET: individuele medische situaties."
          actuality: "Position stands, herzien op meerjarencadans; stabiele kennis."
          license_status: "Vrij toepasbaar als onderbouwing; geen tekstovername."
          limitations:
            - "Banden verschillen licht per bron; de eigen keuze (bijv. 60–90 bij >150 min) moet als eigen keuze binnen het richtlijnbereik benoemd blijven."
          applicability: "Onderbouwt (of corrigeert) de gekozen banden en de afwezigheid/aanwezigheid van cafeïne-advies."
      sources_in_use:
        - "Eigen fueling-engine — leidend en enige rekenbron."
      privacy_status: unknown
      missing_information:
        - "Geen vastgelegde onderbouwing per band (welke bron hoort bij welke bandkeuze)."
        - "Geen besluit over cafeïne: bewust weggelaten of gat?"

    replit_definition:
      objective_quality_standard: "Alle getallen in elk voedingsadvies zijn herleidbaar tot de deterministische engine of tot een coach-instructie; 0 door het taalmodel gerekende of afgeronde getallen; ontbrekende invoer levert een zichtbaar gat met reden, nooit een stille aanname; trainingen worden nooit ondervoed geadviseerd, ongeacht enig doel."
      recommended_default: "Huidige engine handhaven als enige rekenbron; consent-gated voorkeuren blijven fail-closed; coach-instructies blijven letterlijk en voorop; bij ontbrekende duur/gewicht eerlijk gat tonen met de reden en één duidelijke actie om het gat te vullen."
      technical_limits:
        - "Zonder gewicht geen pre-/herstelrichtwaarden (gewichtsafhankelijk)."
        - "Zonder geplande training of race geen sessie-richtwaarden (eerlijke null met reden)."
      assumptions:
        - "De gekozen banden liggen binnen gangbare richtlijnen; dit is aannemelijk maar niet per band gedocumenteerd."
      unknowns:
        - "Of gebruikers de richtwaarden begrijpen en toepasbaar vinden (geen praktijkmeting)."
      evidence_method:
        - "Proof-run: voor een matrix van sessietypes (kort/lang, rustig/intensief, race, hitte, onbekende duur, ontbrekend gewicht) de engine-uitvoer vastleggen en tegen de belofte toetsen."
        - "Praktijktest: René legt bij drie echte trainingen vooraf vast wat hij verwacht en vergelijkt met de getoonde richtwaarden."

    rene_calibration:
      questions:
        - question: "Cafeïne-advies (gangbaar in wedstrijdsport, maar met bijwerkingen en jeugdgevoeligheid): wil je dat Sparki dit volwassenen actief aanbiedt, alleen op verzoek, of helemaal niet?"
          answer_rene: ""
        - question: "Als je geen toestemming hebt gegeven voor voorkeuren (allergieën, maag/darm): moet Sparki dan zichtbaar zeggen 'dit advies houdt geen rekening met jouw voorkeuren' of stil generiek adviseren (huidig)?"
          answer_rene: ""
        - question: "Moeten voedingsrichtwaarden reageren op je gezondheidsstatus (ziek/geblesseerd), bijvoorbeeld door tijdens ziekte geen prestatiegerichte fueling te tonen, of is de indirecte koppeling via het (wegvallende) plan genoeg?"
          answer_rene: ""
      completed: false

    acceptance_contract:
      hard_reject_rules:
        - rule: "Geen enkel getal (gram, milliliter, milligram, kcal) in een voedingsadvies mag door het taalmodel worden berekend of aangepast; elk getal komt uit de deterministische engine of letterlijk uit een coach-instructie."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "De engine geeft 45–60 g/u; de LLM-tekst noemt '70 gram per uur voor extra energie' — overtreding, ook als 70 op zichzelf een verdedigbaar getal zou zijn."
              proof_stage: designed
              proof_method: "Redenering: de prompt levert de berekende richtwaarden als leidend blok met de regel dat de LLM alleen verwoordt; de latere executed-stap is een test die LLM-uitvoer parseert op getallen en asserteert dat elk getal in de engine-uitvoer of een coach-instructie voorkomt."
              proof_result: not_yet_tested
        - rule: "Een training wordt nooit ondervoed geadviseerd: richtwaarden tijdens en rond een training mogen nooit verlaagd worden om welk doel dan ook (gewicht, calorie-budget, weektotaal)."
          rule_type: hard_blockage
          measurement_level: per_sessie
          aggregate_justification: ""
          counterexamples:
            - case: "Actief afvaldoel en een lange duurtraining: het tijdens-advies zakt naar 20 g/u 'vanwege je doel' — overtreding; het juiste gedrag is volledige fueling en sturing uitsluitend via gewone maaltijden op rustige momenten."
              proof_stage: designed
              proof_method: "Redenering: de seizoensdoel-leeslaag injecteert de harde regel 'training altijd volledig gevoed' en de engine kent geen tekort-parameter; executed na een her-run van de touchpoints-test uitgebreid met dit expliciete scenario."
              proof_result: not_yet_tested
        - rule: "Ontbrekende invoer (duur onbekend, gewicht ontbreekt) levert een zichtbaar gat met reden; er mag nooit een richtwaarde op een stille aanname verschijnen."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "Atleet zonder gewicht in het profiel ziet toch 'eet 90 gram koolhydraten na afloop' — overtreding: het herstel-getal is gewichtsafhankelijk en had een eerlijk gat met de actie 'vul je gewicht in' moeten zijn."
              proof_stage: designed
              proof_method: "Redenering: de engine geeft null bij ontbrekend gewicht/duur; executed na een test die met leeg gewicht/duur asserteert dat de betreffende velden null zijn en de UI het gat met reden toont."
              proof_result: not_yet_tested
      tolerances:
        - "De bandbreedtes zelf (30–60/45–60/60–90 g/u; 1–2 g/kg pre; 1–1,2 g/kg + 0,25–0,4 g/kg herstel) zijn kalibreerbare toleranties binnen richtlijnbereik, geen harde grenzen."
      unknown_data_policy: "Onbekende duur, ontbrekend gewicht of ontbrekende toestemming leiden tot een kleiner maar eerlijk advies met zichtbare reden; nooit aanvullen met aannames."
      approved: false

    validation:
      automated_tests:
        - "test:afvaldoel-touchpoints (canonieke zin + jeugd-afwezigheid op alle raakvlakken incl. session-targets) — bestaat, groen"
        - "Engine-gedrag deels gedekt via bestaande nutrition-/fueling-paden; geen dedicated engine-matrixtest"
      independent_checks: ["Matrix-proof-run over sessietypes — nog te ontwerpen en te draaien"]
      practice_test_required: true
      practice_testers: ["René (drie echte trainingen, verwachting vooraf vastgelegd)"]
      result: not_tested
      expectation_gap:
        - "Geen test die LLM-uitvoer op verzonnen getallen controleert; de honest-numbers-regel is prompt-afspraak, niet bewezen contract."
    product_proof:
      score: null
      status: not_proven
      evidence_refs: []
    next_action:
      type: research_or_build_or_retest
      description: "Kalibratievragen beantwoorden; engine-matrixtest + LLM-getallencontrole ontwerpen; bronverantwoording per band vastleggen."
      approved_for_execution: false

  # -------------------------------------------------------------------------
  # F2 — Hydratatie
  # -------------------------------------------------------------------------
  - id: VOED_HYDRATATIE_001
    module: "Voeding, hydratatie en gewicht"
    subject: "Hydratatie en natrium — weersafhankelijk waar het kan, eerlijk waar het niet kan"
    status: needs_calibration

    current_state:
      technical_status: implemented
      source_snapshot: 2026-07-30
      evidence_status: "Vochtadvies is deterministisch: 400–750 ml/u normaal, 750–1000 ml/u bij hitte (≥25 °C via echt thuisweer, Open-Meteo); natrium alleen bij hitte of >150 min (300–600 mg/u). Als het weer niet beschikbaar is valt het advies eerlijk terug op de normale band met een expliciet onbekende-temperatuur-gat. Geen zweettest- of individuele zweetsnelheidslogica."
      practice_status: "Zichtbaar in de sessie-richtwaarden en het fueling-plan; mobiel telt bidons als vaste 500 ml (grove schatting, gebruiker kan corrigeren)."
      known_limitations:
        - "Hitte kijkt naar de thuislocatie-dagmaximum, niet naar de werkelijke rit-locatie of het rit-tijdstip."
        - "Wedstrijdvoeding (race-intel) gebruikt een vaste 500–750 ml/u ongeacht weer — inconsistent met de sessie-engine."
        - "Bidon = 500 ml is een vaste aanname; afwijkende bidonmaten vertekenen de logging."
        - "Open-Meteo free tier is uitsluitend niet-commercieel — bestaand geregistreerd licentierisico vóór commerciële start."

    proposed_promise:
      text: "Sparki geeft per training een drinkrichtlijn die rekening houdt met de verwachte warmte op basis van echt weer — en zegt het eerlijk wanneer het weer onbekend is in plaats van te doen alsof. Zout komt alleen in beeld wanneer duur of hitte daar reden toe geeft."
      proposed_by: replit
      rationale: "Hydratatie is het meest weersgevoelige advies in de app; het bestaande eerlijk-gat-gedrag bij onbekend weer is een verdedigbare kern."
      rene_approved: false

    external_intelligence:
      research_required: true
      candidate_sources:
        - name: "Open-Meteo (thuislocatie-forecast)"
          coverage: "Dekt dagmaxima voor de thuislocatie. Dekt NIET: rit-locatie onderweg, microklimaat, rit-tijdstip-specifieke temperatuur."
          actuality: "Live API."
          license_status: "Free tier uitsluitend niet-commercieel — geregistreerd risico."
          limitations:
            - "Thuislocatie-benadering; lange ritten verlaten die zone."
          applicability: "De hitte-drempel (≥25 °C) voor vocht- en natriumbanden."
        - name: "Hydratatierichtlijnen duursport (ACSM position stand fluid replacement)"
          coverage: "Dekt gangbare vochtbanden en het principe van individuele zweetvariatie. Dekt NIET: individuele zweettests."
          actuality: "Position stand; stabiel."
          license_status: "Vrij toepasbaar als onderbouwing."
          limitations:
            - "Individuele spreiding is groot; banden blijven vuistregels."
          applicability: "Onderbouwt de 400–750/750–1000-banden en het natriumvenster."
      sources_in_use:
        - "Eigen engine + Open-Meteo — leidend voor de hitte-schakel."
      privacy_status: unknown
      missing_information:
        - "Geen besluit of rit-tijdstip/route-locatie ooit de hitte-schakel moet voeden."
        - "Geen individuele zweetsnelheid (bewust simpel, nooit gekalibreerd)."

    replit_definition:
      objective_quality_standard: "Hitte-verhoging van vocht/natrium alleen bij een echt beschikbare forecast ≥25 °C; onbekend weer levert de normale band + expliciet 'temperatuur onbekend'; 0 verzonnen temperaturen."
      recommended_default: "Huidige banden en hitte-drempel handhaven; de race-intel-hydratatie gelijktrekken met de sessie-engine (nu vast 500–750) als bouwopgave; bidonmaat instelbaar maken als kalibreerbare verbetering."
      technical_limits:
        - "Weer alleen voor de thuislocatie; geen route-gebaseerd weer."
      assumptions:
        - "500 ml per bidon is een acceptabele registratie-aanname zolang de gebruiker kan corrigeren."
      unknowns:
        - "Hoe vaak het thuisweer materieel afwijkt van het werkelijke rit-weer."
      evidence_method:
        - "Proof-run: forecast-scenario's (heet/normaal/onbeschikbaar) door de engine halen en de banden + het eerlijke gat asserteren."

    rene_calibration:
      questions:
        - question: "Het hitte-advies kijkt nu naar het dagmaximum op je thuislocatie. Is dat goed genoeg, of wil je dat Sparki (waar mogelijk) naar het rit-tijdstip en de routelocatie kijkt?"
          answer_rene: ""
        - question: "Wil je een instelbare bidonmaat (nu telt elke bidon als 500 ml), of is de vaste aanname met correctiemogelijkheid achteraf goed genoeg?"
          answer_rene: ""
      completed: false

    acceptance_contract:
      hard_reject_rules:
        - rule: "Een hitte-verhoogd vocht- of natriumadvies mag alleen verschijnen bij een echt beschikbare weersverwachting; onbekend weer levert de normale band plus een expliciet 'temperatuur onbekend'-gat, nooit een aangenomen temperatuur."
          rule_type: hard_blockage
          measurement_level: per_meting
          aggregate_justification: ""
          counterexamples:
            - case: "Weer-API faalt en het advies toont toch 750–1000 ml/u 'vanwege de verwachte hitte' — overtreding: de hitte is verzonnen."
              proof_stage: designed
              proof_method: "Redenering: getHomeWeather-falen levert null en de engine gebruikt dan de normale band met expliciet gat; executed na een test met gemockte weer-fout die band + gat-tekst asserteert."
              proof_result: not_yet_tested
        - rule: "Natriumadvies verschijnt alleen bij hitte of duur >150 minuten; daarbuiten nooit, ook niet 'voor de zekerheid'."
          rule_type: hard_blockage
          measurement_level: per_sessie
          aggregate_justification: ""
          counterexamples:
            - case: "Rustige training van 60 minuten bij 18 °C toont 300–600 mg natrium per uur — overtreding: buiten het venster is zoutsturing ongegrond."
              proof_stage: designed
              proof_method: "Redenering: de natriumtak is expliciet aan hitte/duur gebonden; executed na een matrixtest kort/koel vs. lang/heet."
              proof_result: not_yet_tested
      tolerances:
        - "De hitte-drempel (25 °C) en de banden zijn kalibreerbare toleranties."
      unknown_data_policy: "Onbekende temperatuur = normale band + expliciet gat; onbekende duur = geen natriumadvies op duurgrond."
      approved: false

    validation:
      automated_tests:
        - "Sessie-richtwaarden inclusief weerpad deels gedekt via bestaande nutrition-tests; geen dedicated weer-fout-test"
      independent_checks: ["Forecast-scenario-proof-run — nog te doen"]
      practice_test_required: true
      practice_testers: ["René (hete-dag-praktijkcheck zodra die zich voordoet)"]
      result: not_tested
      expectation_gap:
        - "Race-intel-hydratatie (vast 500–750) wijkt af van de weersafhankelijke sessie-engine — inconsistentie die de belofte kan breken zolang hij bestaat."
    product_proof:
      score: null
      status: not_proven
      evidence_refs: []
    next_action:
      type: research_or_build_or_retest
      description: "Kalibratievragen beantwoorden; weer-fout-test ontwerpen; race-intel-hydratatie gelijktrekken (bouwvoorstel, na akkoord)."
      approved_for_execution: false

  # -------------------------------------------------------------------------
  # F3 — Voedingslogboek en dag-analyse
  # -------------------------------------------------------------------------
  - id: VOED_LOGBOEK_001
    module: "Voeding, hydratatie en gewicht"
    subject: "Logboek (foto/tekst/tellers), schattingen en dag-analyse — rijder is leidend"
    status: needs_calibration

    current_state:
      technical_status: implemented
      source_snapshot: 2026-07-30
      evidence_status: "Logs (koolhydraten, vocht, natrium, eten, GI-klachten, energiescore, foto's) via /api/nutrition; foto- én tekstlogs krijgen een echte AI-schatting met her-beoordelingspad (/:id/photo-advice) en een correctieveld waarbij de opgave van de rijder altijd wint ('het waren 10 broodjes, niet 6'). compareFuelPlanToLogs geeft alleen per-uur-oordelen als er logs zijn; nul logs ⇒ eerlijk 'geen inname geregistreerd', nooit een oordeel. Mobiel worden bidon/eetmoment-tellers en de lokale datum bij STOP gesnapshot (niet bij opslaan) zodat na-middernacht-opslaan niet op de verkeerde dag belandt. Foto's worden owner-checked geserveerd."
      practice_status: "In gebruik; het her-beoordelingspad bestaat juist vanwege een echte testervaring (foto bleef onverwerkt liggen)."
      known_limitations:
        - "AI-schattingen van foto's/tekst zijn schattingen; jeugd krijgt kwalitatieve duiding, volwassenen macro's — de onzekerheid van de schatting wordt beperkt gecommuniceerd."
        - "bodyWeightBefore/After bestaan in het logmodel maar het formulier vult ze niet — dode velden."
        - "De dag-analyse vergelijkt logs met richtwaarden maar heeft geen begrip van niet-gelogde inname (een lege dag is 'geen data', geen 'niets gegeten' — correct, maar het onderscheid moet zichtbaar blijven)."

    proposed_promise:
      text: "Wat jij logt is van jou: Sparki schat mee (ook bij een foto of een getypte maaltijd), maar jouw opgave wint altijd. Sparki beoordeelt alleen wat er echt geregistreerd is — geen registratie betekent 'geen gegevens', nooit een verwijt of een verzonnen oordeel."
      proposed_by: replit
      rationale: "Het rijder-is-leidend-principe en het eerlijke nul-logs-gedrag zijn al gebouwd en getest gedrag; de belofte legt vast dat dit nooit mag eroderen."
      rene_approved: false

    external_intelligence:
      research_required: false
      candidate_sources:
        - name: "Eigen logboek + AI-schattingslaag (foto/tekst-analyse via de centrale AI-gateway)"
          coverage: "Dekt geregistreerde inname en schattingen. Dekt NIET: niet-gelogde inname."
          actuality: "Live eigen code."
          license_status: "Eigen werk; AI-gebruik consent-gated via de centrale gateway."
          limitations:
            - "Schattingen blijven schattingen; nauwkeurigheid nooit gemeten tegen gewogen referentie."
          applicability: "Het hele logboek- en analysegedrag."
      sources_in_use:
        - "Eigen logboek + AI-gateway — leidend."
      privacy_status: unknown
      missing_information:
        - "Geen meting van de schattingsnauwkeurigheid (foto → gram) tegen een gewogen referentiemaaltijd."

    replit_definition:
      objective_quality_standard: "Elke correctie van de rijder overschrijft de AI-schatting; 0 oordelen zonder logs; elke gelogde foto/tekst krijgt (eventueel achteraf) een schatting of een zichtbare, herkansbare foutstatus — nooit een stille dode-einde-log."
      recommended_default: "Rijder-authoritatieve correcties handhaven; her-beoordelingsknop zichtbaar houden op elk item zonder schatting; dag-analyse blijft 'geen data ≠ niets gegeten' expliciet benoemen."
      technical_limits:
        - "Schattingen uit foto's zijn begrensd door beeldkwaliteit; het doorvraagmechanisme (needsMorePhoto/followUpQuestion) is de eerlijke uitlaatklep."
      assumptions:
        - "Gebruikers corrigeren daadwerkelijk als een schatting fout is (nooit gemeten)."
      unknowns:
        - "Schattingsnauwkeurigheid in de praktijk."
      evidence_method:
        - "Proof-run: log met foto, log met alleen tekst, correctie-override en nul-logs-dag elk tegen het contract asserteren."
        - "Praktijktest: drie echte maaltijden met bekende inhoud loggen en de schatting + correctieflow beoordelen."

    rene_calibration:
      questions:
        - question: "Hoe zichtbaar moet de onzekerheid van een AI-schatting zijn: alleen 'geschat' als label (huidig), of ook een expliciete bandbreedte ('40–60 g koolhydraten')?"
          answer_rene: ""
        - question: "De velden 'gewicht voor/na de rit' bestaan in het model maar zitten niet in het formulier: schrappen, of juist invulbaar maken (bijv. voor zweetverlies-inzicht op hete dagen)?"
          answer_rene: ""
      completed: false

    acceptance_contract:
      hard_reject_rules:
        - rule: "Zonder geregistreerde inname mag er nooit een inname-oordeel verschijnen; nul logs levert altijd eerlijk 'geen inname geregistreerd'."
          rule_type: hard_blockage
          measurement_level: per_dag
          aggregate_justification: ""
          counterexamples:
            - case: "Lange trainingsdag zonder logs; de dag-analyse zegt 'je hebt te weinig gegeten tijdens de rit' — overtreding: er is geen data, dus geen oordeel."
              proof_stage: designed
