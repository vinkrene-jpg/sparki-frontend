<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Sparki — Performance Center</title>
    <meta name="description" content="Sparki — Performance Center — built on Replit. Update this description to reflect the app." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Sparki — Performance Center" />
    <meta property="og:description" content="Sparki — Performance Center — built on Replit. Update this description to reflect the app." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sparki — Performance Center" />
    <meta name="twitter:description" content="Sparki — Performance Center — built on Replit. Update this description to reflect the app." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="/icon-light-32x32.png" />
    <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="/icon-dark-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
  </head>
  <body style="margin:0;background:#040506">
    <div id="root">
      <div id="sparki-splash" style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#040506;color:rgba(255,255,255,0.75);font-family:system-ui,sans-serif">
        <div style="width:28px;height:28px;border:3px solid rgba(103,232,249,0.25);border-top-color:rgba(103,232,249,0.9);border-radius:50%;animation:sparkidraai 0.9s linear infinite"></div>
        <p style="margin:0;font-size:15px;font-weight:600">Sparki wordt geladen…</p>
        <style>@keyframes sparkidraai{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script>
      // Vangnet vóór React: als het opstarten crasht voordat de app rendert,
      // toon dan een leesbaar foutscherm in plaats van een zwart scherm.
      (function () {
        window.addEventListener("error", function () {
          var splash = document.getElementById("sparki-splash");
          if (!splash) return; // React draait al — de app vangt dit zelf op.
          splash.innerHTML =
            '<p style="margin:0;font-size:16px;font-weight:600">Sparki kon niet opstarten</p>' +
            '<p style="margin:0;max-width:280px;font-size:13px;color:rgba(255,255,255,0.45);text-align:center">Er ging iets mis bij het laden. Controleer je verbinding en probeer het opnieuw.</p>' +
            '<button onclick="location.reload()" style="margin-top:10px;padding:10px 22px;border-radius:999px;border:1px solid rgba(103,232,249,0.4);background:transparent;color:rgba(103,232,249,0.9);font-size:14px;font-weight:600">Opnieuw laden</button>';
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
