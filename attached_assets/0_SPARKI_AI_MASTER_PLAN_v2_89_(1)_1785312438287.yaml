  - CLAUDE_WHEN_CONSULTED
  primary_goal:
  - FIND_DEFECTS_BEFORE_RENE_SEES_THEM_IN_PREVIEW
  - STOP_USING_RENE_AS_PRIMARY_BUG_DETECTOR
  - CREATE_ONE_PROVEN_CURRENT_STATE
  - REPAIR_ALL_PROVEN_IN_SCOPE_DEFECTS_BEFORE_NEW_FEATURE_WORK
  required_sequence:
  - IDENTIFY_EXACT_ZIP_OR_COMMIT
  - READ_ONLY_FULL_REPOSITORY_AUDIT
  - CREATE_CONSOLIDATED_DEFECT_REGISTER
  - CLASSIFY_SEVERITY_CONFIDENCE_ROOT_CAUSE_AND_IMPACT
  - DEFINE_MINIMAL_SAFE_FIX_AND_REQUIRED_TEST
  - REPAIR_ALL_PROVEN_IN_SCOPE_DEFECTS
  - RUN_TYPECHECK_TESTS_RUNTIME_RESPONSIVE_DATA_TRUST_AND_REGRESSION_EVIDENCE
  - INDEPENDENT_NON_IMPLEMENTER_REVIEW
  - DECLARE_NEW_ZERO_POINT_ONLY_AFTER_EVIDENCE
  minimum_audit_scope:
    routing_navigation_and_shells:
    - wrong route component
    - active navigation mismatch
    - old and new shells mixed
    - duplicate or hidden navigation
    - dev preview route divergence
    - feature flag routing divergence
    layout_and_responsiveness:
    - desktop phone-width layouts
    - fixed-width collisions
    - wrong viewport breakpoints
    - container-width versus viewport-breakpoint mistakes
    - flex/grid overflow
    - missing min-width zero
    - unreachable or clipped actions
    - text overlap
    - z-index and overlay defects
    mandatory_viewports:
    - 390x874
    - 768x1024
    - 1024x768
    - 1280x800
    - 1440x900
    - 1920x1080 when relevant
    data_trust:
    - mock, seed or demo shown as personal data
    - fallback names or metrics
    - hardcoded personal data
    - API errors replaced by example data
    - unknown provenance
    - stale or conflicting values
    forms_and_ai:
    - invented prefill
    - static content presented as AI
    - unknown fields not asked reactively
    - unsafe automatic actions
    - long non-reactive forms
    - AI output without source or confidence
    analytics_and_graphs:
    - graph without real data source
    - false precision
    - wrong unit or period
    - duplicate metric engines
    - missing honest empty state
    - missing confidence or data quality
    state_roles_and_permissions:
    - dev or test persona visible
    - localStorage unintentionally used as source of truth
    - role leakage
    - client-only permission enforcement
    - pending relationship treated as active
    quality_and_maintenance:
    - dead code
    - duplicate components or engines
    - built but hidden functionality
    - cache-key collision
    - error-boundary gaps
    - accessibility regressions
    - reduced-motion violations
  defect_register_required_fields:
  - defect_id
  - Dutch name
  - severity
  - confidence
  - affected route and role
  - file and line or function
  - root cause
  - user impact
  - data or privacy impact
  - minimal safe fix
  - required tests and viewports
  - dependencies
  - status
  - evidence path
  severity_order:
  - P0 security, privacy or data loss
  - P1 blocker or false personal data
  - P2 major functional or responsive defect
  - P3 minor usability or visual defect
  - P4 cleanup or technical debt
  repair_policy:
    repair_without_new_user_question:
    - small targeted repair of a proven defect
    - test and evidence needed to close the defect
    - removal of proven mock or fallback presentation
    - responsive and accessibility repair without product redesign
    stop_and_ask_when:
    - a new product decision is required
    - destructive or irreversible data change is required
    - a large rewrite has multiple valid architecture options
    - root cause cannot be proven from code or runtime evidence
    - production deployment is required
  definition_of_done:
  - No defect is closed on a text report alone.
  - Code evidence and runtime evidence are both required where applicable.
  - Screenshot-only proof is insufficient for data, routing, permission or engine claims.
  - A self-reported Replit completion is never accepted without independent review.
  - Rene should not need to manually find ordinary layout, routing, data-trust or state defects in preview.
