    dependencies:
      required_existing:
      - AUTH
      - EQUIPMENT_DIGITAL_BIKE_TWIN
      - MEDIA_STORAGE
      - CONSENT_ENGINE
      - CENTRAL_ENTITLEMENT_RESOLVER
      - AUDIT
      - NOTIFICATIONS
      code_inventory_before_build: REQUIRED
      reuse_existing_capture_upload_and_bike_profile: REQUIRED
