      handling: SHOW_AS_SEPARATE_SOURCE
      overwrite_lab_or_sparki_estimate: false
  required_inputs:
  - RELIABLE_CONTINUOUS_POWER_DATA_FOR_AT_LEAST_FIVE_MINUTES
