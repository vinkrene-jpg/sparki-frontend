precedence:
  order:
  - rank: 1
    source: CURRENT_WORKING_CODE_AND_RUNTIME_EVIDENCE
    scope: CURRENT_TECHNICAL_STATE
  - rank: 2
    source: EXPLICIT_USER_DECISION
    scope: PRODUCT_DIRECTION_AND_CONSTRAINTS
    ordering: NEWEST_FIRST
  - rank: 3
    source: THIS_MASTER_PLAN
    scope: TARGET_STATE_AND_BUILD_GOVERNANCE
  - rank: 4
    source: VERIFIED_PRIMARY_EXTERNAL_SOURCE
    scope: MARKET_TECHNICAL_LEGAL_AND_INTEGRATION_FACTS
  - rank: 5
    source: OLDER_ROADMAP_OR_CONVERSATION
    scope: HISTORICAL_CONTEXT_ONLY
  conflict_protocol:
    detect: REQUIRED
    auto_resolve_when_precedence_is_unambiguous: true
    preserve_superseded_record: true
    ask_user_only_when:
    - FUNDAMENTAL_PRODUCT_CHOICE_REMAINS_OPEN
    - SAME_PRIORITY_SOURCES_CONFLICT
    - CODE_CONFLICT_CHANGES_PRODUCT_INTENT
    prohibit:
    - ASSISTANT_MEMORY_AS_PROJECT_SOURCE
    - UNVERIFIED_ASSISTANT_CLAIM_AS_DECISION
    - OLD_CONVERSATION_OVERRIDE_OF_NEW_DECISION
collaboration_contract:
  authority:
    product_owner: RENE
    assistant_role:
    - RESEARCH_OWNER
    - SPECIFICATION_OWNER
    - CONSISTENCY_OWNER
    - EVIDENCE_OWNER
    - COMPETITIVE_REVIEW_OWNER
    replit_role:
    - IMPLEMENT_APPROVED_SMALL_TASK
    - REPORT_EVIDENCE
    - NO_PRODUCT_DECISION_AUTHORITY
  assistant_write_governance:
    applies_to:
    - CHATGPT
    - CODEX
    - CLAUDE
    - FUTURE_ASSISTANT_PROVIDER
    product_code_write_default: PROHIBITED
    product_code_write_requires:
      any_of:
      - EXISTING_APPROVED_MASTER_PLAN_TASK
      - EXPLICIT_LOGGED_USER_EXCEPTION
    documentation_master_plan_and_authorized_figma_work:
      governed_separately_from_product_code: true
      explicit_task_scope_required: true
    implementer_testing:
      allowed: true
      sole_final_approval: PROHIBITED
      independent_approval_required_from:
      - USER
      - NON_IMPLEMENTING_ASSISTANT
    every_write_action_evidence:
    - CHANGED_FILES
    - COMMIT_HASH_WHEN_REPOSITORY_WRITE
    - REASON
    - TEST_EVIDENCE_WHEN_EXECUTABLE_BEHAVIOR_CHANGES
    logged_exception:
      add_to_next_master_plan_revision: REQUIRED
  user_review_model:
    user_reads_or_reviews_master_plan: false
    user_controls_by_questions: true
    assistant_must_answer_from_evidence: true
    assistant_owns_document_validation: true
    user_approval_of_document_text_required: false
    user_request_before_product_build_required: true
  confirmed_feature_ingestion:
    same_revision_production_spec: REQUIRED
    title_or_idea_only_entry: PROHIBITED
    minimum_same_revision_content:
    - PRODUCT_PURPOSE
    - COMMERCIAL_VALUE
    - COMPETITIVE_RESEARCH
    - END_TO_END_FLOW
    - DATA_MODEL
    - API_CONTRACT
    - ROLE_PERMISSION_PRIVACY
    - DETERMINISTIC_AND_AI_BOUNDARIES
    - ERROR_AND_EMPTY_STATES
    - PHASED_REPLIT_TASKS
    - TESTS
    - ACCEPTANCE
    - RELEASE_GATES
    - EVIDENCE_REQUIREMENTS
    unresolved_nonblocking_detail:
      action: OPEN_DECISION_WITH_REQUIRED_BEFORE_GATE
    missing_production_spec:
      feature_status: NOT_VALIDLY_ADDED_TO_MASTER_PLAN
  retroactive_domain_completion:
    scope: ALL_DOMAIN_REGISTRY_ENTRIES
    process: CONTROLLED_QUESTION_BATCHES
    questions_per_batch_max: 10
    questions_must_be:
    - FUNDAMENTAL_PRODUCT_DECISION
    - NOT_ALREADY_CONFIRMED
    - NOT_IMPLEMENTATION_DETAIL_OWNED_BY_ASSISTANT_OR_REPLIT
    filler_question: PROHIBITED
    batch_may_span_domains: true
    after_question_10_answer:
    - APPLY_ALL_BATCH_DECISIONS_TO_NEXT_MASTER_PLAN_VERSION
    - ADD_OR_COMPLETE_PRODUCTION_CONTRACTS
    - ADD_PHASED_REPLIT_TASKS
    - VALIDATE_DOCUMENT
    - PRESERVE_STABLE_LIBRARY_ID
    batch_with_fewer_than_10_remaining_questions:
      action: CLOSE_AND_APPLY_WITHOUT_FILLER
    user_review_of_document: NOT_REQUIRED
    user_control: ANSWER_AND_LATER_QUESTION
  communication:
    style: BUSINESS_DIRECT
    pleasing_behavior: PROHIBITED
    functional_disagreement: REQUIRED
    max_explanation_sentences: 10
    preferred_explanation_sentences: LESS_THAN_10
    invented_context: PROHIBITED
    invented_fact: PROHIBITED
    invented_decision: PROHIBITED
    uncertainty:
      disclose: REQUIRED
      convert_to_fact: PROHIBITED
    question_policy:
      ask_only_real_product_decisions: true
      ask_for_sake_of_asking: false
      ask_detail_implied_by_confirmed_rules: false
      only_fundamental_choices_return_to_user: true
    continuity:
      reask_confirmed_choice: PROHIBITED
      reopen_only_for:
      - NEW_EVIDENCE
      - CURRENT_CODE_CONFLICT
      - MARKET_CHANGE
      - SAFETY_OR_LEGAL_CONFLICT
      process_new_answer_into_next_document_version: REQUIRED
    completion_communication:
      status_vocabulary:
      - REPLIT_REPORTED
      - ASSISTANT_VALIDATION_PENDING
      - ASSISTANT_VALIDATED
      - REJECTED_WITH_BLOCKERS
      replit_report_is_completion_proof: false
      assistant_may_report_complete_only_when: ASSISTANT_VALIDATED
      assistant_must:
      - SEPARATE_REPLIT_CLAIM_FROM_VALIDATED_STATE
      - VALIDATE_REQUIRED_ARTIFACTS_AND_MACHINE_RESULTS
      - DISCLOSE_EACH_BLOCKER_DIRECTLY
      - STATE_EXACT_NEXT_CORRECTION_WHEN_REJECTED
      - OWN_SPECIFICATION_DEFECTS_WHEN_ACCEPTANCE_WAS_UNDERSPECIFIED
      assistant_must_not:
      - ACCEPT_SELF_ASSERTED_PASS
      - CONVERT_REPLIT_PROSE_TO_VALIDATED_FACT
      - HIDE_WARNING_OR_DEFERRED_DEFECT_BEHIND_OPEN_GATES_ZERO
    replit_instruction_communication:
      every_acceptance_gate_requires:
      - MACHINE_EXECUTABLE_VALIDATION_COMMAND
      - EXPECTED_EXIT_CODE
      - EXPECTED_MACHINE_READABLE_RESULT
      - FAILURE_CONDITION
      - EVIDENCE_ARTIFACT_PATH
      gate_result_rule:
        PASS_requires:
        - COMMAND_EXIT_CODE_ZERO
        - ZERO_UNRESOLVED_WARNINGS
        - ZERO_DEFERRED_IN_SCOPE_DEFECTS
        - ZERO_MISSING_EVIDENCE
        - ACCEPTANCE_THRESHOLD_MET_WITHOUT_PRESENTATION_ROUNDING
        FAIL_when_any:
        - COMMAND_NONZERO
        - WARNING_PRESENT
        - IN_SCOPE_DEFECT_DEFERRED
        - EVIDENCE_MISSING
        - PROVENANCE_AMBIGUOUS
        - CHECKSUM_VALIDATION_FAILS
      replit_authority:
        may_implement: true
        may_report_test_results: true
        may_self_approve_completion: false
        may_set_open_gates_zero_without_machine_evidence: false
      evidence_package:
        required:
        - CLEAN_WORKTREE_STATE
        - EXACT_SOURCE_COMMIT_SHA
        - GENERATED_AT
        - MACHINE_READABLE_GATE_RESULTS
        - RAW_TEST_RESULTS
        - COMPLETE_CHECKSUM_MANIFEST
        checksum_manifest_may_hash_itself: false
        checksum_validation_exit_code: 0
      separate_passes:
        implementation: REQUIRED
        validation_after_implementation: REQUIRED
        validation_may_not_rely_on_implementation_summary: true
  release_scope_containment:
    authority: USER_CONFIRMED_2026_07_25
    reason:
    - PRODUCT_SCOPE_BECAME_UNCONTROLLED
    - RESEARCH_AND_REPORTING_EXPANDED_WITHOUT_RELEASE_BOUNDARY
    - NEW_IDEAS_WERE_TOO_EASILY_CONVERTED_TO_ACTIVE_SCOPE
    - COST_AND_RESULT_RELATION_BECAME_UNACCEPTABLE
    current_mode: COMMERCIAL_UX_RELEASE_BLOCKER_EXECUTION_WITH_SCOPE_SANITATION
    active_build_authorization: LIMITED_TO_ONE_COMMERCIAL_UX_GATE_TASK
    active_research_authorization: SUSPENDED
    active_agent_authorization: SUSPENDED
    active_replit_authorization: ONE_APPROVED_BOUNDED_COMMERCIAL_UX_TASK_ONLY
    master_plan_feature_expansion: SUSPENDED
    controlled_exception:
      authority: NEWER_USER_DECISION_2026_07_25
      reason:
      - FUNCTIONAL_DEPTH_WITHOUT_CLARITY_TRUST_AND_RECOGNIZABILITY_IS_NOT_SELLABLE
      - COMMERCIAL_VISUAL_AND_INTERACTION_QUALITY_PRECEDES_FURTHER_FEATURE_BUILD
      permitted_scope:
      - EXISTING_UI_RUNTIME_AUDIT
      - EDITABLE_FIGMA_COMMERCIAL_BASELINE
      - FIGMA_TO_EXISTING_CODE_MAPPING
      - BOUNDED_IMPLEMENTATION_OF_APPROVED_COMMERCIAL_UX
      - VISUAL_ACCESSIBILITY_AND_REGRESSION_CORRECTION
      prohibited_scope:
      - NEW_PRODUCT_FEATURE
      - NEW_DOMAIN
      - ENGINE_API_SCHEMA_OR_DATABASE_EXPANSION
      - PRODUCT_WIDE_BIG_BANG_REWRITE
      completion_gate:
      - APPROVED_FIGMA_FRAME
      - CURRENT_CODE_MAPPING
      - FEATURE_FLAG_DEFAULT_OFF
      - MOBILE_AND_DESKTOP_VISUAL_REVIEW
      - ACCESSIBILITY_AND_REGRESSION_PASS
      - RENE_PRACTICAL_VISUAL_ACCEPTANCE
    allowed_work:
    - CLASSIFY_EXISTING_SCOPE
    - NORMALIZE_EXISTING_EVIDENCE
    - IDENTIFY_RELEASE_BLOCKERS_FROM_EXISTING_EVIDENCE
    - DEFINE_MINIMUM_SELLABLE_RELEASE
    - COUNT_REMAINING_RELEASE_TASKS
    - PRODUCE_COST_RANGE_AFTER_TASK_COUNT
    - CORRECT_GOVERNANCE_OR_FACTUAL_STATUS_ONLY
    - EXECUTE_ONE_BOUNDED_COMMERCIAL_UX_GATE_TASK
    prohibited_work:
    - NEW_FEATURE_RESEARCH
    - NEW_COMPETITOR_RESEARCH_WITHOUT_RELEASE_BLOCKER
    - NEW_AGENT_ASSIGNMENT
    - NEW_PRODUCTION_CONTRACT_EXPANSION
    - IDEA_TO_ACTIVE_SCOPE_WITHOUT_RELEASE_GATE
    - REPORT_WITHOUT_DIRECT_DECISION_OR_BUILD_CONSEQUENCE
    - MULTIPLE_ACTIVE_TASKS
    - WHILE_WE_ARE_HERE_SCOPE
    new_idea_default:
      status: PARKED_UNASSESSED
      may_trigger_research: false
      may_trigger_master_plan_expansion: false
      may_trigger_replit_work: false
      reconsider_only_after:
      - SELLABLE_RELEASE_SCOPE_LOCKED
      - RELEASE_COST_BASELINE_ACCEPTED
      - USER_EXPLICITLY_REOPENS_IDEA
    assistant_behavior:
      default_response_to_scope_expansion: FUNCTIONALLY_CHALLENGE_AND_PARK
      agreement_without_release_necessity: PROHIBITED
      research_branch_continuation_without_release_blocker: PROHIBITED
      maximum_active_tasks: 1
      terminate_nonproductive_analysis: REQUIRED
    sanitation_classification:
      statuses:
      - KEEP_FOR_RELEASE
      - FINISH_FOR_RELEASE
      - HIDE_OR_PARK
      - REMOVE_FROM_RELEASE
      per_domain_required:
      - DOMAIN_ID
      - CURRENT_EVIDENCED_BUILD_STATE
      - USER_VISIBLE_VALUE
      - RELEASE_NECESSITY
      - REMAINING_WORK
      - DEPENDENCIES
      - MATERIAL_RISK
      - CLASSIFICATION
      use_existing_evidence_only: true
      output: ONE_RELEASE_SCOPE_MATRIX
      detailed_new_domain_report: PROHIBITED
    exit_gate:
      requires:
      - RELEASE_SCOPE_MATRIX_COMPLETE
      - MINIMUM_SELLABLE_RELEASE_LOCKED
      - NONRELEASE_SCOPE_HIDDEN_PARKED_OR_REMOVED_FROM_RELEASE_PLAN
