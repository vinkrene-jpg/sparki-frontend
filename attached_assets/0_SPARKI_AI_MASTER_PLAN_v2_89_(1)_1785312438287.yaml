  - UNKNOWN_OR_STALE_BODY_WEIGHT
  - CLEARLY_SUBMAXIMAL_EFFORT
  - UNTRUSTED_OR_UNCALIBRATED_POWER_SOURCE_WHEN_CONFIDENCE_CANNOT_BE_ESTABLISHED
  output_requirements:
  - LABEL_AS_GESCHATTE_VO2MAX
