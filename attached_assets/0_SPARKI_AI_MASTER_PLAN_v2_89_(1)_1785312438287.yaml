youth_race_week_guidance:
  status: AUTHORITATIVE_PRODUCT_CONTRACT
  authority: USER_DECISION_2026_07_27
  level: A
  commercial_priority: HIGH
  extends:
  - RACE_INTELLIGENCE
  - PARENT_MODULE
  - CLUB_TEAM
  - RACE_DAY_AND_TEAM_OPERATIONS
  - EQUIPMENT_DIGITAL_BIKE_TWIN
  - NUTRITION_AND_MEAL_PLANNING
  - EXTERNAL_CALENDAR_SYNC
  objective: PROVIDE_OPTIONAL_CALM_STEP_BY_STEP_RACE_PREPARATION_FROM_SEVEN_DAYS_BEFORE_THE_EVENT_FOR_YOUTH_RIDERS_AND_PARENTS_WITH_OPTIONAL_CLUB_INTEGRATION_AND_NO_DUPLICATE_TASKS
  assistant_judgment:
    overall: VERY_VALUABLE_YOUTH_AND_PARENT_CAPABILITY
    strengths:
    - REDUCES_UNCERTAINTY_AND_STRESS_FOR_INEXPERIENCED_RIDERS_AND_PARENTS
    - CONNECTS_EXISTING_RACE_MATERIAL_NUTRITION_PARENT_CLUB_AND_TRAVEL_FUNCTIONS
    - CREATES PRACTICAL DAILY VALUE WITHOUT ADDING_NEW_COACHING_LOGIC
    cautions:
    - GUIDANCE_MUST_REMAIN_OPTIONAL_AND_AGE_APPROPRIATE
    - NORMAL_OPEN_TASKS_MUST_NOT_BE_PRESENTED_AS_ALARMS
    - CLUB_INSTRUCTIONS_MUST_NOT_BE_DUPLICATED_OR_CONTRADICTED
    - NO_WEIGHT_PERFORMANCE_OR_TACTICAL_PRESSURE
    - HEALTH_AND_PERSONAL_DATA_SHARING_MUST_REMAIN_MINIMAL
  activation:
    opt_in_per_race: REQUIRED
    suggested_when:
    - YOUTH_ATHLETE
    - FIRST_OR_EARLY_RACE_EXPERIENCE
    - PARENT_OR_GUARDIAN_REQUESTS_SUPPORT
    - CLUB_HAS_LINKED_EVENT
    may_be_disabled_any_time: true
    no_assumption_that_ALL_YOUTH_NEED_HELP: true
  personalization:
    dimensions:
    - AGE_GROUP
    - RACE_EXPERIENCE
    - RACE_TYPE
    - TRAVEL_DISTANCE
    - CLUB_INVOLVEMENT
    - EQUIPMENT_NEEDS
    - WEATHER
    - START_TIME
    - PARENT_OR_GUARDIAN_ROLE
    - ATHLETE_PREFERENCES
    complexity:
      novice: FULL_STEP_BY_STEP
      experienced: COMPACT_CHECKLIST
    tone:
      calm: REQUIRED
      neutral: REQUIRED
      non_personifying: REQUIRED
      no_pressure_or_shame: REQUIRED
  timeline:
    DAY_MINUS_7:
      objectives:
      - CONFIRM_REGISTRATION_ELIGIBILITY_CATEGORY_DATE_LOCATION_AND_START_TIME
      - COLLECT_TECHNICAL_GUIDE_ROUTE_AND_EVENT_INFORMATION
      - DETERMINE_TRAVEL_AND_TARGET_ARRIVAL_TIME
      - CONFIRM_WHO_ATTENDS_AND_WHETHER_CLUB_SUPPORT_EXISTS
      - PERFORM_INITIAL_BIKE_AND_EQUIPMENT_CHECK
    DAY_MINUS_6_TO_4:
      objectives:
      - ALIGN_TRAINING_WITH_RACE_AND_SCHOOL_OR_WORK_LOAD
      - CHECK_RECOVERY_AND_AVOID_LAST_MINUTE_OVERLOAD
      - CHECK_TIRES_BRAKES_DRIVETRAIN_AND_GEARS
      - DEFINE_SPARES_TOOLS_PUMP_CLOTHING_AND_HELMET
      - PLAN_BASIC_FOOD_AND_DRINK_PREPARATION
    DAY_MINUS_3_TO_2:
      objectives:
      - RECHECK_WEATHER_COURSE_AND_TRAVEL_CONTEXT
      - ADJUST_CLOTHING_AND_EQUIPMENT
      - COMPLETE_FINAL_BIKE_CHECK
      - PREPARE_BAG_AND_RACE_MATERIAL
      - CONFIRM_PARKING_REGISTRATION_NUMBER_PICKUP_AND_TIMING
      - SHOW_SHORT_AGE_AND_EXPERIENCE_APPROPRIATE_RACE_PLAN
    EVENING_BEFORE:
      objectives:
      - FINAL_CHECKLIST_BIKE_SHOES_HELMET_CLOTHING_LICENSE_DOCUMENTS_FOOD_DRINK_SPARES_ROUTE_AND_DEPARTURE
      - SHOW_SHORT_CALM_EXPECTATION_OF_NEXT_DAY
      - AVOID_NEW_COMPLEX_ADVICE_OR_HEAVY_ANALYSIS
    RACE_DAY_HOME:
      objectives:
      - WAKE_TIME
      - SIMPLE_MEAL_AND_HYDRATION
      - DEPARTURE_TIME
      - FINAL_MATERIAL_CHECK
      - ONLY_MOST_IMPORTANT_INFORMATION
    RACE_DAY_ON_SITE:
      objectives:
      - REGISTRATION_AND_NUMBER
      - BIKE_AND_CLOTHING_READY
      - WARM_UP
      - MATERIAL_CONTROL
      - CALL_UP_OR_START_BOX_TIME
      - WHO_TO_CONTACT_FOR_HELP
      - WHERE_PARENT_CLUB_OR_TEAM_SUPPORT_IS_LOCATED
    POST_RACE:
      objectives:
      - COOL_DOWN_DRINK_EAT_AND_CHANGE_CLOTHING
      - RECORD_CRASH_PAIN_OR_MATERIAL_ISSUE
      - DELAY_DETAILED_PERFORMANCE_EVALUATION
      - LATER_REVIEW_DATA_EXPERIENCE_AND_LEARNING_POINTS
      - RETURN_AND_CHECK_EQUIPMENT
      immediate_hard_performance_judgment: PROHIBITED
  club_integration:
    linked_club_event:
      may_supply:
      - TEAM_MEETING_AND_DEPARTURE_TIME
      - TEAM_LEADER_COACH_SOIGNEUR_OR_MECHANIC
      - CLOTHING_AND_MATERIAL_RULES
      - START_LIST_OR_RIDER_GROUP
      - TACTICAL_BRIEF
      - FOLLOW_VEHICLE_FEED_ZONE_AND_EMERGENCY_CONTACTS
      - CLUB_DOCUMENTS_AND_MESSAGES
    merge_rule:
      one_combined_plan: REQUIRED
      duplicate_tasks: PROHIBITED
      club_completed_or_owned_task:
        remove_from_parent_or_athlete_open_list: REQUIRED
        example: RESERVE_WHEELS_HANDLED_BY_MECHANIC
      unresolved_personal_task:
        remains_visible: REQUIRED
    conflict:
      club_instruction_vs_sparki:
        club_instruction_priority_for_EVENT_OPERATIONS: REQUIRED
        safety_or_legal_conflict:
          show_and_require_review: REQUIRED
      no_silent_override: true
  role_views:
    athlete:
      focus:
      - WHAT_I_NEED_TO_DO_NOW
      - MY_MATERIAL
      - MY_TIMING
      - MY_WARM_UP_AND_START
      avoid:
      - ADMIN_COMPLEXITY
      - PARENT_LOGISTICS_NOT_RELEVANT_TO_ATHLETE
    parent_or_guardian:
      focus:
      - TRAVEL
      - DOCUMENTS
      - FOOD_AND_DRINK
      - CONTACTS
      - WHAT_CLUB_HANDLES
      - WHAT_REMAINS_TO_PREPARE
      raw_private_athlete_health_data: PROHIBITED_BY_DEFAULT
    club_or_team:
      focus:
      - SHARED_TASKS
      - ROSTER
      - SUPPORT_ASSIGNMENTS
      - CLUB_MESSAGES
      - TASK_OWNERSHIP
    permissions:
      least_privilege: REQUIRED
      purpose_limited: REQUIRED
      server_side_enforced: REQUIRED
  task_model:
    task_fields:
    - TITLE
    - DUE_WINDOW
    - OWNER
    - STATUS
    - SOURCE_PERSONAL_OR_CLUB
    - OPTIONAL_CONTEXT
    - COMPLETION_TIME
    owner_options:
    - ATHLETE
    - PARENT_OR_GUARDIAN
    - CLUB
    - TEAM_LEADER
    - MECHANIC
    - SOIGNEUR
    - DRIVER
    task_status:
    - OPEN
    - COMPLETED
    - NOT_APPLICABLE
    - BLOCKED
    - HANDLED_BY_CLUB
    warnings:
      normal_open_task_red_alarm: PROHIBITED
      urgent_only_for:
      - MISSED_REGISTRATION_OR_START_RISK
      - SAFETY_CRITICAL_MATERIAL_ISSUE
      - MISSING_REQUIRED_DOCUMENT
      - VERIFIED_TRAVEL_OR_EVENT_DISRUPTION
      - MEDICAL_OR_SAFETY_SIGNAL_REQUIRING_ACTION
  learning_after_race:
    user_feedback:
    - WHAT_WAS_USEFUL
    - WHAT_WAS_MISSING
    - WHAT_WAS_NOT_NEEDED
    - WHAT_SHOULD_BE_REMEMBERED_NEXT_TIME
    personalization:
      may_adjust_future_checklist: true
      silent_removal_of_SAFETY_CRITICAL_TASKS: PROHIBITED
      user_can_reset_preferences: REQUIRED
    no_public_comparison_or_ranking: true
  privacy_and_safety:
    minor_data:
      minimum_required: true
      no_unnecessary_health_sharing: true
    no_weight_or_body_pressure: REQUIRED
    no_food_moralizing: REQUIRED
    no_tactical_instruction_contradicting_AUTHORIZED_CLUB_COACH: REQUIRED
    incident_or_pain:
      non_diagnostic: REQUIRED
      professional_or_parent_route_when_relevant: REQUIRED
    emergency_contacts:
      visible_only_to_AUTHORIZED_ROLES: REQUIRED
  errors_and_empty:
  - EVENT_NOT_LINKED
  - START_TIME_OR_LOCATION_UNKNOWN
  - CLUB_INFORMATION_MISSING
  - TASK_OWNER_UNKNOWN
  - MATERIAL_PROFILE_INCOMPLETE
  - WEATHER_OR_ROUTE_UNAVAILABLE
  - CLUB_AND_PERSONAL_TASK_CONFLICT
  behavior:
    honest_empty_state: REQUIRED
    manual_completion_allowed: true
    no_mock_event_or_club_data: true
    previous_confirmed_information_preserved_on_FAILURE: true
  release_strategy:
    full_consumer_sparki_release_blocked_by_this_capability: false
    capability_default: OFF_UNTIL_OWN_GATE_PASSES
    phased_activation:
    - PERSONAL_YOUTH_RACE_WEEK
    - PARENT_VIEW
    - CLUB_MERGE_AND_TASK_OWNERSHIP
    - POST_RACE_LEARNING
    each_phase_requires_own_evidence: true
  release_gates:
    PERSONAL_YOUTH_RACE_WEEK:
    - SEVEN_DAY_TIMELINE_AND_DAY_OF_STATES_TESTED
    - NOVICE_AND_EXPERIENCED_DENSITY_TESTED
    - NO_PRESSURE_WEIGHT_OR_FALSE_ALARM_LANGUAGE
    PARENT_VIEW:
    - PARENT_TASKS_AND_ATHLETE_PRIVACY_TESTED
    - NO_RAW_HEALTH_DATA_DEFAULT_SHARING
    - TRAVEL_DOCUMENT_AND_CONTACT_FLOWS_TESTED
    CLUB_MERGE_AND_TASK_OWNERSHIP:
    - CLUB_AND_PERSONAL_TASKS_MERGED_WITHOUT_DUPLICATES
    - TASK_OWNER_AND_HANDLED_BY_CLUB_STATES_TESTED
    - CLUB_INSTRUCTION_AND_SAFETY_CONFLICTS_TESTED
    POST_RACE_LEARNING:
    - NO_IMMEDIATE_HARD_PERFORMANCE_JUDGMENT
    - FEEDBACK_PERSONALIZATION_AND_RESET_TESTED
    - SAFETY_CRITICAL_TASKS_NOT_SILENTLY_REMOVED
  build_sequence:
    execution_mode: SEQUENTIAL
    one_active_replit_task_maximum: 1
    YR_00:
      name: CURRENT_STATE_AND_REUSE_AUDIT
      objective: AUDIT_EXISTING_RACE_PARENT_CLUB_MATERIAL_NUTRITION_TRAVEL_AND_NOTIFICATION_CODE_WITHOUT_CODE_CHANGE
      code_change: PROHIBITED
    YR_01:
      name: RACE_WEEK_TASK_AND_TIMELINE_MODEL
      objective: BUILD_SEVEN_DAY_TASK_TIMELINE_OWNER_STATUS_AND_PERSONALIZATION_MODEL
    YR_02:
      name: ATHLETE_AND_PARENT_SURFACES
      objective: BUILD_CALM_ROLE_SPECIFIC_NOW_NEXT_AND_CHECKLIST_VIEWS
    YR_03:
      name: CLUB_EVENT_MERGE
      objective: MERGE_CLUB_INFORMATION_TASK_OWNERSHIP_AND_PERSONAL_PREPARATION_WITHOUT_DUPLICATION
    YR_04:
      name: RACE_DAY_AND_POST_RACE_FLOW
      objective: BUILD_HOME_ON_SITE_AND_POST_RACE_STATES_WITH_DELAYED_REFLECTION
    YR_05:
      name: CAPABILITY_RELEASE_EVIDENCE
      objective: PRODUCE_ROLE_PRIVACY_DUPLICATION_LANGUAGE_SAFETY_TIMELINE_AND_USER_ACCEPTANCE_EVIDENCE
    task_order:
    - YR_00
    - YR_01
    - YR_02
    - YR_03
    - YR_04
    - YR_05
