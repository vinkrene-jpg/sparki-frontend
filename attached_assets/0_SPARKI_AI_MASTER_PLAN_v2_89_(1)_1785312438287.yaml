route_line_direct_manipulation:
  status: AUTHORITATIVE_PRODUCT_CONTRACT
  authority: USER_DECISION_2026_07_27
  level: A
  extends:
  - ROUTES_NAVIGATION
  - RN_01D_ROUTE_EDITING_AND_WAYPOINTS
  objective: ALLOW_USERS_TO_GRAB_ANY_POINT_ON_A_PLANNED_ROUTE_LINE_AND_RESHAPE_THE_LOCAL_ROUTE_SEGMENT_WITHOUT_TURNING_EVERY_SHAPING_ACTION_INTO_A_NAMED_WAYPOINT
  benchmark: KOMOOT_GRADE_DIRECT_ROUTE_MANIPULATION_WITH_OWN_IMPLEMENTATION_AND_DESIGN
  concept_boundary:
    named_waypoint_or_stop:
      meaning: EXPLICIT_LOCATION_STOP_OR_ORDERED_ROUTE_POINT
      user_visible_identity: REQUIRED
      may_have:
      - NAME
      - PURPOSE
      - NOTIFICATION
      - STOP_BEHAVIOR
    route_shaping_point:
      meaning: GEOMETRY_ONLY_CONTROL_POINT
      user_visible_as_named_stop: PROHIBITED_BY_DEFAULT
      affects_geometry: true
      creates_navigation_notification: false
      data_model_reuse: ROUTES_NAVIGATION.point_taxonomy.ROUTE_SHAPING_POINT
    both_may_coexist: true
    conversion_between_types:
      automatic_conversion: PROHIBITED
      explicit_user_action_required: true
  interaction:
    entry:
      desktop:
      - POINTER_HOVER_OR_PROXIMITY_REVEALS_DRAGGABLE_ROUTE_HANDLE
      - CLICK_HOLD_AND_DRAG_ROUTE_LINE
      touch:
      - TOUCH_AND_SHORT_HOLD_ROUTE_LINE
      - THEN_DRAG
      short_tap_without_hold:
        starts_drag: false
        preserves_existing_map_or_route_tap_behavior: true
    during_drag:
    - SHOW_FLUID_LOCAL_VISUAL_PREVIEW
    - MOVE_ONLY_SEGMENT_BETWEEN_NEAREST_VALID_ROUTE_ANCHORS
    - KEEP_START_FINISH_NAMED_WAYPOINTS_AND_OTHER_ANCHORS_FIXED
    - DO_NOT_CALL_ROUTING_PROVIDER_FOR_EVERY_POINTER_OR_TOUCH_MOVEMENT
    - SHOW_PENDING_OR_PREVIEW_STATE_DISTINCT_FROM_CONFIRMED_ROUTE
    distance_and_elevation:
      live_during_drag: OPTIONAL_WHEN_PERFORMANCE_ALLOWS_WITHOUT_PROVIDER_CALL
      stale_values_must_not_look_current: true
      update_after_release_and_valid_route_recalculation: REQUIRED
    on_release:
    - CREATE_OR_UPDATE_ROUTE_SHAPING_POINT
    - RUN_ONE_CANONICAL_ROUTE_RECALCULATION
    - RESPECT_ACTIVE_BIKE_PROFILE
    - RESPECT_SURFACE_AND_WAY_TYPE_PREFERENCES
    - RESPECT_AVOIDANCES_AND_ACCESS_RESTRICTIONS
    - VALIDATE_ROUTE_CONTINUITY_AND_POINT_ORDER
    - UPDATE_DISTANCE_ELEVATION_SURFACE_AND_WAY_TYPE_OUTPUTS
    snap_rule:
      nearest_geometric_path_only: PROHIBITED
      required: NEAREST_VALID_ROUTABLE_LOCATION_COMPATIBLE_WITH_ACTIVE_PROFILE_AND_CURRENT_ROUTE_CONSTRAINTS
      if_release_location_is_invalid:
        preferred_behavior:
        - SHOW_NEAREST_VALID_CANDIDATE
        - EXPLAIN_SHORTLY_WHY_EXACT_LOCATION_CANNOT_BE_USED
        - ALLOW_USER_TO_ACCEPT_OR_CANCEL
        silent_large_snap: PROHIBITED
        silent_invalid_route_creation: PROHIBITED
    undo:
      immediate_single_step_undo: REQUIRED
      session_undo_history: BOUNDED_AND_VERSION_SAFE
      undo_preserves_previous_confirmed_route: REQUIRED
  performance_and_provider_load:
    routing_calls_during_pointer_or_touch_move: PROHIBITED
    routing_call_trigger: RELEASE_OR_EXPLICIT_CONFIRMATION_ONLY
    rapid_successive_drags:
      cancel_stale_request: REQUIRED
      latest_intent_wins: REQUIRED
      stale_response_may_overwrite_new_route: PROHIBITED
    target:
      preview_response: IMMEDIATE_LOCAL_RENDER
      first_confirmed_recalculated_route: FOLLOWS_ROUTE_GENERATION_PERFORMANCE_CONTRACT
    enrichment:
      distance_elevation_surface_and_way_type_may_complete_AFTER_BASE_ROUTE: true
      base_route_must_not_disappear_while_enrichment_loads: true
    cache_and_deduplication:
      reuse_existing_route_request_controls: REQUIRED
  touch_map_disambiguation:
    problem: USER_MUST_BE_ABLE_TO_PAN_MAP_WITHOUT_ACCIDENTALLY_RESHAPING_ROUTE
    requirements:
    - HOLD_THRESHOLD_BEFORE_ROUTE_DRAG_ACTIVATES
    - VISIBLE_HANDLE_OR_HIGHLIGHT_ON_ACTIVATION
    - HAPTIC_FEEDBACK_WHEN_PLATFORM_SUPPORTS_AND_USER_SETTINGS_ALLOW
    - MAP_PAN_DISABLED_ONLY_FOR_ACTIVE_DRAG_GESTURE
    - RELEASING_OR_CANCELLING_RESTORES_MAP_PAN
    - ACCESSIBLE_TOUCH_TARGET
    - ZOOM_DEPENDENT_HIT_RADIUS_WITHOUT_GRABBING_UNRELATED_ROUTE_SEGMENT
    cancellation:
    - ESCAPE_ON_DESKTOP
    - CANCEL_ACTION_ON_TOUCH
    - POINTER_OR_TOUCH_CANCEL_EVENT
    result: RESTORE_LAST_CONFIRMED_ROUTE
  offline_and_degraded_connectivity:
    local_preview:
      allowed: true
      visual_form: CLEARLY_PENDING_APPROXIMATE_GEOMETRY
      may_look_like_CONFIRMED_ROUTED_PATH: false
    definitive_save_without_successful_route_validation: PROHIBITED
    on_connection_restore:
    - REVALIDATE_RELEASE_LOCATION
    - RUN_CANONICAL_ROUTE_RECALCULATION
    - REQUIRE_VALID_RESULT_BEFORE_COMMIT
    if_recalculation_fails:
    - PRESERVE_PREVIOUS_CONFIRMED_ROUTE
    - PRESERVE_USER_INTENT_AS_RETRYABLE_PENDING_CHANGE_WHEN_SAFE
    - SHOW_RETRY_OR_CANCEL
    - NO_FALSE_SUCCESS
  safety_and_scope:
    available_in:
    - ROUTE_PLANNER
    - PRE_RIDE_ROUTE_EDITING
    unavailable_in:
    - ACTIVE_TURN_BY_TURN_NAVIGATION
    - LOCKED_OFFICIAL_RACE_ROUTE_WITHOUT_COPY_OR_EDIT_PERMISSION
    active_ride_route_changes:
      use_separate_safe_waypoint_or_rerouting_flow: REQUIRED
    permissions:
      owner_or_authorized_editor: REQUIRED
      shared_read_only_route_drag: PROHIBITED
    original_route_and_source:
      preserve_when_imported_or_official: REQUIRED
      edit_creates_new_version_or_user_copy: REQUIRED
  accessibility:
    mouse_only_interaction: PROHIBITED
    alternatives:
    - KEYBOARD_SELECT_ROUTE_SEGMENT_AND_MOVE_SHAPING_POINT
    - ACCESSIBLE_ADD_OR_EDIT_SHAPING_POINT_FLOW
    screen_reader:
      announce:
      - ROUTE_SEGMENT_SELECTED
      - SHAPING_POINT_MOVED
      - RECALCULATION_PENDING
      - ROUTE_UPDATED_OR_REJECTED
    color_only_preview_state: PROHIBITED
  errors_and_empty:
  - ROUTE_NOT_EDITABLE
  - NO_VALID_ROUTABLE_LOCATION_NEAR_RELEASE_POINT
  - ROUTING_PROVIDER_TIMEOUT
  - RATE_LIMIT
  - OFFLINE_PENDING_VALIDATION
  - STALE_RECALCULATION_CANCELLED
  - ROUTE_CONSTRAINT_CONFLICT
  - EDIT_PERMISSION_DENIED
  error_behavior:
    previous_confirmed_route_remains_visible: REQUIRED
    input_and_pending_intent_preserved_WHEN_SAFE: REQUIRED
    retry_or_cancel: REQUIRED
  tests:
  - DESKTOP_HOVER_GRAB_DRAG_RELEASE
  - TOUCH_HOLD_DRAG_WITHOUT_ACCIDENTAL_MAP_PAN
  - SHORT_TAP_DOES_NOT_DRAG
  - ONLY_LOCAL_SEGMENT_CHANGES
  - ONE_ROUTING_CALL_ON_RELEASE
  - NO_ROUTING_CALL_DURING_DRAG
  - RAPID_DRAGS_CANCEL_STALE_REQUEST_AND_LATEST_WINS
  - ROAD_GRAVEL_MTB_EBIKE_PROFILE_CONSTRAINTS
  - SURFACE_WAY_TYPE_AND_AVOIDANCE_PRESERVATION
  - INVALID_RELEASE_LOCATION_ACCEPT_OR_CANCEL
  - NO_SILENT_LARGE_SNAP
  - DISTANCE_AND_ELEVATION_UPDATE_AFTER_RELEASE
  - UNDO_RESTORES_PREVIOUS_ROUTE
  - OFFLINE_PREVIEW_NOT_COMMITTED_WITHOUT_VALIDATION
  - IMPORTED_OR_OFFICIAL_ROUTE_CREATES_VERSION_OR_COPY
  - READ_ONLY_SHARED_ROUTE_CANNOT_BE_EDITED
  - KEYBOARD_AND_SCREEN_READER_ALTERNATIVE
  - MOBILE_390_TABLET_768_DESKTOP_1440
  - NO_HORIZONTAL_OVERFLOW_OR_MAP_CONTROL_COLLISION
  release_gate:
    scope: ROUTE_LINE_DIRECT_MANIPULATION_CAPABILITY_ONLY
    entire_sparki_release_blocked_by_this_capability: false
    capability_may_not_be_publicly_enabled_until:
    - TOUCH_AND_MOUSE_DRAG_TESTED
    - MAP_PAN_DISAMBIGUATION_TESTED
    - ONE_PROVIDER_CALL_ON_RELEASE_PROVEN
    - PROFILE_SURFACE_WAY_TYPE_AND_AVOIDANCE_RULES_PRESERVED
    - INVALID_LOCATION_AND_SNAP_CONFIRMATION_TESTED
    - UNDO_TESTED
    - OFFLINE_OR_PROVIDER_FAILURE_PRESERVES_PREVIOUS_ROUTE
    - ACCESSIBILITY_ALTERNATIVE_TESTED
    failed_validation:
      action: KEEP_CAPABILITY_DISABLED_OR_BEHIND_NON_PUBLIC_FLAG
      unrelated_route_planner_and_navigation_release: MAY_CONTINUE_IF_ITS_OWN_GATES_PASS
  build_sequence:
    execution_mode: SEQUENTIAL
    one_active_replit_task_maximum: 1
    RL_00:
      name: CURRENT_STATE_AND_DATA_MODEL_AUDIT
      objective: AUDIT_ROUTE_LINE_INTERACTION_SHAPING_POINT_ANCHOR_VERSION_PERMISSION_AND_PROVIDER_REQUEST_FLOW
      code_change: PROHIBITED
    RL_01:
      name: LOCAL_PREVIEW_GESTURE
