    expression: VO2MAX_ML_KG_MIN_EQUALS_16_6_PLUS_8_87_TIMES_FIVE_MINUTE_POWER_W_PER_KG
    intercept: 16.6
    coefficient: 8.87
    input_metric: BEST_VALID_CONTINUOUS_FIVE_MINUTE_AVERAGE_POWER_W_PER_KG
    output_unit: ml_per_kg_per_min
  classification:
    result_type: ESTIMATE
    never_present_as:
    - LAB_MEASUREMENT
    - MEDICAL_DIAGNOSIS
    - DIRECT_PHYSIOLOGICAL_MEASUREMENT
    lab_measurement_precedence: LAB_VALUE_ALWAYS_LEADING_WHEN_AVAILABLE
