  - SHOW_FIVE_MINUTE_POWER_WATTS_AND_W_PER_KG
  - SHOW_BODY_WEIGHT_DATE_OR_PERIOD
  - SHOW_CONFIDENCE_LOW_MEDIUM_OR_HIGH
  - SHOW_DATA_QUALITY_AND_MISSING_SIGNAL_STATE_WHERE_RELEVANT
  - DO_NOT_SHOW_A_NUMBER_WHEN_RELIABILITY_GATE_FAILS
