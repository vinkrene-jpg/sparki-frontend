SENSOR_PAIRING_AND_RELIABILITY:
  status: AUTHORITATIVE_ADDITION_EXTENDS_MOBILE_RECORDING_SENSORS
  authority: USER_DECISION_2026_07_27
  level: B
  extends: batch_002_production_contracts.MOBILE_RECORDING_SENSORS
  reason: EXISTING_CONTRACT_HAD_PROTOCOLS_AND_PLATFORM_BOUNDARY_BUT_NO_PAIRING_FLOW_ERROR_HANDLING_FIRMWARE_OR_BATTERY_NOTIFICATION
  unrelated_to: RN_01G.BATTERY_AND_UPDATE_POLICY
  clarification: THAT_REMOVED_FEATURE_WAS_ABOUT_LIVE_FRIENDS_SHARING_BATTERY_IMPACT_NOT_SENSOR_HARDWARE_BATTERY_LEVEL
  pairing_flow:
    entry_points:
    - ONBOARDING_SENSOR_PAIRING_STEP
    - SETTINGS_MANAGE_SENSORS
    - PRE_RIDE_QUICK_PAIR
    steps:
    - SCAN_FOR_NEARBY_DEVICES
    - LIST_BY_TYPE_HEART_RATE_POWER_CADENCE_SPEED_EBIKE
    - SIGNAL_STRENGTH_INDICATOR: REQUIRED
    - CONFIRM_PAIR
    - SAVE_AS_PREFERRED_DEVICE_FOR_THIS_BIKE_OR_PROFILE: OPTIONAL
    multiple_same_type_sensors:
      behavior: USER_SELECTS_WHICH_IS_PRIMARY
      silent_arbitrary_selection: PROHIBITED
    protocol_priority_when_both_available:
      default: BLUETOOTH
      ant_plus_preferred_when: USER_HAS_MULTIPLE_ANT_PLUS_ONLY_DEVICES_AND_ANDROID_NATIVE_SUPPORT_CONFIRMED
  connection_error_states:
    required_states:
    - SEARCHING
    - CONNECTED
    - CONNECTION_LOST_MID_ACTIVITY
    - PAIRING_FAILED
    - SENSOR_NOT_FOUND
    - SENSOR_INCOMPATIBLE_OR_UNSUPPORTED
    connection_lost_mid_activity:
      behavior:
      - CONTINUE_RECORDING_OTHER_AVAILABLE_METRICS
      - VISIBLE_NON_BLOCKING_INDICATOR
      - AUTOMATIC_RECONNECT_ATTEMPT: REQUIRED
      - GAP_MARKED_IN_RECORDED_DATA_NOT_INTERPOLATED
      reused_from: data_quality_and_edge_cases.data_gaps
      silent_failure: PROHIBITED
    pairing_failed:
      behavior:
      - CLEAR_REASON_WHEN_KNOWN
      - RETRY_ACTION_VISIBLE
      - LINK_TO_TROUBLESHOOTING_HELP
      reused_from: HELPDESK_AND_SUPPORT_CASES.faq_and_self_service
  firmware_and_compatibility:
    old_or_unsupported_firmware:
      detection: WHERE_TECHNICALLY_POSSIBLE_VIA_DEVICE_HANDSHAKE
      behavior:
      - INFORM_USER_FIRMWARE_MAY_LIMIT_FUNCTIONALITY
      - DO_NOT_BLOCK_BASIC_PAIRING_WHEN_PARTIAL_DATA_STILL_USABLE
      - NO_FALSE_CLAIM_OF_FULL_COMPATIBILITY
      device_and_sensor_provenance_field: REQUIRED
      reused_from: MOBILE_RECORDING_SENSORS.requirements.DEVICE_AND_SENSOR_PROVENANCE
    unknown_or_unverified_device:
      behavior: ATTEMPT_STANDARD_PROTOCOL_CONNECTION_WITHOUT_CLAIMING_VERIFIED_COMPATIBILITY
      device_claims_require_real_test: REUSED_FROM_RACE_INTELLIGENCE.export_center
  sensor_battery_notification:
    applies_to:
    - HEART_RATE_STRAP
    - POWER_METER
    - CADENCE_SENSOR
    - SPEED_SENSOR
    - EBIKE_BATTERY_WHEN_PAIRED
    source: STANDARD_BLUETOOTH_OR_ANT_PLUS_BATTERY_SERVICE_WHEN_BROADCAST_BY_DEVICE
    display:
      settings_sensor_list: REQUIRED
      pre_ride_check: REQUIRED_WHEN_AVAILABLE
      in_ride_low_battery_warning:
        threshold: DEVICE_REPORTED_LOW_BATTERY_FLAG_OR_VERSIONED_PERCENT_THRESHOLD
        behavior: NON_BLOCKING_NOTIFICATION_NOT_MID_RIDE_INTERRUPTION_UNLESS_SAFETY_CRITICAL_SENSOR
      no_battery_data_available:
        behavior: HONEST_EMPTY_STATE
        fabricate_battery_percentage: PROHIBITED
      reused_from: global_data_trust
  release_gate:
    v1_launch_blocked_until:
    - PAIRING_FLOW_TESTED_FOR_EACH_SENSOR_TYPE
    - CONNECTION_LOSS_AND_RECONNECT_TESTED_MID_ACTIVITY
    - LOW_BATTERY_NOTIFICATION_TESTED_WHERE_DEVICE_SUPPORTS_IT
    - REAL_DEVICE_TEST_ACROSS_AT_LEAST_ONE_ANT_PLUS_AND_ONE_BLUETOOTH_DEVICE_PER_SENSOR_TYPE
    failed_validation_blocks_release: REQUIRED
  replit_tasks:
    SP_00: AUDIT_EXISTING_SENSOR_CONNECTION_CODE_AND_PROTOCOL_SUPPORT
    SP_01: BUILD_PAIRING_FLOW_WITH_SIGNAL_STRENGTH_AND_MULTI_DEVICE_SELECTION
    SP_02: BUILD_CONNECTION_ERROR_STATES_AND_RECONNECT_LOGIC
    SP_03: BUILD_FIRMWARE_COMPATIBILITY_DETECTION_AND_HONEST_MESSAGING
    SP_04: BUILD_SENSOR_BATTERY_DISPLAY_AND_LOW_BATTERY_NOTIFICATION
    SP_05: REAL_DEVICE_TEST_MATRIX_AND_EVIDENCE_REPORT
