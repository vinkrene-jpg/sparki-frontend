      - ROAD
      - GRAVEL
      - MTB
      stationary_support:
      - SMART_TRAINER
      - WHEEL_ON_TRAINER
      - ROLLERS_ONLY_WHEN_STABLE_AND_CAPTURE_QUALITY_PASSES
      camera:
      - PHONE_ON_STABLE_TRIPOD
      - TABLET_ON_STABLE_TRIPOD
      capture_surface:
        preferred: NATIVE_MOBILE
        web_upload_fallback: ALLOWED
        live_PWA_equivalence_claim: PROHIBITED_UNTIL_PROVEN
    excluded_initial_context:
    - TRIATHLON_TIME_TRIAL_POSITION
    - TANDEM
    - RECUMBENT
    - CARGO_BIKE
    - EBIKE_WITH_NONSTANDARD_GEOMETRY
    - OUTDOOR_MOVING_CAPTURE
    - STANDING_SPRINT
    - CLEAT_POSITION_RECOMMENDATION
    - SADDLE_PRESSURE_DIAGNOSIS
    - AERODYNAMIC_OPTIMIZATION
    - MEDICAL_OR_REHABILITATION_FIT
    end_to_end_flow:
    - ELIGIBILITY_AND_CONSENT
    - SELECT_CONFIRMED_BIKE_PROFILE
    - SELECT_DISCIPLINE_GOAL_AND_RIDING_CONTEXT
    - RECORD_DISCOMFORT_AND_RELEVANT_LIMITATIONS
    - CONFIRM_CURRENT_BIKE_MEASUREMENTS
    - GUIDED_CAMERA_AND_TRAINER_SETUP
    - WARM_UP
    - CAPTURE_BASELINE_SIDE_VIDEO
    - AUTOMATIC_CAPTURE_QUALITY_GATE
    - POSE_EXTRACTION
    - DETERMINISTIC_PEDAL_CYCLE_AND_ANGLE_CALCULATION
    - CONFIDENCE_AND_VALIDITY_GATE
    - OBSERVATION_REPORT
    - ZERO_OR_ONE_SAFE_INCREMENTAL_ADJUSTMENT
    - USER_CONFIRMS_EXACT_PHYSICAL_CHANGE
    - ADAPTATION_PERIOD
    - RETEST_SAME_PROTOCOL
    - BEFORE_AFTER_COMPARISON
    - KEEP_OR_ROLL_BACK
    screens:
    - BIKE_FIT_ELIGIBILITY
    - BIKE_AND_GOAL
    - CURRENT_MEASUREMENTS
    - SETUP_GUIDE
    - CAMERA_ALIGNMENT
    - WARMUP_AND_TARGET_EFFORT
    - CAPTURE
    - QUALITY_RESULT
    - ANALYSIS
    - ADJUSTMENT
    - RETEST
    - COMPARISON
    - HISTORY
    - PRIVACY_AND_DELETE
    eligibility:
      required:
      - AUTHENTICATED_USER
      - CONFIRMED_BIKE_OWNER_OR_AUTHORIZED_ROLE
      - EXPLICIT_VIDEO_ANALYSIS_CONSENT
      - PHYSICAL_ADJUSTMENT_RESPONSIBILITY_ACKNOWLEDGED
      minor:
        parental_consent: REQUIRED
        coach_only_consent: INSUFFICIENT
        media_sharing: DENIED_BY_DEFAULT
      stop_and_refer:
      - ACUTE_OR_SEVERE_PAIN
      - NUMBNESS_WITH_NEUROLOGICAL_WARNING
      - RECENT_SURGERY
      - UNSTABLE_INJURY
      - USER_CANNOT_SAFELY_MOUNT_OR_PEDAL
      - BIKE_OR_TRAINER_UNSTABLE
    rider_inputs:
      required:
      - HEIGHT
      - BIKE_ID
      - BIKE_TYPE
      - RIDING_GOAL
      - EXPERIENCE_LEVEL
      - WEEKLY_VOLUME
      - CURRENT_POSITION_MEASUREMENTS
      - CRANK_LENGTH
      - CAMERA_SIDE
      optional:
      - INSEAM
      - SHOULDER_WIDTH
      - MOBILITY_LIMITATION
      - DISCOMFORT_LOCATION
      - DISCOMFORT_SEVERITY
      - FTP
      - POWER
      - CADENCE
      - TARGET_EVENT
      data_reuse:
        source:
        - SPORT_PASSPORT
        - BIKE_PROFILE
        - TRAINING_HISTORY
        user_confirmation_before_analysis: REQUIRED
        silently_assume_missing_measurement: PROHIBITED
    bike_measurements:
      initial_required:
      - SADDLE_HEIGHT_BB_CENTER_TO_SADDLE_REFERENCE
      - SADDLE_SETBACK
      - CRANK_LENGTH
      - STEM_LENGTH
      - HANDLEBAR_REACH
      - SADDLE_TO_BAR_DROP
      capture_method:
        guided_manual_measurement: REQUIRED
        reuse_confirmed_bike_scan_data: ALLOWED
        AI_image_estimate_as_confirmed_value: PROHIBITED
      units_storage: SI_CANONICAL
      source_and_timestamp: REQUIRED
      pre_change_snapshot: REQUIRED
    capture_protocol:
      warmup:
        required: true
        configurable_minutes:
          default: 8
          min: 5
          max: 15
      baseline_effort:
        target: STABLE_ENDURANCE
        power_when_FTP_available:
          min_percent_FTP: 55
          max_percent_FTP: 75
        fallback_RPE:
          min: 3
          max: 4
        cadence_target_rpm:
          min: 80
          max: 95
        out_of_target:
          block_capture: false
          reduce_confidence: true
      video:
        primary_view: SIDE_SAGITTAL
        duration_seconds:
          min: 15
          target: 20
          max: 30
        full_rider_and_bike_visible: REQUIRED
        fixed_camera: REQUIRED
        camera_height_target: CRANK_SPINDLE
        camera_perpendicular_to_bike: REQUIRED
        zoom_change_during_capture: PROHIBITED
        minimum_resolution: 720P
        preferred_frame_rate_fps: 60
        minimum_frame_rate_fps: 30
      future_views:
        front_or_rear:
          status: LATER_AFTER_VALIDATION
          purpose:
          - FRONTAL_KNEE_TRACKING
          - PELVIC_LATERAL_MOVEMENT
        opposite_side:
          status: OPTIONAL_AFTER_INITIAL_VALIDATION
          purpose: BILATERAL_COMPARISON
    capture_quality_gate:
      fail_closed: true
      checks:
      - EXACTLY_ONE_RIDER
      - FULL_BODY_AND_BIKE_IN_FRAME
      - REQUIRED_LANDMARK_VISIBILITY
      - CAMERA_STABILITY
      - CAMERA_ROLL
      - CAMERA_PERSPECTIVE
      - LIGHTING
      - SHARPNESS
      - FRAME_RATE
      - VIDEO_DURATION
      - PEDALING_CONTINUITY
      - CADENCE_STABILITY
      - MINIMUM_COMPLETE_PEDAL_CYCLES
      thresholds:
        source: VERSIONED_VALIDATION_CONFIG
        arbitrary_unvalidated_production_threshold: PROHIBITED
      failure_result:
      - EXACT_REASON
      - CORRECTION_INSTRUCTION
      - RETAKE
      low_confidence_recommendation: PROHIBITED
    computer_vision:
      role: BODY_LANDMARK_OBSERVATION_ONLY
      generative_model_for_coordinates: PROHIBITED
      adapter_interface:
        inputs:
        - DECODED_VIDEO_FRAMES
        - FRAME_TIMESTAMPS
        - CAMERA_METADATA
        outputs:
        - MODEL_ID
        - MODEL_VERSION
        - LANDMARK_SCHEMA
        - LANDMARK_COORDINATES_PER_FRAME
        - LANDMARK_CONFIDENCE_PER_FRAME
        - PROCESSING_DEVICE
        - PROCESSING_DURATION
      candidate_baseline:
        MEDIAPIPE_POSE_LANDMARKER:
          status: EVALUATE_NOT_BLINDLY_ADOPT
          reason:
          - VIDEO_AND_LIVE_STREAM_MODES
          - BODY_LANDMARK_OUTPUT
          - WEB_ANDROID_IOS_GUIDANCE
      selection_gate:
      - LICENSE_REVIEW
      - TARGET_PLATFORM_BENCHMARK
      - CYCLING_OCCLUSION_TEST
      - DEVICE_PERFORMANCE_TEST
      - VALIDATION_AGAINST_REFERENCE
      provider_abstraction: REQUIRED
      model_version_pinned_and_audited: true
      model_update_requires_regression_and_revalidation: true
    deterministic_measurement_engine:
      AI_or_LLM_numeric_calculation: PROHIBITED
      cycle_detection:
        reference_candidates:
        - ANKLE_TRAJECTORY
        - KNEE_TRAJECTORY
        - FOOT_INDEX_TRAJECTORY
        method: VERSIONED_DETERMINISTIC_SIGNAL_PROCESSING
        complete_cycles_required: CONFIGURED_BY_VALIDATION
      measurements:
      - KNEE_FLEXION_EXTENSION_BY_CRANK_PHASE
      - HIP_FLEXION_EXTENSION_BY_CRANK_PHASE
      - ANKLE_DORSI_PLANTARFLEXION_BY_CRANK_PHASE
      - TORSO_ANGLE
      - SHOULDER_ANGLE
      - ELBOW_ANGLE
      - PELVIC_VERTICAL_MOVEMENT_PROXY
      - JOINT_RANGE_OF_MOTION
      - PEDAL_CYCLE_VARIABILITY
      aggregation:
      - MEDIAN
      - INTERQUARTILE_RANGE
      - CYCLE_TO_CYCLE_VARIABILITY
      - VALID_FRAME_PERCENTAGE
      every_output_requires:
      - VALUE
      - UNIT
      - CONFIDENCE
      - INPUT_PROVENANCE
      - ENGINE_VERSION
      - CAPTURE_VIEW
      no_valid_measurement: HONEST_UNAVAILABLE
    fit_rules:
      structure: VERSIONED_DETERMINISTIC_RULE_SET
      dimensions:
      - BIKE_TYPE
      - RIDING_GOAL
      - EXPERIENCE_LEVEL
      - RIDER_MOBILITY
      - CURRENT_DISCOMFORT
      - MEASUREMENT_CONFIDENCE
      - CURRENT_BIKE_ADJUSTABILITY
      target_windows:
        universal_single_angle_target: PROHIBITED
        source_citation_per_rule: REQUIRED
        qualified_review_before_activation: REQUIRED
        validation_status_per_rule: REQUIRED
      conflict_resolution:
        safety_wins: true
        comfort_before_unvalidated_performance_gain: true
        conflicting_signals: OBSERVATION_ONLY_NO_ADJUSTMENT
    recommendation_engine:
      numeric_change_owner: DETERMINISTIC_RULE_ENGINE
      LLM_role:
