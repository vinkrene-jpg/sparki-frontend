food_photo_handling:
  status: AUTHORITATIVE_PRODUCT_CONTRACT
  authority: USER_DECISION_2026_07_27
  level: B
  commercial_priority: MEDIUM
  extends:
  - NUTRITION_AND_MEAL_PLANNING
  - PRIVACY_DATA_TRUST
  - YOUTH_ATHLETE_RELEASE_READINESS
  - EXTERNAL_INTEGRATIONS
  objective: SUPPORT_IMPORTED_NUTRITION_RECORDS_AND_OPTIONAL_QUICK_FOOD_PHOTO_ESTIMATION_AS_TWO_STRICTLY_SEPARATED_CAPABILITIES_WITH_PROVENANCE_UNCERTAINTY_PRIVACY_AND_MINOR_SAFETY_BY_DEFAULT
  assistant_judgment:
    overall: USEFUL_WHEN_NARROWLY_SCOPED
    strengths:
    - ALLOWS_FAST_TRAINING_RELATED_FOOD_CONTEXT_WITHOUT_BUILDING_A_FULL_FOOD_TRACKING_PLATFORM
    - KEEPS_IMPORTED_RECORDS_DISTINCT_FROM_IMAGE_BASED_ESTIMATES
    - RANGES_AND_CONFIDENCE_REDUCE_FALSE_PRECISION
    cautions:
    - FOOD_RECOGNITION_ACCURACY_DOES_NOT_PROVE_PORTION_OR_MACRO_ACCURACY
    - IMPORTED_PROVIDER_DATA_IS_NOT_AUTOMATICALLY_MEASURED
    - A_PHOTO_ALONE_IS_INSUFFICIENT_FOR_PERSONALIZED_FUELING_DECISIONS
    - FOOD_IMAGES_ARE_SENSITIVE_AND_REQUIRE_EXPLICIT_RETENTION_RULES
    - MINOR_USAGE_MAY_INTERACT_WITH_BODY_IMAGE_OR_RESTRICTIVE_BEHAVIOR
  capability_split:
    IMPORTED_NUTRITION_RECORD:
      role: DISPLAY_AND_USE_PROVIDER_OR_USER_REGISTERED_DATA_WITH_PROVENANCE
      may_feed_deterministic_nutrition_context: ONLY_IF_SOURCE_METHOD_CONFIDENCE_AND_USER_CONSENT_ALLOW
    QUICK_FOOD_PHOTO_ESTIMATE:
      role: TEMPORARY_CONTEXTUAL_ESTIMATE_FOR_IMMEDIATE_USER_CHOICE
      may_feed_deterministic_engine_as_FACT: PROHIBITED
      may_be_saved_as_CONFIRMED_RECORD:
        allowed_only_after_USER_REVIEW_AND_CONFIRMATION: true
  provenance_and_labels:
    labels:
      REGISTERED:
        use_when: DATA_WAS_LOGGED_OR_IMPORTED_BUT_NOT_OBJECTIVELY_MEASURED
      ESTIMATED:
        use_when: VALUE_DEPENDS_ON_PHOTO_USER_PORTION_OR_PROVIDER_ESTIMATION
      MEASURED:
        use_when: SOURCE_IS_A_VERIFIABLE_MEASUREMENT_METHOD
    preserve:
    - PROVIDER
    - INPUT_METHOD
    - ORIGINAL_CONFIDENCE_WHEN_AVAILABLE
    - TIMESTAMP
    - USER_CORRECTION
    imported_photo_estimate_remains_ESTIMATED: true
    provider_import_does_not_upgrade_to_MEASURED: true
    raw_or_unknown_provenance:
      label: REGISTERED_WITH_SOURCE_UNCERTAINTY
      user_visible: REQUIRED
  provider_and_accuracy_claims:
    generic_accuracy_percentages: PROHIBITED
    provider_claim_may_be_used_only_when:
    - CURRENT_PROVIDER_SPECIFIC_VALIDATION_EXISTS
    - TEST_METHOD_AND_SCOPE_ARE_DISCLOSED
    - FOOD_IDENTIFICATION_IS_DISTINGUISHED_FROM_PORTION_AND_NUTRIENT_ACCURACY
    - TERMS_ALLOW_USE_OF_THE_CLAIM
    specialized_market_exists:
      may_be_stated_without_PERFORMANCE_CLAIM: true
    provider_evaluation:
    - OFFICIAL_API_ACCESS
    - COMMERCIAL_TERMS
    - VALIDATION_QUALITY
    - INPUT_METHOD_PROVENANCE
    - REGIONAL_SUPPORT
    - PRIVACY_AND_RETENTION
  quick_photo_estimation:
    required_context:
    - TARGET_SESSION_OR_EVENT
    - TIME_UNTIL_SESSION
    optional_context:
    - RECENT_MEAL_CONTEXT
    - USER_CONFIRMED_PORTION
    - GASTROINTESTINAL_TOLERANCE
    - AGE_OR_MINOR_SAFETY_CONTEXT
    photo_only_personalized_answer: PROHIBITED
    allowed_output:
    - LIKELY_LOW_MEDIUM_OR_HIGH_CARBOHYDRATE_COMPONENT
    - PRACTICAL_COMPONENT_SUGGESTION
    - RANGE_WHEN_IMAGE_RECOGNITION_AND_PORTION_CONFIDENCE_ARE_SUFFICIENT
    exact_macro_value_as_FACT: PROHIBITED
    low_confidence:
      macro_range: HIDE
      required:
      - SAY_UNCERTAIN
      - ASK_SIMPLE_FOLLOW_UP_OR_ALLOW_MANUAL_CORRECTION
    user_correction:
      food_items: REQUIRED
      portion: REQUIRED_WHEN_RELEVANT
  image_handling:
    default_storage: DO_NOT_STORE_PERMANENTLY
    deletion:
      after_analysis_or_short_TECHNICALLY_REQUIRED_PERIOD: REQUIRED
      retention_period:
        versioned_and_disclosed: REQUIRED
    model_training_use:
      default: PROHIBITED
      separate_explicit_consent_required: true
    general_logs:
      image_or_sensitive_extracted_content: PROHIBITED
    metadata:
      remove_when_possible: REQUIRED
    pre_upload_preview:
      show_image_and_DATA_SENT: REQUIRED
    external_vision_provider:
      visible_to_user: REQUIRED
      data_processing_terms_and_region_review: REQUIRED
    user_control:
      delete_immediately: REQUIRED_WHEN_STORED_TEMPORARILY
      save_as_confirmed_meal:
        explicit: REQUIRED
  minors:
    default_activation:
      age_and_safety_gate: REQUIRED
      universal_default_on: PROHIBITED
    prohibited:
    - CALORIE_OR_WEIGHT_FOCUSED_FEEDBACK
    - GOOD_BAD_FOOD_SCORING
    - STREAKS_OR_ENGAGEMENT_GAMIFICATION_AROUND_FOOD_LOGGING
    - AUTOMATIC_PARENT_ACCESS_TO_PHOTOS_OR_DETAILED_INTAKE
    safeguards:
    - RESTRICTIVE_OR_OBSESSIVE_USE_PATTERN_CHECK
    - YOUTH_SAFETY_SETTING_CAN_DISABLE_CAPABILITY
    - NEUTRAL_FUEL_AND_RECOVERY_LANGUAGE
    - MINIMUM_DATA_RETENTION
    parent_or_guardian:
      raw_photo_visibility_default: false
      pattern_level_safety_route:
        only_when_LAWFUL_SAFE_AND_PURPOSE_LIMITED: true
  relation_to_nutrition_engine:
    imported_record:
      may_be_used_when:
      - USER_CONFIRMED_OR_PROVIDER_PROVENANCE_ACCEPTABLE
      - CONFIDENCE_AND_INPUT_METHOD_VISIBLE
    quick_photo_estimate:
      may_not_change_training_or_nutrition_plan_automatically: true
      may_not_be_counted_as_actual_intake_without_confirmation: true
    previous_confirmed_plan_preserved_on_failure: true
  errors_and_empty:
  - NO_TARGET_SESSION
  - INSUFFICIENT_IMAGE_QUALITY
  - FOOD_OR_PORTION_NOT_RECOGNIZED
  - LOW_CONFIDENCE
  - EXTERNAL_VISION_PROVIDER_UNAVAILABLE
  - CONSENT_NOT_GRANTED
  - MINOR_CAPABILITY_DISABLED
  - RETENTION_OR_DELETE_FAILED
  behavior:
    honest_uncertain_state: REQUIRED
    no_fake_macros: true
    no_photo_as_measured_data: true
    no_mock_personal_intake: true
  release_strategy:
    full_consumer_sparki_release_blocked_by_this_capability: false
    phased_activation:
    - IMPORTED_NUTRITION_RECORD_DISPLAY
    - QUICK_FOOD_PHOTO_ESTIMATION
    - MINOR_SAFE_USE
    each_capability_requires_own_gate: true
  release_gates:
    IMPORTED_NUTRITION_RECORD_DISPLAY:
    - REGISTERED_ESTIMATED_AND_MEASURED_LABELS_TESTED
    - PROVIDER_INPUT_METHOD_AND_CONFIDENCE_PRESERVED
    - IMPORTED_PHOTO_ESTIMATE_NOT_UPGRADED_TO_MEASURED
    QUICK_FOOD_PHOTO_ESTIMATION:
    - SESSION_AND_TIME_CONTEXT_REQUIRED
    - LOW_CONFIDENCE_HIDES_MACRO_RANGE
    - NO_AUTOMATIC_PLAN_OR_ENGINE_MUTATION
    - IMAGE_RETENTION_DELETE_METADATA_LOGGING_AND_PROVIDER_DISCLOSURE_TESTED
    MINOR_SAFE_USE:
    - AGE_AND_SAFETY_GATE_TESTED
    - NO_CALORIE_WEIGHT_SCORE_STREAK_OR_GOOD_BAD_FOOD_FEEDBACK
    - NO_DEFAULT_PARENT_PHOTO_ACCESS
    - RESTRICTIVE_OR_OBSESSIVE_USE_GUARD_TESTED
  build_sequence:
    execution_mode: SEQUENTIAL
    one_active_replit_task_maximum: 1
    FP_00:
      name: CURRENT_STATE_PROVIDER_AND_PRIVACY_AUDIT
      objective: AUDIT_EXISTING_NUTRITION_IMPORT_IMAGE_UPLOAD_VISION_STORAGE_LOGGING_MINOR_AND_CONSENT_CODE_WITHOUT_CODE_CHANGE
      code_change: PROHIBITED
    FP_01:
      name: NUTRITION_PROVENANCE_AND_LABELS
      objective: BUILD_REGISTERED_ESTIMATED_AND_MEASURED_PROVENANCE_MODEL_AND_COMPACT_IMPORTED_RECORD_DISPLAY
    FP_02:
      name: QUICK_PHOTO_ESTIMATION
      objective: BUILD_CONTEXT_REQUIRED_COARSE_ESTIMATION_WITH_CONFIDENCE_RANGES_AND_USER_CORRECTION
    FP_03:
      name: IMAGE_PRIVACY_AND_RETENTION
      objective: BUILD_PREVIEW_PROVIDER_DISCLOSURE_TEMPORARY_RETENTION_DELETE_METADATA_AND_LOGGING_CONTROLS
    FP_04:
      name: MINOR_SAFE_USE
      objective: BUILD_AGE_AND_SAFETY_GATES_WITHOUT_CALORIE_WEIGHT_GAMIFICATION_OR_DEFAULT_PARENT_PHOTO_ACCESS
    FP_05:
      name: CAPABILITY_RELEASE_EVIDENCE
      objective: PRODUCE_PROVENANCE_ACCURACY_UNCERTAINTY_IMAGE_PRIVACY_MINOR_SAFETY_PROVIDER_AND_USER_ACCEPTANCE_EVIDENCE
    task_order:
    - FP_00
    - FP_01
    - FP_02
    - FP_03
    - FP_04
    - FP_05
