session_close_protocol:
  update_at_end_of_session:
  - completed tasks with task acceptance and evidence status
  - master plan consistency check for every status change
  - changed files and produced artifacts
  - estimated versus actual effort and direct cost when observable
  - decisions made today
  - newly found blockers and risks
  - exact next Replit assignment
  - items that must not be reopened without evidence
  resume_instruction: At the next session, read the active master plan, latest addendum and newest day card first. Continue
    with the listed active or next task and do not redefine the roadmap unless repository evidence requires it.
replit_protocol:
  mode: APPEND_ONLY
  authority:
    product_decisions: RENE_CHATGPT
    repository_facts: REPLIT
  instructions:
  - READ_DAYCARD_FIRST
  - EXECUTE_ACTIVE_TASK_ONLY
  - INSPECT_AND_REUSE_EXISTING_CODE
  - USE_REPOSITORY_AS_TECHNICAL_SOURCE
  - NO_SCOPE_EXPANSION
  - NO_PARALLEL_SYSTEMS
  - NO_UNAPPROVED_PRODUCT_DECISIONS
  - NO_FULL_DAYCARD_REWRITE
  - STOP_AFTER_ACTIVE_TASK
  replit_may_add:
  - REP_STATE
  - REP_CHANGED_FILES
  - REP_TEST_RESULTS
  - REP_ARTIFACTS
  - REP_REGRESSIONS
  - REP_BLOCKERS
  - REP_TECH_RISKS
  - REP_NEXT_RECOMMENDATION
  replit_may_not_change:
  - DECISIONS
  - SCOPE
  - PRIORITY
  - RELEASE_ORDER
  - UX_RULES
  - ARCHITECTURE_RULES
  - SOURCE_OF_TRUTH
  - ACTIVE_TASK
  proposals:
    key: REP_PROPOSAL
    required_status: PENDING_RENE_CHATGPT_APPROVAL
    auto_apply: false
  required_output:
    format: YAML_PATCH_ONLY
    prose: false
    full_daycard_rewrite: false
  completion_output_template:
    REP_STATE: null
    REP_CHANGED_FILES: []
    REP_TEST_RESULTS: []
    REP_ARTIFACTS: []
    REP_REGRESSIONS: []
    REP_BLOCKERS: []
    REP_TECH_RISKS: []
    REP_NEXT_RECOMMENDATION: null
    REP_PROPOSAL:
      STATUS: PENDING_RENE_CHATGPT_APPROVAL
      ITEMS: []
daycard_update_policy:
  owner: CHATGPT
  mode: AUTO_UPDATE_DURING_ACTIVE_CONVERSATION
  update_triggers:
  - MATERIAL_DECISION
  - TASK_COMPLETED
  - NEW_BLOCKER
  - REPLIT_ADDENDUM_RECEIVED
  - NEXT_STEP_CHANGED
  - SOURCE_OF_TRUTH_CHANGED
  after_update:
    show_compact_changelog: true
    show_download_link: true
    show_full_daycard: false
    wait_for_user_request: false
  limitations:
  - NO_BACKGROUND_UPDATES_OUTSIDE_ACTIVE_CONVERSATION
  - NO_SILENT_PRODUCT_DIRECTION_CHANGES
  - NO_REPLIT_PATCH_AUTO_ACCEPTANCE_WITHOUT_REVIEW
release_clarification_protocol:
  mode: SPECIFY_WHILE_REPLIT_BUILDS
  parallel_code_tasks: false
  goal: Resolve only product decisions that cannot be derived safely from the repository.
  rules:
  - DO_NOT_INTERRUPT_ACTIVE_REPLIT_TASK
  - NO_SECOND_BUILD_TASK_IN_PARALLEL
  - ASK_MINIMUM_DECISION_SET
  - ENCODE_APPROVED_ANSWERS_IN_DAYCARD
  - CONVERT_APPROVED_DECISIONS_TO_NEXT_TECHNICAL_TASK
  clarification_order:
  - REL_01_RELEASE_PACKAGING_AND_SUBSCRIPTIONS
  - REL_02_ROUTES_AND_NAVIGATION_SCOPE
  - REL_03_DATA_TRUST_AND_ADMIN_CLEANUP_POLICY
  - REL_04_LEGAL_PRIVACY_ACCESSIBILITY
  - REL_05_NEAR_COMPLETE_MODULE_CLOSURE_ORDER
  already_clear:
