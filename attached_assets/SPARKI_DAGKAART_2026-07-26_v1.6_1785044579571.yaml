meta:
  project: Sparki
  document_type: day_card
  date: 2026-07-26
  version: 1.6
  purpose: Daily continuity record used alongside the versioned AI Master Plan so that decisions, active work, blockers,
    evidence and the next step are preserved between sessions.
source_of_truth:
  master_plan: SPARKI_AI_MASTER_PLAN_v2.33.yaml
  session_addendum: SPARKI_SESSION_ADDENDUM_2026-07-25.yaml
  rule: The current repository plus the active master plan and session addendum remain authoritative. This day card records
    today's decisions and execution order; it does not replace the master plan.
working_method:
  max_active_tasks: 1
  agent_first: true
  replit_agent_instruction_rule: Every Replit assignment must state whether it is agent-executable, what the agent may
    decide independently, the exact technical result, what may not be changed, mandatory tests, proof artifacts and whether
    human acceptance is still required.
  architecture_rule: First inspect and reuse existing code. Do not create parallel systems, rewrite working engines,
    change API or data models without necessity, or introduce mock, demo, seed, fallback or hardcoded personal data.
  completion_rule: A task may receive TASK_ACCEPTANCE_PERCENT 100 only after all task-specific behavior, regression tests,
    browser validation and evidence artifacts are independently verified. This task score never upgrades DOMAIN_READINESS.
release_1_direction:
  products:
  - Sparki GO
  - Sparki Complete
  release_blockers_in_order:
  - CUX_01R1 independently close and prove
  - Close data-trust and admin-cleanup
  - Reliably finish routes and navigation
  - Build and prove entitlements, subscriptions and payments
  - Close Dutch legal, privacy and accessibility gates
active_task:
  id: CUX_01R1
  title: Definitively close Today screen mobile and desktop
  status: ready_for_replit_assignment
  required_outcomes:
  - Mobile and desktop Today screen satisfy all agreed presentation rules
  - Mobile season card is visible and reachable by normal scrolling
  - Week order is always Ma-Di-Wo-Do-Vr-Za-Zo
  - Exactly one status pill with label Belastbaar
  - Main text is exactly: Je bent goed belastbaar.
  - Trend text is exactly: Nog onvoldoende recente gegevens voor een betrouwbare trend.
  - Empty training state and existing plan action work
  - Existing season, plan, routes, engines, APIs and data models are reused
  - Unit, component, browser, typecheck and relevant regression tests pass
  required_evidence:
  - Mobile screenshot 390x844 at top
  - Mobile screenshot 390x844 with season card visible
  - Desktop screenshot 1440x900
  - Machine-readable test output
  - List of commands and results
  domain_id: TODAY
  domain_readiness_from_master_plan: SPECIFICATION_READY
  evidence_status: BUILT_UNPROVEN
  task_acceptance:
    current_percent: 92
    target_percent: 100
    meaning: TASK_SPECIFIC_ONLY
    upgrades_domain_readiness: false
  cost_expectation:
    threshold_applies: true
    estimated_effort_hours_range: 2-5
    cost_expectation_level: MEDIUM
    estimated_direct_cost_eur: UNKNOWN
    cost_basis: Task breadth; actual Replit usage pricing not supplied in evidence.
    actual_effort_hours: PENDING
    actual_direct_cost_eur: PENDING_PLATFORM_OR_USER_DATA
next_task:
  id: CUX_02
  title: Sparki Visual Atmosphere System
  status: blocked_until_CUX_01R1_passes
  agent_executable: true
  scope_order:
  - Today screen first
  - Then routes and navigation
  - Then post-activity screens
  - Then planning and other primary screens
  design_direction:
  - Keep the interface white, clean, calm and readable
  - Add more sport atmosphere and emotion without copying Komoot or Strava
  - 'Let real sport context create the atmosphere: route maps, altitude profiles, activity photos, terrain, race context
    and genuine user data'
  - Use subtle contextual color surfaces, controlled depth and stronger Sparki accents
  - Maximum one dominant visual element per screen
  - Never invent personal, route, training or performance data to fill empty states
  - Preserve accessibility, simplicity and data-trust
  execution_rule: Do not combine CUX_02 with CUX_01R1. Functional acceptance comes first; the visual atmosphere layer
    is a separate controlled task to keep regressions attributable.
ux_reference_principles:
  komoot: The outdoor environment, map, route, elevation, terrain and real photos provide the atmosphere; the surrounding
    interface stays calm.
  strava: The completed sport performance, route shape, statistics, achievements, photos and shareable summaries provide
    the atmosphere.
  sparki: 'The current personal sport context determines the central visual element: planned training before exercise,
    real activity after exercise, calm recovery context, or course and race context around competition.'
