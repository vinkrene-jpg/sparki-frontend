  - CYCLING_FIRST
  - GO_AND_COMPLETE_AS_PROVISIONAL_RELEASE_PACKAGING
  - NO_PARALLEL_SYSTEMS
  - AGENTS_FIRST_TESTING
  - NETHERLANDS_FIRST_RELEASE
  - CUX_02_AFTER_CUX_01R1
  open_decisions:
  - FINAL_TIER_CONTENT
  - FINAL_PRICE_AND_TRIAL
  - PAYMENT_CHANNEL
  - ROUTE_NAVIGATION_MINIMUM_ACCEPTANCE
  - DATA_CLEANUP_APPLY_POLICY
  - AGE_AND_PARENTAL_CONSENT_BOUNDARIES
  - CANCELLATION_REFUND_SUPPORT_RULES
  - ACCESSIBILITY_ACCEPTANCE_LEVEL
