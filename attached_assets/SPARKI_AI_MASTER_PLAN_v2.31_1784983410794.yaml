schema: sparki.master_plan
schema_version: 1

document:
  id: SPARKI_AI_MASTER_PLAN
  version: "2.31"
  date: "2026-07-25"
  format: YAML
  language_mode: controlled_english_identifiers
  audience:
    - AI_ORCHESTRATOR
    - REPLIT_AGENT
  status: AUTHORITATIVE_PRODUCT_TARGET
  technical_state_status: PARTIALLY_EVIDENCED
  domain_production_spec_status: RETROACTIVE_COMPLETION_IN_PROGRESS
  build_authority: USER_REQUEST_REQUIRED
  predecessor:
    file: SPARKI_AI_MASTER_PLAN_v2.30.yaml
    status: SUPERSEDED
    change_reason:
      - ASSISTANT_USER_AND_REPLIT_COMMUNICATION_GOVERNANCE_HARDENED
      - REPLIT_SELF_APPROVAL_PROHIBITED
      - MACHINE_EXECUTABLE_GATE_VALIDATION_REQUIRED
      - WARNING_DEFERRED_DEFECT_OR_MISSING_EVIDENCE_FORCES_FAIL
      - ASSISTANT_VALIDATION_REQUIRED_BEFORE_COMPLETION_COMMUNICATION
      - EVIDENCE_PACKAGE_INTEGRITY_AND_PROVENANCE_REQUIRED
  migration_history:
    - source: SPARKI_AI_MASTER_PLAN_v2.24_EXECUTABLE_PRODUCT_SPECIFICATION_FRAMEWORK.md
      status: SUPERSEDED
      defects:
        - VERSION_HEADER_2_14_CONFLICTED_WITH_FILENAME_2_24
        - SESSION_VERSION_2_17_CONFLICTED_WITH_FILENAME_2_24
        - HUMAN_PROSE_AND_MACHINE_CONTRACTS_MIXED
        - DUPLICATE_AND_STALE_DECISIONS
        - COLLABORATION_CONTRACT_MISSING
        - ACTIVE_ROADMAP_GAME_REMOVAL_MISSING
        - CURRENT_ADMIN_CLEANUP_EVIDENCE_MISSING
  invariants:
    - ONE_DOCUMENT_VERSION
    - NO_SILENT_SCOPE_CHANGE
    - NO_OPEN_DECISION_INVENTION
    - NEWEST_EXPLICIT_USER_DECISION_WINS
    - CURRENT_CODE_WINS_FOR_TECHNICAL_FACTS
    - MASTER_PLAN_WINS_FOR_TARGET_PRODUCT_RULES

precedence:
  order:
    - rank: 1
      source: CURRENT_WORKING_CODE_AND_RUNTIME_EVIDENCE
      scope: CURRENT_TECHNICAL_STATE
    - rank: 2
      source: EXPLICIT_USER_DECISION
      scope: PRODUCT_DIRECTION_AND_CONSTRAINTS
      ordering: NEWEST_FIRST
    - rank: 3
      source: THIS_MASTER_PLAN
      scope: TARGET_STATE_AND_BUILD_GOVERNANCE
    - rank: 4
      source: VERIFIED_PRIMARY_EXTERNAL_SOURCE
      scope: MARKET_TECHNICAL_LEGAL_AND_INTEGRATION_FACTS
    - rank: 5
      source: OLDER_ROADMAP_OR_CONVERSATION
      scope: HISTORICAL_CONTEXT_ONLY
  conflict_protocol:
    detect: REQUIRED
    auto_resolve_when_precedence_is_unambiguous: true
    preserve_superseded_record: true
    ask_user_only_when:
      - FUNDAMENTAL_PRODUCT_CHOICE_REMAINS_OPEN
      - SAME_PRIORITY_SOURCES_CONFLICT
      - CODE_CONFLICT_CHANGES_PRODUCT_INTENT
    prohibit:
      - ASSISTANT_MEMORY_AS_PROJECT_SOURCE
      - UNVERIFIED_ASSISTANT_CLAIM_AS_DECISION
      - OLD_CONVERSATION_OVERRIDE_OF_NEW_DECISION

collaboration_contract:
  authority:
    product_owner: RENE
    assistant_role:
      - RESEARCH_OWNER
      - SPECIFICATION_OWNER
      - CONSISTENCY_OWNER
      - EVIDENCE_OWNER
      - COMPETITIVE_REVIEW_OWNER
    replit_role:
      - IMPLEMENT_APPROVED_SMALL_TASK
      - REPORT_EVIDENCE
      - NO_PRODUCT_DECISION_AUTHORITY
  user_review_model:
    user_reads_or_reviews_master_plan: false
    user_controls_by_questions: true
    assistant_must_answer_from_evidence: true
    assistant_owns_document_validation: true
    user_approval_of_document_text_required: false
    user_request_before_product_build_required: true
  confirmed_feature_ingestion:
    same_revision_production_spec: REQUIRED
    title_or_idea_only_entry: PROHIBITED
    minimum_same_revision_content:
      - PRODUCT_PURPOSE
      - COMMERCIAL_VALUE
      - COMPETITIVE_RESEARCH
      - END_TO_END_FLOW
      - DATA_MODEL
      - API_CONTRACT
      - ROLE_PERMISSION_PRIVACY
      - DETERMINISTIC_AND_AI_BOUNDARIES
      - ERROR_AND_EMPTY_STATES
      - PHASED_REPLIT_TASKS
      - TESTS
      - ACCEPTANCE
      - RELEASE_GATES
      - EVIDENCE_REQUIREMENTS
    unresolved_nonblocking_detail:
      action: OPEN_DECISION_WITH_REQUIRED_BEFORE_GATE
    missing_production_spec:
      feature_status: NOT_VALIDLY_ADDED_TO_MASTER_PLAN
  retroactive_domain_completion:
    scope: ALL_DOMAIN_REGISTRY_ENTRIES
    process: CONTROLLED_QUESTION_BATCHES
    questions_per_batch_max: 10
    questions_must_be:
      - FUNDAMENTAL_PRODUCT_DECISION
      - NOT_ALREADY_CONFIRMED
      - NOT_IMPLEMENTATION_DETAIL_OWNED_BY_ASSISTANT_OR_REPLIT
    filler_question: PROHIBITED
    batch_may_span_domains: true
    after_question_10_answer:
      - APPLY_ALL_BATCH_DECISIONS_TO_NEXT_MASTER_PLAN_VERSION
      - ADD_OR_COMPLETE_PRODUCTION_CONTRACTS
      - ADD_PHASED_REPLIT_TASKS
      - VALIDATE_DOCUMENT
      - PRESERVE_STABLE_LIBRARY_ID
    batch_with_fewer_than_10_remaining_questions:
      action: CLOSE_AND_APPLY_WITHOUT_FILLER
    user_review_of_document: NOT_REQUIRED
    user_control: ANSWER_AND_LATER_QUESTION
  communication:
    style: BUSINESS_DIRECT
    pleasing_behavior: PROHIBITED
    functional_disagreement: REQUIRED
    max_explanation_sentences: 10
    preferred_explanation_sentences: LESS_THAN_10
    invented_context: PROHIBITED
    invented_fact: PROHIBITED
    invented_decision: PROHIBITED
    uncertainty:
      disclose: REQUIRED
      convert_to_fact: PROHIBITED
    question_policy:
      ask_only_real_product_decisions: true
      ask_for_sake_of_asking: false
      ask_detail_implied_by_confirmed_rules: false
      only_fundamental_choices_return_to_user: true
    continuity:
      reask_confirmed_choice: PROHIBITED
      reopen_only_for:
        - NEW_EVIDENCE
        - CURRENT_CODE_CONFLICT
        - MARKET_CHANGE
        - SAFETY_OR_LEGAL_CONFLICT
      process_new_answer_into_next_document_version: REQUIRED
    completion_communication:
      status_vocabulary:
        - REPLIT_REPORTED
        - ASSISTANT_VALIDATION_PENDING
        - ASSISTANT_VALIDATED
        - REJECTED_WITH_BLOCKERS
      replit_report_is_completion_proof: false
      assistant_may_report_complete_only_when: ASSISTANT_VALIDATED
      assistant_must:
        - SEPARATE_REPLIT_CLAIM_FROM_VALIDATED_STATE
        - VALIDATE_REQUIRED_ARTIFACTS_AND_MACHINE_RESULTS
        - DISCLOSE_EACH_BLOCKER_DIRECTLY
        - STATE_EXACT_NEXT_CORRECTION_WHEN_REJECTED
        - OWN_SPECIFICATION_DEFECTS_WHEN_ACCEPTANCE_WAS_UNDERSPECIFIED
      assistant_must_not:
        - ACCEPT_SELF_ASSERTED_PASS
        - CONVERT_REPLIT_PROSE_TO_VALIDATED_FACT
        - HIDE_WARNING_OR_DEFERRED_DEFECT_BEHIND_OPEN_GATES_ZERO
    replit_instruction_communication:
      every_acceptance_gate_requires:
        - MACHINE_EXECUTABLE_VALIDATION_COMMAND
        - EXPECTED_EXIT_CODE
        - EXPECTED_MACHINE_READABLE_RESULT
        - FAILURE_CONDITION
        - EVIDENCE_ARTIFACT_PATH
      gate_result_rule:
        PASS_requires:
          - COMMAND_EXIT_CODE_ZERO
          - ZERO_UNRESOLVED_WARNINGS
          - ZERO_DEFERRED_IN_SCOPE_DEFECTS
          - ZERO_MISSING_EVIDENCE
          - ACCEPTANCE_THRESHOLD_MET_WITHOUT_PRESENTATION_ROUNDING
        FAIL_when_any:
          - COMMAND_NONZERO
          - WARNING_PRESENT
          - IN_SCOPE_DEFECT_DEFERRED
          - EVIDENCE_MISSING
          - PROVENANCE_AMBIGUOUS
          - CHECKSUM_VALIDATION_FAILS
      replit_authority:
        may_implement: true
        may_report_test_results: true
        may_self_approve_completion: false
        may_set_open_gates_zero_without_machine_evidence: false
      evidence_package:
        required:
          - CLEAN_WORKTREE_STATE
          - EXACT_SOURCE_COMMIT_SHA
          - GENERATED_AT
          - MACHINE_READABLE_GATE_RESULTS
          - RAW_TEST_RESULTS
          - COMPLETE_CHECKSUM_MANIFEST
        checksum_manifest_may_hash_itself: false
        checksum_validation_exit_code: 0
      separate_passes:
        implementation: REQUIRED
        validation_after_implementation: REQUIRED
        validation_may_not_rely_on_implementation_summary: true
  legacy_communication_list:
    claimed_count: 17
    claimed_origin:
      user_points: 14
      assistant_additions: 3
    exact_source_recovered: false
    reconstruction_by_assumption: PROHIBITED
    current_explicit_contract_wins: true

