schema: sparki.production_order
version: "1.0"

task:
  id: UX_01
  mode: BOUNDED_PRODUCTION_BUILD
  objective: IMPLEMENT_COMMERCIAL_LIGHT_SHELL_AND_TODAY_MOBILE_DESKTOP
  authority:
    figma_file_key: "wDUBmQvIFFDpaah5JyskFp"
    mobile_frame: "30:96"
    desktop_frame: "30:143"
    mapping: docs/UX_00B_FIGMA_CODE_MAPPING.yaml

commercial_gate:
  rule: NO_NEW_FEATURE_BUILD_UNTIL_COMMERCIAL_UX_GATE_PASSES
  purpose: MAKE_EXISTING_SPARki_CAPABILITY_CLEAR_TRUSTWORTHY_AND_SELLABLE
  no_scope_expansion_from_DISCOVERED_IDEAS: true

phase_0_preflight:
  mode: READ_ONLY
  required:
    - VERIFY_CURRENT_HEAD_BRANCH_AND_CLEAN_WORKTREE
    - RESOLVE_REAL_ROUTE_AND_SHELL_INTEGRATION_BOUNDARY
    - RESOLVE_EXACT_EXISTING_FEATURE_FLAG_DEFINITION_AND_SEED_PATH
    - RESOLVE_CURRENT_DAYHOME_DATA_HOOKS_AND_LOADING_EMPTY_ERROR_STATES
    - CONFIRM_NO_REWRITE_OR_PARALLEL_DATA_FLOW_REQUIRED
  automatic_stop_conditions:
    - WORKTREE_NOT_CLEAN_BEFORE_TASK
    - EXACT_FLAG_PATH_NOT_PROVEN
    - MORE_THAN_8_PRODUCTION_FILES_REQUIRED
    - API_SCHEMA_DATABASE_OR_ENGINE_CHANGE_REQUIRED
    - CURRENT_TODAY_DATA_CANNOT_BE_REUSED
  continuation_rule: CONTINUE_DIRECTLY_ONLY_IF_ALL_GATES_PASS

implementation:
  required:
    - ADD_LIGHT_FIRST_COMMERCIAL_TOKENS_WITHOUT_REMOVING_EXISTING_DARK_TOKENS
    - CREATE_ONE_RESPONSIVE_APPSHELL_REUSED_BY_MOBILE_AND_DESKTOP
    - MOBILE_AT_390x844_MATCH_FRAME_30_96
    - DESKTOP_AT_1440x900_MATCH_FRAME_30_143
    - REUSE_EXISTING_TODAY_DATA_HOOKS_ENGINES_EXPLANATIONS_AND_ACTIONS
    - PRESERVE_ONE_PRIMARY_ACTION_AND_EXISTING_ATTENTION_PRIORITY
    - MOBILE_NAV_TODAY_PLAN_RIDING_ACTIVITIES_MORE
    - DESKTOP_PERSISTENT_LEFT_NAV_AND_EXISTING_ACCOUNT_UTILITY
    - SHOW_REAL_LOADING_EMPTY_ERROR_AND_PARTIAL_DATA_STATES
    - ADD_FEATURE_FLAG_commercial_shell_DEFAULT_OFF
    - ADD_DEV_ONLY_PREVIEW_ENTRY_USING_EXISTING_DEV_PREVIEW_MECHANISM
    - RETURN_EXACT_PREVIEW_URL_IN_COMPLETION_RESPONSE
  visual_details:
    preserve:
      - SPARKI_WORDMARK
      - CYAN_ACCENT
      - EXISTING_DOMAIN_LANGUAGE
    implement:
      - LIGHT_NEUTRAL_BACKGROUND
      - WHITE_CARDS
      - CLEAR_HIERARCHY
      - LARGE_READABLE_TYPE
      - RESTRAINED_BORDERS_AND_RADIUS
      - MOBILE_COMPACTNESS_WITHOUT_HIDDEN_PRIMARY_INFORMATION
      - DESKTOP_FULL_INFORMATION_DENSITY

allowed_change_categories:
  - EXISTING_GLOBAL_TOKEN_FILE
  - ONE_NEW_APPSHELL_COMPONENT
  - VERIFIED_TODAY_ROUTE_OR_WRAPPER_BOUNDARY
  - VERIFIED_DAYHOME_PRESENTATION_COMPONENTS
  - EXISTING_NAVIGATION_SSOT_ONLY_WHEN_REQUIRED
  - EXACT_EXISTING_FEATURE_FLAG_DEFINITION_OR_SEED
  - EXISTING_DEV_PREVIEW_REGISTRY
  - TESTS_AND_VISUAL_TEST_CONFIG

prohibited:
  - NEW_PROJECT
  - FIGMA_IMPORT_AS_NEW_REACT_PROJECT
  - REWRITE_OF_EXISTING_ARCHITECTURE
  - NEW_DATA_HOOK_OR_PARALLEL_DATA_FLOW
  - API_CHANGE
  - DATABASE_OR_SCHEMA_CHANGE
  - ENGINE_OR_COACHING_LOGIC_CHANGE
  - MOCK_SEED_DEMO_OR_FALLBACK_PERSONAL_DATA
  - OTHER_PAGE_REDESIGN
  - GO_COMPLETE_OR_CLUB_ENTITLEMENT_BUILD
  - SUBSCRIPTION_OR_PAYMENT_BUILD
  - EXTERNAL_RESEARCH
  - ARCHITECT_SUBAGENT
  - EVIDENCE_ZIP
  - REPEATED_REPORT_REWRITE
  - PUBLICATION_OR_DEPLOYMENT

acceptance:
  functional:
    - FLAG_OFF_EQUALS_CURRENT_TODAY_BEHAVIOR
    - FLAG_ON_USES_SAME_REAL_USER_DATA_AND_ACTIONS
    - LOADING_EMPTY_ERROR_AND_PARTIAL_STATES_DO_NOT_LIE
    - MOBILE_AND_DESKTOP_NAV_TARGETS_RESOLVE
  visual:
    - SCREENSHOT_390x844_COMPARED_WITH_30_96
    - SCREENSHOT_1440x900_COMPARED_WITH_30_143
    - NO_HORIZONTAL_OVERFLOW
    - NO_CLIPPED_TEXT_OR_OVERLAPPING_ACTIONS
    - WCAG_AA_FOR_TEXT_CONTROLS_AND_FOCUS
  regression:
    - EXISTING_test_day_type_PASS
    - EXISTING_test_core_profile_PASS
    - EXISTING_test_core_profile_evolution_PASS
    - EXISTING_test_session_analysis_PASS
    - TYPECHECK_PASS_FOR_TOUCHED_WORKSPACE
    - PRODUCTION_BUILD_PASS_FOR_TOUCHED_WORKSPACE
    - NEW_SHELL_RESPONSIVE_TESTS_PASS

cost_and_runaway_control:
  maximum_production_files_changed: 8
  maximum_new_runtime_dependencies: 0
  maximum_feature_flags_added: 1
  maximum_routes_added: 1
  route_type: DEV_ONLY_PREVIEW
  if_acceptance_fails_after_two_targeted_fix_rounds: STOP_AND_REPORT
  no_unrequested_follow_up_tasks: true

rollback:
  primary: SET_commercial_shell_FALSE
  code_boundary: REMOVE_NEW_APPSHELL_AND_DEV_PREVIEW_ENTRY
  data_migration_required: false

completion_response:
  max_lines: 12
  include:
    - PREFLIGHT_PASS_OR_STOP_REASON
    - EXACT_CHANGED_FILES
    - TEST_COMMANDS_AND_RESULTS
    - MOBILE_AND_DESKTOP_VISUAL_RESULT
    - DEV_PREVIEW_URL
    - FLAG_DEFAULT_AND_ROLLBACK
    - GIT_STATUS
  stop_after_response: true
