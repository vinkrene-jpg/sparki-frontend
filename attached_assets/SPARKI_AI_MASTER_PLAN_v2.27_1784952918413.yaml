    change_reason:
      - EQUIPMENT_BIKE_FIT_CONFIRMED
      - EQUIPMENT_BIKE_FIT_PRODUCTION_CONTRACT_ADDED
      - SAME_REVISION_PRODUCTION_SPEC_RULE_ADDED
  migration_history:
