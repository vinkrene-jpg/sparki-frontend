    - STANDARD_OWNER
    - PEER_REVIEWED_RESEARCH
    - REGULATOR
    - RELIABLE_SECONDARY_SOURCE
  output_required:
    - DATE_CHECKED
    - SOURCE_URL
    - FACT
    - PRODUCT_IMPACT
    - CONFIDENCE
  stale_research_policy:
    time_sensitive_claim_requires_recheck: true
    unsupported_claim_must_not_drive_build: true
  failure_definition:
    later_user_question_reveals_foreseeable_major_omission: ASSISTANT_RESEARCH_FAILURE

economic_contract:
  primary_objective: PROFITABLE_SCALABLE_PRODUCT
  decision_filters:
    - USER_VALUE
    - WILLINGNESS_TO_PAY
    - COMPETITIVE_STRENGTH
    - DEVELOPMENT_COST
    - OPERATING_COST
    - SUPPORT_COST
    - VENDOR_DEPENDENCY
    - RETENTION_VALUE
    - MARKET_SHARE_POTENTIAL
  quality_rule:
    every_commercial_core_domain:
      minimum: EXCELLENT
      comparison: BEST_RELEVANT_SPECIALIST_PRODUCTS
      superficial_breadth: PROHIBITED
      technically_present_but_untrusted: NOT_COMMERCIAL_READY
  stop_or_challenge_when:
    - FUNCTION_HAS_NO_CLEAR_USER_OR_COMMERCIAL_VALUE
    - FUNCTION_WEAKENS_CORE_QUALITY
    - FUNCTION_CREATES_UNCONTROLLED_MAINTENANCE_COST
    - FUNCTION_DUPLICATES_EXISTING_ARCHITECTURE
    - FUNCTION_INCREASES_VENDOR_LOCK_IN_WITHOUT_UNIQUE_VALUE

